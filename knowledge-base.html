k the leaves.", "A clustered index stores rows in key order (one per table, usually the primary key); secondary indexes point to it. Composite indexes follow the leftmost-prefix rule."], "points": ["Indexes speed reads but slow writes and use space", "Covering index answers a query from the index alone", "Hash indexes: equality only, no ranges", "Use EXPLAIN to see the query plan"], "code": "", "pit": ["Indexing low-cardinality columns (gender) expecting gains", "Applying a function to an indexed column in WHERE stops index use"], "ask": ["How does an index speed up a query?", "Why B+ tree and not a binary tree or hash?", "Clustered vs non-clustered?"], "prac": [], "learn": [["Use The Index, Luke (free)", "https://use-the-index-luke.com"], ["CMU 15-445", "https://15445.courses.cs.cmu.edu"]], "rel": ["normalisation", "sql"]}, {"id": "sql", "title": "SQL for interviews", "cat": "Core CS", "lvl": 1, "why": "Many OAs include 1–2 SQL questions; analyst-flavoured and backend roles always do.", "core": ["Order of evaluation: FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. WHERE filters rows, HAVING filters groups.", "Joins: INNER (matches only), LEFT (all left rows), self-join (employee–manager), anti-join (LEFT JOIN … WHERE right.id IS NULL).", "Window functions compute over a partition without collapsing rows: ROW_NUMBER, RANK, DENSE_RANK, LAG/LEAD, running SUM() OVER (ORDER BY …)."], "points": ["DENSE_RANK for 'Nth highest' with ties", "COUNT(col) ignores NULLs, COUNT(*) doesn't", "Parameterised queries prevent SQL injection"], "code": "SELECT dept, name, salary FROM (\n  SELECT d.name AS dept, e.name, e.salary,\n         DENSE_RANK() OVER (PARTITION BY e.dept_id ORDER BY e.salary DESC) AS r\n  FROM employee e JOIN department d ON d.id = e.dept_id\n) t WHERE r = 2;", "pit": ["Using WHERE with an aggregate", "Forgetting NULL handling in comparisons"], "ask": ["Second-highest salary per department.", "Find duplicate emails.", "Difference between RANK and DENSE_RANK?"], "prac": [["LeetCode SQL 50", "https://leetcode.com/studyplan/top-sql-50/"], ["SQLBolt", "https://sqlbolt.com"]], "learn": [["SQLBolt", "https://sqlbolt.com"], ["Mode SQL tutorial", "https://mode.com/sql-tutorial/"]], "rel": ["indexing", "sqli"]}, {"id": "osi-tcpip", "title": "OSI and TCP/IP models", "cat": "Core CS", "lvl": 1, "why": "The first Computer Networks question in most interviews, and the vocabulary for everything in security.", "core": ["OSI has 7 layers: Physical, Data link (MAC, switches), Network (IP, routers), Transport (TCP/UDP, ports), Session, Presentation, Application. TCP/IP merges them into 4: Link, Internet, Transport, Application.", "Each layer wraps the one above with its own header (encapsulation): HTTP data → TCP segment → IP packet → Ethernet frame."], "points": ["Devices: hub (L1), switch (L2), router (L3)", "ARP maps IP → MAC", "Subnetting: /24 = 256 addresses, 254 usable hosts"], "code": "", "pit": ["Putting TLS or HTTP at the wrong layer without explaining"], "ask": ["Explain the OSI model.", "Which layer does a router work at?", "What is ARP?"], "prac": [], "learn": [["Gate Smashers (YouTube)", "https://www.youtube.com/@GateSmashers"], ["Computer Networking: A Top-Down Approach (Kurose)", "https://gaia.cs.umass.edu/kurose_ross/index.php"]], "rel": ["tcp-udp", "url-flow"]}, {"id": "tcp-udp", "title": "TCP vs UDP and the handshake", "cat": "Core CS", "lvl": 1, "why": "Asked in nearly every CN round; the 'why not 2-way?' follow-up catches people out.", "core": ["TCP is connection-oriented and reliable: ordered delivery, retransmission, flow control (receiver window) and congestion control (slow start, congestion avoidance, fast retransmit). UDP is connectionless with no guarantees but low overhead and latency.", "Handshake: client SYN (seq x) → server SYN-ACK (seq y, ack x+1) → client ACK (ack y+1). Three steps are needed so both sides confirm the other received their initial sequence number; two would leave the server unsure the client saw its SYN, and stale duplicate SYNs could open ghost connections.", "Closing uses FIN/ACK in four steps; TIME_WAIT keeps the socket around to absorb late packets."], "points": ["Use UDP for video calls, games, DNS, live streams; QUIC builds reliability on UDP", "Flow control protects the receiver; congestion control protects the network", "SYN flood attack exploits half-open connections (SYN cookies defend)"], "code": "", "pit": ["Mixing flow and congestion control"], "ask": ["Why a 3-way and not 2-way handshake?", "When would you choose UDP?", "Flow vs congestion control?"], "prac": [], "learn": [["Kurose & Ross", "https://gaia.cs.umass.edu/kurose_ross/index.php"], ["Gate Smashers (YouTube)", "https://www.youtube.com/@GateSmashers"]], "rel": ["osi-tcpip", "http-tls"]}, {"id": "http-tls", "title": "HTTP, HTTPS and TLS", "cat": "Core CS", "lvl": 2, "why": "Bridges CN and security. Your AppSec and cloud work depends on it.", "core": ["HTTP is a stateless request/response protocol: methods (GET, POST, PUT, DELETE, PATCH), status codes (2xx ok, 3xx redirect, 4xx client error, 5xx server error), headers, cookies for state.", "HTTPS is HTTP over TLS. In TLS 1.3 the client and server agree keys with an ephemeral Diffie-Hellman exchange, the server proves its identity with a certificate signed by a trusted CA, and then traffic is encrypted with a fast symmetric cipher (AES-GCM or ChaCha20).", "HTTP/2 multiplexes streams over one TCP connection; HTTP/3 runs over QUIC (UDP) to avoid head-of-line blocking."], "points": ["Asymmetric crypto for key exchange/auth, symmetric for bulk data", "Security headers: HSTS, CSP, X-Frame-Options", "Idempotent methods: GET, PUT, DELETE"], "code": "", "pit": ["Saying HTTPS encrypts with the server's public key directly (old RSA key exchange, not TLS 1.3)"], "ask": ["How does HTTPS work?", "Difference between HTTP/1.1, 2 and 3?", "What are cookies and how are they secured?"], "prac": [], "learn": [["The Illustrated TLS 1.3 Connection", "https://tls13.xargs.org"], ["MDN HTTP docs", "https://developer.mozilla.org/en-US/docs/Web/HTTP"]], "rel": ["tcp-udp", "url-flow", "crypto-basics"]}, {"id": "url-flow", "title": "What happens when you type a URL", "cat": "Core CS", "lvl": 2, "why": "The single most popular CN interview question. It lets you show breadth from DNS to rendering.", "core": ["1) Browser checks its caches and parses the URL. 2) DNS resolution: browser → OS → resolver → root → TLD (.com) → authoritative server, giving an IP. 3) TCP handshake (or QUIC). 4) TLS handshake. 5) HTTP request sent; it may pass through a CDN, load balancer and reverse proxy. 6) The server builds a response (app server, cache, database). 7) The browser parses HTML, fetches CSS/JS/images, builds the DOM and CSSOM, lays out and paints.", "Go deeper on whichever layer the interviewer prods: DNS record types (A, AAAA, CNAME, MX), TTL caching, ARP on the local network, keep-alive."], "points": ["DNS uses UDP port 53 (TCP for large responses)", "Mention a CDN and load balancer to show system awareness", "Security add-on: HSTS, certificate validation"], "code": "", "pit": ["Skipping DNS or TLS", "Going so deep on one step you never finish"], "ask": ["What happens when you type google.com and press Enter?", "How does DNS resolution work?"], "prac": [], "learn": [["alex/what-happens-when (GitHub)", "https://github.com/alex/what-happens-when"]], "rel": ["osi-tcpip", "tcp-udp", "http-tls", "caching"]}, {"id": "oop", "title": "OOP: the four pillars", "cat": "Core CS", "lvl": 1, "why": "Asked in every service-company interview and most product ones, often with 'show me in C++'.", "core": ["Encapsulation: bundle data with methods and hide internals (private members, public interface). Abstraction: expose what an object does, not how (abstract classes, interfaces). Inheritance: a class reuses and extends another ('is-a'). Polymorphism: one interface, many forms; compile-time (overloading, templates) and run-time (virtual functions).", "Prefer composition ('has-a') over deep inheritance trees."], "points": ["Overloading = same name, different parameters (compile time)", "Overriding = derived class redefines a virtual function (run time)", "Abstract class has at least one pure virtual function"], "code": "struct Shape { virtual double area() const = 0; virtual ~Shape() = default; };\nstruct Circle : Shape { double r; explicit Circle(double r) : r(r) {}\n    double area() const override { return 3.14159 * r * r; } };\nstd::unique_ptr<Shape> s = std::make_unique<Circle>(2.0); // runtime polymorphism", "pit": ["Forgetting a virtual destructor in a base class"], "ask": ["Explain the four pillars with examples.", "Overloading vs overriding?", "Abstract class vs interface?"], "prac": [], "learn": [["learncpp.com: OOP chapters", "https://www.learncpp.com"], ["GfG: OOP in C++", "https://www.geeksforgeeks.org/cpp/object-oriented-programming-in-cpp/"]], "rel": ["vtable", "solid", "lld"]}, {"id": "vtable", "title": "Virtual functions and the vtable", "cat": "Core CS", "lvl": 2, "why": "A C++-specific depth question that separates prepared candidates, and essential for HFT and binary exploitation.", "core": ["Each class with virtual functions has a vtable: an array of function pointers to its versions of those functions. Each object stores a hidden vptr pointing to its class's vtable.", "A virtual call loads the vptr, indexes the vtable and jumps: one extra indirection, and it usually blocks inlining (why low-latency C++ avoids virtual calls on hot paths, using templates/CRTP instead).", "Constructors set the vptr, so calling a virtual function inside a constructor uses the current class's version, not the derived one."], "points": ["Virtual destructor needed for delete through a base pointer", "Object slicing: copying a derived object into a base by value", "Overwriting a vptr is a classic exploitation primitive"], "code": "", "pit": ["Thinking vtables are per object (they're per class)"], "ask": ["How does a virtual function call work?", "Why should base destructors be virtual?", "What is object slicing?"], "prac": [], "learn": [["learncpp: the virtual table", "https://www.learncpp.com/cpp-tutorial/the-virtual-table/"]], "rel": ["oop", "binary-exploitation"]}, {"id": "solid", "title": "SOLID and design patterns", "cat": "Core CS", "lvl": 2, "why": "The vocabulary of every LLD round.", "core": ["S: single responsibility. O: open for extension, closed for modification. L: Liskov substitution (a subclass must work wherever the base does). I: interface segregation (small, focused interfaces). D: dependency inversion (depend on abstractions, inject dependencies).", "Patterns to know cold: Singleton (one instance; thread-safe via a function-local static in C++11), Factory (create objects without naming concrete classes), Strategy (swap algorithms at runtime), Observer (subscribers notified of events), plus Decorator and Adapter."], "points": ["Square-Rectangle is the classic Liskov violation", "Strategy = pass a pricing/parking-fee policy object", "Observer = notification systems"], "code": "", "pit": ["Naming patterns without a concrete use case"], "ask": ["Explain SOLID with examples.", "Implement a thread-safe singleton.", "Where would you use the strategy pattern?"], "prac": [], "learn": [["Refactoring.Guru design patterns (free)", "https://refactoring.guru/design-patterns"], ["awesome-low-level-design", "https://github.com/ashishps1/awesome-low-level-design"]], "rel": ["oop", "lld"]}, {"id": "lld", "title": "Low-level design (LLD)", "cat": "Design", "lvl": 1, "why": "Freshers at product companies get LLD more often than HLD. Flipkart, Swiggy, Atlassian and others run a machine-coding or LLD round.", "core": ["Process: clarify requirements and scope (5 min) → list entities (nouns) and behaviours (verbs) → define classes, fields and relationships → key interfaces → walk through one flow → discuss extensions, concurrency and patterns used.", "Practise: parking lot, library management, Splitwise, elevator, snake and ladder, BookMyShow, rate limiter, LRU cache, vending machine."], "points": ["Draw a class diagram first", "Use enums for states and types", "Mention thread safety where shared state exists", "Machine-coding rounds want runnable, clean code in 60–90 min"], "code": "", "pit": ["Starting to code before agreeing on requirements", "God classes that do everything"], "ask": ["Design a parking lot.", "Design Splitwise.", "Design an elevator system."], "prac": [], "learn": [["awesome-low-level-design", "https://github.com/ashishps1/awesome-low-level-design"], ["Refactoring.Guru", "https://refactoring.guru/design-patterns"]], "rel": ["solid", "oop", "hld"]}, {"id": "hld", "title": "High-level system design (HLD)", "cat": "Design", "lvl": 2, "why": "Big Tech asks light HLD even for new grads; a clear design discussion lifts you above candidates who only grind DSA. Your AWS SAA prep covers half of it.", "core": ["Framework: requirements (functional + non-functional: scale, latency, availability) → back-of-envelope numbers (QPS, storage) → API → data model → high-level diagram → deep dive on the bottleneck → trade-offs.", "Building blocks: load balancer, stateless app servers, cache (Redis), CDN, SQL vs NoSQL, replication, sharding, message queues (SQS/Kafka), object storage (S3), rate limiter, search index.", "Starter designs: URL shortener, pastebin, rate limiter, chat app, news feed, notification service."], "points": ["1 day ≈ 10⁵ seconds; 1M requests/day ≈ 12 QPS", "Read-heavy → cache + replicas; write-heavy → sharding + queues", "State the trade-off you chose and why"], "code": "", "pit": ["Jumping to microservices for a simple system", "No numbers"], "ask": ["Design a URL shortener.", "How would you scale it to 100× traffic?"], "prac": [], "learn": [["System Design Primer", "https://github.com/donnemartin/system-design-primer"], ["roadmap.sh system design", "https://roadmap.sh/system-design"], ["ByteByteGo blog (free posts)", "https://blog.bytebytego.com"]], "rel": ["caching", "cap", "load-balancing", "lld"]}, {"id": "caching", "title": "Caching and CDNs", "cat": "Design", "lvl": 2, "why": "The first scaling answer in any design question, and it links to LRU (a DSA favourite).", "core": ["A cache keeps hot data in fast storage. Patterns: cache-aside (app reads cache, falls back to DB and fills cache), write-through (write cache and DB together), write-back (write cache, flush later).", "Eviction: LRU, LFU, TTL. Invalidation is the hard part: set TTLs, delete on write, version keys.", "A CDN caches static (and some dynamic) content at edge locations close to users (CloudFront on AWS)."], "points": ["Cache stampede: many misses at once; use locking or early refresh", "Hit ratio is the metric", "LRU = hash map + doubly linked list"], "code": "", "pit": ["Caching data that must be strongly consistent without a plan"], "ask": ["How would you add caching to this system?", "How do you keep the cache consistent?"], "prac": [], "learn": [["System Design Primer: cache", "https://github.com/donnemartin/system-design-primer#cache"]], "rel": ["hld", "linked-list"]}, {"id": "load-balancing", "title": "Load balancing, replication and sharding", "cat": "Design", "lvl": 2, "why": "Core scaling vocabulary for HLD rounds and AWS SAA.", "core": ["A load balancer spreads requests across servers (round robin, least connections, consistent hashing) and removes unhealthy ones via health checks. L4 balances by IP/port, L7 by HTTP content.", "Replication copies data to more nodes for read scaling and availability (leader-follower; replication lag means followers can be stale). Sharding splits data across nodes by a key for write scaling; choose a key that spreads load evenly and avoids cross-shard queries.", "Consistent hashing keeps most keys in place when nodes join or leave."], "points": ["AWS: ALB (L7), NLB (L4), Auto Scaling groups, RDS read replicas, DynamoDB partitions", "Hot shard problem: celebrity users"], "code": "", "pit": ["Sharding before trying caching and replicas"], "ask": ["How would you shard a users table?", "What is consistent hashing?"], "prac": [], "learn": [["System Design Primer", "https://github.com/donnemartin/system-design-primer"]], "rel": ["hld", "cap", "aws-core"]}, {"id": "cap", "title": "CAP theorem and consistency", "cat": "Design", "lvl": 3, "why": "An L3 depth question that shows you understand distributed trade-offs.", "core": ["During a network partition, a distributed store must choose between consistency (every read sees the latest write) and availability (every request gets a response). PACELC adds: Else, when there's no partition, choose between latency and consistency.", "Consistency models range from strong (linearisable) to eventual. Banking ledgers lean to consistency; social feeds lean to availability."], "points": ["Quorums: R + W > N gives read-your-writes", "Idempotency keys make retries safe (payments)"], "code": "", "pit": ["Saying a system can 'pick two' outside partitions"], "ask": ["Explain CAP with an example.", "How do you make a payment API safe to retry?"], "prac": [], "learn": [["Designing Data-Intensive Applications (book)", "https://dataintensive.net"]], "rel": ["hld", "acid"]}, {"id": "owasp", "title": "OWASP Top 10", "cat": "Security", "lvl": 1, "why": "The shared language of AppSec. Even SDE interviewers are impressed when you name the risk in your own project.", "core": ["The OWASP Top 10 (2021) lists the most critical web risks: A01 Broken Access Control, A02 Cryptographic Failures, A03 Injection (incl. XSS), A04 Insecure Design, A05 Security Misconfiguration, A06 Vulnerable and Outdated Components, A07 Identification and Authentication Failures, A08 Software and Data Integrity Failures, A09 Security Logging and Monitoring Failures, A10 Server-Side Request Forgery.", "Broken access control is #1: the app checks that you are logged in but not that you may access this object."], "points": ["Authentication = who you are; authorisation = what you may do", "Defence in depth: validate input, encode output, least privilege, logging", "A09 is exactly what TenantWall's CloudTrail + CloudWatch alarm addresses"], "code": "", "pit": ["Memorising the list without one exploit + one fix for each"], "ask": ["Name three OWASP risks and how you'd prevent them.", "Authentication vs authorisation?"], "prac": [["PortSwigger Web Security Academy", "https://portswigger.net/web-security/all-labs"]], "learn": [["OWASP Top 10", "https://owasp.org/www-project-top-ten/"], ["OWASP Cheat Sheet Series", "https://cheatsheetseries.owasp.org"]], "rel": ["sqli", "xss", "access-control", "ssrf"]}, {"id": "sqli", "title": "SQL injection", "cat": "Security", "lvl": 1, "why": "The classic vulnerability; first PortSwigger topic and a guaranteed security interview question.", "core": ["Happens when user input is concatenated into a SQL query, so the input changes the query's structure. ' OR '1'='1 turns a login check into 'always true'; UNION SELECT reads other tables; blind SQLi infers data from true/false or timing differences.", "Fix: parameterised queries / prepared statements, which send the query and the data separately so data can never become code. Add least-privilege DB accounts and input validation as extra layers. Escaping by hand is fragile."], "points": ["ORMs are safe unless you build raw queries with strings", "Second-order SQLi: stored input used later in a query"], "code": "// vulnerable\nq = \"SELECT * FROM users WHERE name = '\" + name + \"'\";\n// safe (prepared statement)\nstmt = db.prepare(\"SELECT * FROM users WHERE name = ?\"); stmt.bind(1, name);", "pit": ["Thinking input filtering alone fixes it"], "ask": ["What is SQL injection and how do you prevent it?", "Why do prepared statements work?"], "prac": [["PortSwigger: SQL injection labs", "https://portswigger.net/web-security/sql-injection"]], "learn": [["PortSwigger: SQL injection", "https://portswigger.net/web-security/sql-injection"], ["OWASP SQLi prevention cheat sheet", "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"]], "rel": ["owasp", "sql"]}, {"id": "xss", "title": "Cross-site scripting (XSS) and CSRF", "cat": "Security", "lvl": 1, "why": "The two most common client-side web bugs; asked in AppSec and full-stack interviews.", "core": ["XSS: attacker-controlled script runs in another user's browser on your site. Reflected (from the request), stored (saved in the database), DOM-based (client JS writes untrusted data into the page). Impact: steal session data, act as the user.", "Fix XSS: context-aware output encoding (HTML, attribute, JS, URL), frameworks that escape by default, a Content-Security-Policy, HttpOnly cookies.", "CSRF: a malicious site makes the victim's browser send an authenticated request (e.g. change email). Fix: SameSite cookies, anti-CSRF tokens, re-authentication for sensitive actions."], "points": ["innerHTML with user data → DOM XSS", "SameSite=Lax is the modern default in browsers", "CORS is not a CSRF defence"], "code": "", "pit": ["Confusing XSS (runs script) with CSRF (forges a request)"], "ask": ["Difference between XSS and CSRF?", "How does CSP help?"], "prac": [["PortSwigger: XSS labs", "https://portswigger.net/web-security/cross-site-scripting"], ["PortSwigger: CSRF labs", "https://portswigger.net/web-security/csrf"]], "learn": [["PortSwigger: XSS", "https://portswigger.net/web-security/cross-site-scripting"], ["PortSwigger: CSRF", "https://portswigger.net/web-security/csrf"]], "rel": ["owasp", "http-tls"]}, {"id": "access-control", "title": "Broken access control and IDOR", "cat": "Security", "lvl": 2, "why": "OWASP #1 and the most common bug-bounty finding. Directly related to TenantWall's tenant isolation.", "core": ["IDOR (insecure direct object reference): the app uses an ID from the request (/invoice?id=1043) without checking the object belongs to the user. Change the ID, read someone else's data.", "Other forms: missing function-level checks (normal user calls /admin API), privilege escalation via a role parameter, path traversal.", "Fix: enforce authorisation on the server for every request and object (deny by default), centralise checks, use unguessable IDs only as extra defence, test with two accounts."], "points": ["Multi-tenant SaaS: every query filtered by tenant_id from the session, never from the request", "ABAC in TenantWall enforces this at the AWS layer with tags"], "code": "", "pit": ["Relying on hidden UI elements as access control"], "ask": ["What is IDOR and how would you test for it?", "How do you enforce tenant isolation?"], "prac": [["PortSwigger: access control labs", "https://portswigger.net/web-security/access-control"]], "learn": [["PortSwigger: access control", "https://portswigger.net/web-security/access-control"]], "rel": ["owasp", "abac", "iam"]}, {"id": "ssrf", "title": "Server-side request forgery (SSRF)", "cat": "Security", "lvl": 2, "why": "OWASP A10 and the bug behind major cloud breaches; ties web security to AWS.", "core": ["The server fetches a URL the attacker controls (image preview, webhook, PDF generator). The attacker points it at internal addresses: localhost admin panels, internal services, or the cloud metadata endpoint (169.254.169.254) to steal temporary IAM credentials.", "Fix: allow-lists of destinations, block private and link-local ranges after DNS resolution, disable redirects, and on AWS require IMDSv2 (session tokens) and give instances least-privilege roles."], "points": ["The 2019 Capital One breach involved SSRF + over-privileged IAM role", "flaws.cloud level 5 shows the metadata attack"], "code": "", "pit": ["Blocking by string matching (bypassed with decimal IPs, DNS rebinding)"], "ask": ["What is SSRF and why is it dangerous in the cloud?"], "prac": [["PortSwigger: SSRF labs", "https://portswigger.net/web-security/ssrf"], ["flaws.cloud", "http://flaws.cloud"]], "learn": [["PortSwigger: SSRF", "https://portswigger.net/web-security/ssrf"]], "rel": ["owasp", "iam", "aws-core"]}, {"id": "crypto-basics", "title": "Hashing, encryption and passwords", "cat": "Security", "lvl": 1, "why": "A common short question in security and backend interviews.", "core": ["Hashing is one-way and fixed-length (SHA-256): used for integrity and fingerprints. Encryption is reversible with a key: symmetric (AES, one shared key, fast) or asymmetric (RSA/ECC, public/private key pair, used for key exchange and signatures).", "Passwords: never encrypt, never plain-hash. Use a slow, salted password hash (Argon2id, bcrypt, scrypt). The salt stops precomputed rainbow tables; slowness stops brute force.", "Digital signatures: hash the message, sign with the private key; anyone verifies with the public key."], "points": ["Encoding (Base64) is not encryption", "MAC/HMAC = integrity + authenticity with a shared key", "AES-GCM gives encryption + integrity"], "code": "", "pit": ["Saying 'we hash with MD5' for passwords"], "ask": ["Hashing vs encryption?", "How should passwords be stored?", "Symmetric vs asymmetric?"], "prac": [], "learn": [["OWASP Password Storage cheat sheet", "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"], ["CryptoHack (free)", "https://cryptohack.org"]], "rel": ["http-tls", "owasp"]}, {"id": "threat-modelling", "title": "Threat modelling (STRIDE)", "cat": "Security", "lvl": 2, "why": "Lets you add 'I threat-modelled it' to any project answer. Security-engineer interviews ask you to do it live.", "core": ["Draw the system's data flow: users, processes, data stores, trust boundaries. For each element, ask STRIDE: Spoofing (identity), Tampering (data), Repudiation (no audit trail), Information disclosure, Denial of service, Elevation of privilege.", "For each threat, record a mitigation and its priority. Four questions: what are we building, what can go wrong, what will we do about it, did we do a good job?"], "points": ["Trust boundaries are where most bugs live", "Repudiation → logging (CloudTrail)", "Elevation of privilege → IAM least privilege"], "code": "", "pit": ["A list of threats with no mitigations"], "ask": ["Threat-model a login page.", "Threat-model your project."], "prac": [], "learn": [["OWASP Threat Modeling", "https://owasp.org/www-community/Threat_Modeling"], ["Microsoft STRIDE", "https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats"]], "rel": ["owasp", "tenantwall"]}, {"id": "binary-exploitation", "title": "Binary exploitation basics", "cat": "Security", "lvl": 3, "why": "Your L3 security rung and the binary taster from the roadmap. It makes your C/C++ and OS memory knowledge concrete, which HFT and systems interviewers value.", "core": ["Stack layout: local buffers sit below the saved frame pointer and return address. Writing past a buffer (gets, strcpy without bounds) overwrites the return address and redirects execution.", "Defences and bypasses: stack canaries (detect overwrite), NX/DEP (stack not executable → return-oriented programming chains existing code 'gadgets'), ASLR (randomised addresses → need an info leak), PIE, RELRO.", "Other bug classes: format strings (printf(user)), use-after-free and double free on the heap, integer overflows. Tools: GDB with pwndbg, pwntools, Ghidra for reversing, checksec."], "points": ["Start with pwn.college's program-security modules", "Write a short write-up for every challenge you solve", "Secure C++: bounds-checked containers, avoid raw C strings"], "code": "", "pit": ["Jumping to heap exploitation before stack basics"], "ask": ["What is a buffer overflow and how do canaries and ASLR stop it?", "What is ROP?"], "prac": [["pwn.college", "https://pwn.college"], ["picoCTF", "https://picoctf.org"], ["ROP Emporium", "https://ropemporium.com"]], "learn": [["pwn.college", "https://pwn.college"], ["Nightmare (free course)", "https://guyinatuxedo.github.io"]], "rel": ["virtual-memory", "vtable", "ctf"]}, {"id": "ctf", "title": "CTFs and security labs", "cat": "Security", "lvl": 2, "why": "A proven hiring channel for security roles (see the KPMG story) and great resume proof.", "core": ["Jeopardy CTFs have categories: web, pwn (binary exploitation), reverse engineering, crypto, forensics, misc. Each solved challenge gives a flag.", "Path: OverTheWire Bandit (Linux) → picoCTF (all categories, beginner) → PortSwigger labs (web) → pwn.college (binary) → live CTFs on CTFtime with a team.", "Write up each solve on a blog or GitHub: problem, approach, the key insight, the fix. Write-ups are what recruiters can read."], "points": ["Join or form a college team; India has many college CTFs", "Top-25% finish in a mid-rated CTF is a solid resume line"], "code": "", "pit": ["Only reading write-ups without solving"], "ask": ["Tell me about a CTF challenge you solved."], "prac": [["OverTheWire Bandit", "https://overthewire.org/wargames/bandit/"], ["picoCTF", "https://picoctf.org"], ["CTFtime", "https://ctftime.org"], ["TryHackMe", "https://tryhackme.com"]], "learn": [["CTF101", "https://ctf101.org"]], "rel": ["binary-exploitation", "bug-bounty"]}, {"id": "bug-bounty", "title": "Bug bounty and responsible disclosure", "cat": "Security", "lvl": 4, "why": "An accepted report is proof no college name can match. It's your L4 security goal.", "core": ["Bug bounty programmes pay or credit researchers for reporting vulnerabilities within a defined scope. Read the scope and rules first; testing out of scope is illegal.", "Start with recon on wide-scope programmes, focus on one bug class you know well (IDOR, access control, XSS), and read disclosed reports on HackerOne Hacktivity to learn what gets accepted.", "Responsible disclosure: report privately, give details and impact, don't access more data than needed, wait for a fix before publishing."], "points": ["Quality report: steps to reproduce, impact, fix suggestion", "Indian govt sites: report to CERT-In", "Duplicates are normal at first"], "code": "", "pit": ["Running automated scanners against programmes that forbid them"], "ask": ["Walk me through a vulnerability you found."], "prac": [["HackerOne Hacktivity", "https://hackerone.com/hacktivity"], ["Bugcrowd", "https://bugcrowd.com"]], "learn": [["PortSwigger Academy", "https://portswigger.net/web-security"], ["HackerOne Hacker101 (free)", "https://www.hacker101.com"]], "rel": ["access-control", "ctf"]}, {"id": "iam", "title": "AWS IAM and least privilege", "cat": "Cloud", "lvl": 1, "why": "Week 1 of your AWS track and the heart of TenantWall. The most important AWS service for security roles.", "core": ["Principals (users, roles) get permissions from JSON policies: Effect (Allow/Deny), Action, Resource, Condition. Roles give temporary credentials and are preferred over long-lived user keys.", "Evaluation logic: everything starts as an implicit deny; an Allow grants access; an explicit Deny anywhere always wins (over any Allow). Permission boundaries and SCPs cap what can be allowed.", "Tools from your professor's list: the IAM Policy Generator builds policy JSON; IAM Access Analyzer finds resources shared outside your account and validates policies; it can generate least-privilege policies from CloudTrail activity."], "points": ["Explicit deny > allow > implicit deny", "Never use the root account day to day; enable MFA", "Use roles for EC2/Lambda, not access keys"], "code": "{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Deny\",\n    \"Action\": \"s3:*\",\n    \"Resource\": \"*\",\n    \"Condition\": {\"Bool\": {\"aws:SecureTransport\": \"false\"}}\n  }]\n}", "pit": ["Policies with \"Action\": \"*\" and \"Resource\": \"*\""], "ask": ["Explain IAM policy evaluation.", "Role vs user?", "How do you achieve least privilege?"], "prac": [], "learn": [["AWS docs: policy evaluation logic", "https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html"], ["AWS docs: IAM Access Analyzer", "https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html"], ["flaws2.cloud", "http://flaws2.cloud"]], "rel": ["abac", "tenantwall", "cloudtrail"]}, {"id": "abac", "title": "ABAC: attribute-based access control", "cat": "Cloud", "lvl": 3, "why": "The core idea of your TenantWall paper.", "core": ["RBAC grants by role; ABAC grants by matching attributes. In AWS, attributes are tags on principals (aws:PrincipalTag/tenant) and on resources (aws:ResourceTag/tenant). One policy can say 'allow only when the principal's tenant tag equals the resource's tenant tag', so adding a tenant needs no new policy.", "For S3, use object or bucket tags, or prefix-based conditions (s3:prefix with ${aws:PrincipalTag/tenant}). Protect the tags themselves: deny changing tenant tags (aws:TagKeys, aws:RequestTag) so a user can't re-tag into another tenant."], "points": ["Scales better than one role per tenant", "Pair with an explicit deny on tag modification", "Test isolation with two tenant users (should get AccessDenied)"], "code": "\"Condition\": {\n  \"StringEquals\": {\n    \"aws:ResourceTag/tenant\": \"${aws:PrincipalTag/tenant}\"\n  }\n}", "pit": ["Letting principals edit their own tags"], "ask": ["RBAC vs ABAC?", "How does TenantWall stop tenant A reading tenant B's data?"], "prac": [], "learn": [["AWS docs: What is ABAC?", "https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html"], ["AWS docs: ABAC tutorial", "https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_attribute-based-access-control.html"]], "rel": ["iam", "tenantwall", "access-control"]}, {"id": "cloudtrail", "title": "CloudTrail and CloudWatch alarms", "cat": "Cloud", "lvl": 2, "why": "Your professor asked for exactly this in TenantWall: log every access attempt and alert on denied ones.", "core": ["CloudTrail records API calls (who, what, when, from where). Management events are on by default; S3 object-level reads and writes need data events enabled on the trail. Send the trail to CloudWatch Logs.", "Create a metric filter on the log group with the pattern { ($.errorCode = \"*UnauthorizedOperation\") || ($.errorCode = \"AccessDenied*\") }, which turns matching events into a metric. Put a CloudWatch alarm on it (e.g. ≥ 1 in 5 minutes) whose action publishes to an SNS topic with an email subscription.", "Test: as tenant A, try to read tenant B's object; you should get AccessDenied, see the event in CloudTrail, the metric tick up and an email arrive."], "points": ["Confirm the SNS email subscription or nothing arrives", "Data events cost money; limit them to TenantWall buckets", "This maps to OWASP A09 (logging and monitoring failures)"], "code": "", "pit": ["Expecting S3 GetObject in CloudTrail without data events"], "ask": ["How would you detect unauthorised access attempts in AWS?"], "prac": [], "learn": [["AWS docs: CloudTrail data events", "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html"], ["AWS docs: CloudWatch alarms for CloudTrail", "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudwatch-alarms-for-cloudtrail.html"]], "rel": ["tenantwall", "iam"]}, {"id": "tenantwall", "title": "TenantWall (your research project)", "cat": "Cloud", "lvl": 3, "why": "Your strongest resume line: real cloud security research with a professor. It deserves a polished write-up, a diagram and a 2-minute interview story.", "core": ["What: multi-tenant isolation on EC2 and S3 using ABAC (tag-matched IAM policies), so tenants can't reach each other's resources.", "Your professor's additions: a CloudTrail trail with S3 data events; a CloudWatch metric filter on AccessDenied/UnauthorizedOperation with an alarm and SNS email; policies built with the Policy Generator and checked with IAM Access Analyzer; a flowchart and an AWS-icon architecture diagram; explicit deny statements (confirm the exact meaning with your professor).", "Plan: deadline 21 Mar 2027. Build in Dec–Jan, run isolation tests and collect evidence (screenshots, alarm emails), write in Feb–Mar."], "points": ["Interview story: problem → design (ABAC) → how you proved isolation → what the alarm caught", "Diagram in diagrams.net with the AWS icon set", "Put the policies and test scripts on GitHub (no keys!)"], "code": "", "pit": ["Committing AWS keys to GitHub", "Leaving resources running and getting billed"], "ask": ["Tell me about your project.", "How did you verify isolation?", "What would you change at 1,000 tenants?"], "prac": [], "learn": [["diagrams.net (AWS icons)", "https://app.diagrams.net"], ["AWS docs: ABAC", "https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html"]], "rel": ["abac", "cloudtrail", "iam", "threat-modelling"]}, {"id": "aws-core", "title": "AWS core services and the SAA-C03 exam", "cat": "Cloud", "lvl": 2, "why": "30 minutes a day from 16 Nov, exam in the week of 19 Apr 2027. Cloud skills plus a cert lift both SDE and security profiles.", "core": ["Compute: EC2 (instances, AMIs, security groups), Auto Scaling, Lambda. Storage: S3 (classes, versioning, lifecycle, encryption, Block Public Access), EBS, EFS. Databases: RDS (Multi-AZ for HA, read replicas for scale), DynamoDB, ElastiCache. Networking: VPC, public/private subnets, route tables, internet and NAT gateways, ALB/NLB, Route 53, CloudFront. Integration: SQS, SNS. Security: IAM, KMS, CloudTrail, GuardDuty.", "Exam domains: secure architectures 30%, resilient 26%, high-performing 24%, cost-optimised 20%. 65 questions, 130 minutes, pass mark 720/1000."], "points": ["Multi-AZ = availability; read replica = read scale", "NAT gateway lets private subnets reach the internet outbound only", "Set a billing alarm in week 1"], "code": "", "pit": ["Only watching videos; do the labs", "Leaving NAT gateways running (they cost hourly)"], "ask": ["Design a highly available web app on AWS.", "Security group vs NACL?"], "prac": [], "learn": [["AWS SAA-C03 exam guide", "https://aws.amazon.com/certification/certified-solutions-architect-associate/"], ["freeCodeCamp SAA course (YouTube)", "https://www.youtube.com/@freecodecamp"], ["AWS Skill Builder (free tier)", "https://skillbuilder.aws"]], "rel": ["iam", "load-balancing", "hld"]}, {"id": "llm-rag", "title": "LLMs and RAG apps", "cat": "AI", "lvl": 2, "why": "Your AI track from 14 Dec (≤1 h). An AI + security project is a rare combination on a fresher resume.", "core": ["An LLM predicts the next token from a prompt; it knows only its training data and what you put in the context window.", "RAG (retrieval-augmented generation): split documents into chunks, embed them as vectors, store them in a vector index; at question time, embed the question, retrieve the closest chunks and put them in the prompt so the answer is grounded in your data.", "Tool calling lets the model request a function (search, database query) that your code runs. Evals: a fixed set of questions with expected answers to measure changes."], "points": ["Chunk size and overlap matter more than the model", "Always cite retrieved sources in answers", "Evaluate before and after every change"], "code": "", "pit": ["No evaluation set", "Putting secrets in prompts"], "ask": ["How does RAG work?", "How would you evaluate an LLM feature?"], "prac": [], "learn": [["DeepLearning.AI short courses (free)", "https://www.deeplearning.ai/short-courses/"], ["Anthropic docs", "https://docs.anthropic.com"]], "rel": ["prompt-injection"]}, {"id": "prompt-injection", "title": "Prompt injection and AI security", "cat": "AI", "lvl": 3, "why": "Where your AI and cyber tracks meet. Few freshers can talk about it.", "core": ["Prompt injection: untrusted text (a web page, an email, a document in your RAG store) contains instructions that the model follows instead of the developer's. Direct injection comes from the user; indirect injection hides in retrieved content.", "Risks grow with tools: an injected instruction can make an agent leak data or take actions. Defences: treat model output as untrusted, least-privilege tools, human confirmation for risky actions, separate trusted instructions from data, output filtering, and red-team tests.", "The OWASP Top 10 for LLM applications lists prompt injection, sensitive information disclosure, supply chain, data poisoning, improper output handling, excessive agency and more."], "points": ["Build a test set of injection attempts for your RAG project", "Log and monitor model actions"], "code": "", "pit": ["Believing a system prompt alone stops injection"], "ask": ["What is prompt injection and how would you mitigate it?"], "prac": [], "learn": [["OWASP LLM Top 10", "https://genai.owasp.org/llm-top-10/"], ["Gandalf (Lakera) prompt-injection game", "https://gandalf.lakera.ai"]], "rel": ["llm-rag", "owasp"]}, {"id": "probability", "title": "Probability for HFT interviews", "cat": "HFT", "lvl": 3, "why": "The later HFT track (Apr–Jul 2027). It also makes maths-heavy OA questions easy.", "core": ["Counting: permutations, combinations, stars and bars, inclusion–exclusion. Conditional probability and Bayes' rule: P(A|B) = P(B|A)·P(A) / P(B).", "Expectation is linear even for dependent variables: E[X + Y] = E[X] + E[Y]. Indicator variables turn counting questions into sums of probabilities (expected number of fixed points in a random permutation = 1).", "Condition on the first step for recursive questions: expected flips to get HH satisfies a small system of equations (answer 6). Gambler's ruin and random walks follow the same idea."], "points": ["Zetamac mental arithmetic: 40+ then 50+", "Fair price of a game = its expected value", "Write every solved puzzle's key idea in one line"], "code": "", "pit": ["Assuming independence without checking"], "ask": ["Expected number of rolls to see a 6?", "You flip until HH; expected flips?", "Bayes: a test is 99% accurate for a 1% disease; P(sick | positive)?"], "prac": [["Brainstellar", "https://www.brainstellar.com"], ["Zetamac", "https://arithmetic.zetamac.com"]], "learn": [["Harvard Stat 110", "https://projects.iq.harvard.edu/stat110"], ["Blitzstein & Hwang (free book)", "https://projects.iq.harvard.edu/stat110/home"]], "rel": ["cp"]}, {"id": "umpire", "title": "The interview loop (UMPIRE)", "cat": "Career", "lvl": 1, "why": "A fixed routine for every DSA interview so nerves don't decide your structure.", "core": ["Understand: restate the problem, ask about input size, ranges, duplicates, empty input; agree on 2 examples. Match: name the pattern. Plan: describe the approach in words and give its complexity; get a nod. Implement: clean code, good names. Review: dry-run an example and an edge case. Evaluate: complexity, trade-offs, what you'd improve.", "Always say the brute force first. It shows you can solve it, gives you a fallback and often reveals the optimisation."], "points": ["Spend ~5 min understanding, ~5 planning, ~20 coding, ~5 testing in a 45-min round", "If stuck, think aloud about what you know; interviewers give hints to people who talk"], "code": "", "pit": ["Coding before the interviewer agrees with the approach"], "ask": [], "prac": [], "learn": [["CodePath UMPIRE guide", "https://guides.codepath.org/compsci/UMPIRE-Interview-Strategy"]], "rel": ["speak-aloud", "pattern-thinking", "mock-interviews"]}, {"id": "oa-tactics", "title": "Online assessments (OAs)", "cat": "Career", "lvl": 1, "why": "The first filter for almost every off-campus role. Many strong candidates fail here from poor tactics, not poor skill.", "core": ["Typical format: 2–3 DSA problems in 60–90 minutes on HackerRank, HackerEarth, CodeSignal or Mettl, sometimes with MCQs on CS fundamentals and aptitude.", "Tactics: read all problems in the first 2 minutes; solve in order of confidence; submit a brute force for partial test cases if the optimal idea isn't coming; check overflow (long long), empty and max-size inputs; stop optimising in the last 10 minutes.", "Practise in the same environment: do timed sets on HackerRank, not only LeetCode, because I/O handling differs (you often write main() and read input yourself)."], "points": ["Keep your C++ template ready to paste", "Proctoring: webcam, no tab switching", "Simulate a full 90-minute OA weekly from June"], "code": "", "pit": ["Spending 60 minutes on problem 1", "Forgetting to read input in the given format"], "ask": [], "prac": [], "learn": [["HackerRank interview prep kit", "https://www.hackerrank.com/interview/interview-preparation-kit"]], "rel": ["cp", "error-log", "complexity"]}, {"id": "mock-interviews", "title": "Mock interviews", "cat": "Career", "lvl": 2, "why": "Interviewing is a separate skill from solving. Mocks are where you find out what breaks under pressure.", "core": ["From 31 May, two mocks a week: one peer DSA mock and one Core CS / design mock. Rotate roles: being the interviewer teaches you what they look for.", "Free options: Pramp (peer matching), friends from college or Discord groups, the AI mock-interviewer prompt. Record yourself when practising alone.", "After each mock, write three things: what went well, what broke, one fix for next time."], "points": ["Score yourself 1–5 on problem solving, code, communication", "Do mocks at the same time of day as real interviews"], "code": "", "pit": ["Only doing mocks with friends who go easy on you"], "ask": [], "prac": [], "learn": [["Pramp", "https://www.pramp.com"], ["interviewing.io (free practice when available)", "https://interviewing.io"]], "rel": ["umpire", "speak-aloud", "star"]}, {"id": "star", "title": "Behavioural interviews and STAR stories", "cat": "Career", "lvl": 1, "why": "Amazon's bar raiser and every HR round use behavioural questions. Six good stories cover almost all of them.", "core": ["STAR: Situation (one line of context), Task (your responsibility), Action (what you did — most of the answer, in 'I' not 'we'), Result (outcome with a number, plus what you learned).", "Prepare six stories that each fit several questions: a hard technical problem (TenantWall IAM), a failure, a conflict, learning something fast (C++/AWS), going beyond the task (a security finding), helping or leading someone.", "For Amazon, map each story to Leadership Principles: Ownership, Dive Deep, Learn and Be Curious, Bias for Action, Deliver Results, Customer Obsession."], "points": ["Keep each story to ~2 minutes", "Have a 60-second 'tell me about yourself'", "Real numbers beat adjectives"], "code": "", "pit": ["Talking about the team instead of your actions", "No result or lesson"], "ask": ["Tell me about a time you failed.", "Tell me about a conflict with a teammate.", "Why this company?"], "prac": [], "learn": [["Amazon Leadership Principles", "https://www.amazon.jobs/content/en/our-workplace/leadership-principles"]], "rel": ["mock-interviews", "tenantwall"]}, {"id": "resume", "title": "The one-page resume", "cat": "Career", "lvl": 1, "why": "Off-campus, the resume is read for 6–10 seconds. It decides whether any of your work gets seen.", "core": ["One page, single column, no photos, tables or graphics (ATS parsers break on them), exported as PDF named Firstname_Lastname_SDE.pdf.", "Order for you: contact links (LinkedIn, GitHub, LeetCode/Codeforces) → education (CGPA if ≥ 7.5) → experience → projects (TenantWall first) → achievements (ratings, CTF ranks, AWS SAA, paper) → skills.", "Bullet formula: action verb + what you built + technology + measurable result. 'Built X using Y, which achieved Z.'", "Keep a 2-page private master resume with every bullet; cut 3 one-page versions (SDE, Security/AppSec, Cloud) and tailor each application in 5 minutes."], "points": ["Numbers in every project bullet", "Link a live demo or video", "Have two seniors review it"], "code": "", "pit": ["Listing every technology you've touched", "Tutorial projects (to-do app, weather app)"], "ask": [], "prac": [], "learn": [["Overleaf resume templates (Jake's resume)", "https://www.overleaf.com/latex/templates/jakes-resume/syzfjbzwjncs"]], "rel": ["projects", "referrals"]}, {"id": "projects", "title": "Projects that get shortlisted", "cat": "Career", "lvl": 2, "why": "Two strong projects with numbers beat six tutorials, and give you the stories for interviews.", "core": ["Every project needs: a live link or demo video, a README with an architecture diagram, at least one number (latency, requests/s, users, bugs found), and a 'what I'd do next' line.", "For your profile: TenantWall (cloud security research), a rate-limited URL shortener on AWS with load-test numbers (backend + design), a log-based intrusion detector (security + data), a secure RAG assistant with prompt-injection tests (AI + AppSec), and 3+ merged open-source PRs.", "Threat-model each project and fix one issue; it becomes a unique interview story."], "points": ["Pin them on GitHub with clean READMEs", "Write tests for core logic", "Never commit secrets (.env in .gitignore)"], "code": "", "pit": ["Unfinished projects with no README"], "ask": ["Walk me through your project's architecture.", "What was the hardest bug?", "How would it scale?"], "prac": [], "learn": [["roadmap.sh project ideas", "https://roadmap.sh/projects"]], "rel": ["tenantwall", "resume", "threat-modelling"]}, {"id": "referrals", "title": "Referrals and LinkedIn outreach", "cat": "Career", "lvl": 1, "why": "The strongest off-campus channel: the Eternal (Zomato) story in this guide came through a referral.", "core": ["Find employees or alumni at the target company on LinkedIn (search 'company + RAIT' first, then any engineer). Send a short, specific note with the job ID and your resume link. Ask for a referral, not 'a job'.", "Make it easy to say yes: one-line intro, two proofs (problems solved, project), the exact role and job ID, a resume link. Thank them either way and follow up once after 5–7 days.", "Build the network before you need it: comment thoughtfully on engineers' posts, share your project write-ups."], "points": ["10 referral messages a week", "Alumni reply far more often than strangers", "Track every message in your sheet"], "code": "Hi [Name], I'm a 3rd-year CSE (Cybersecurity) student; I've solved 450+ DSA problems and built [project in one line].\nI'm applying for [Role, Job ID] at [Company]. Would you be open to referring me?\nResume: [link]. Thank you!", "pit": ["'Hi, any openings?' messages with no context", "Messaging the same person repeatedly"], "ask": [], "prac": [], "learn": [], "rel": ["application-pipeline", "resume", "cold-email"]}, {"id": "cold-email", "title": "Cold emailing startups", "cat": "Career", "lvl": 2, "why": "Startups hire interns without formal drives. A specific email to a founder can skip the whole funnel.", "core": ["Target funded Indian startups (Inc42, Entrackr funding news, YC India companies). Email the founder or CTO directly.", "Five lines: you use or studied their product; who you are; one relevant thing you built (with a number); one specific observation (a bug, a missing security header, a feature idea); the ask (internship for N months, 15-minute call). Attach or link resume and GitHub.", "Send 5 a week, personalised. A security observation done responsibly (no exploitation) is a strong opener for a cyber student."], "points": ["Subject line: role + your hook", "Follow up once after a week"], "code": "", "pit": ["Mass-mailing the same template", "Testing their systems without permission"], "ask": [], "prac": [], "learn": [["Inc42 funding news", "https://inc42.com/buzz/funding-galore-indian-startup-funding-this-week/"], ["Y Combinator companies (India filter)", "https://www.ycombinator.com/companies"]], "rel": ["referrals", "application-pipeline"]}, {"id": "application-pipeline", "title": "The application pipeline", "cat": "Career", "lvl": 1, "why": "Off-campus hiring is a numbers game. A batched system makes 50 good applications a month take 90 minutes a week.", "core": ["Collect: saved job alerts on LinkedIn and Naukri, 40 bookmarked careers pages checked Monday and Thursday, Unstop and HackerEarth for hiring contests.", "Apply in two 45-minute batches (Mon, Thu): tailor the resume in 5 minutes, apply within 48 hours of posting, send the referral message for each job.", "Track everything in one sheet: company, role, date, channel, contact, status, next action. Follow up once after 5–7 days. Expect a 2–5% reply rate; volume plus quality produces interviews."], "points": ["Apply even before you feel ready (≈150 problems + 1 project)", "Hiring contests skip resume filters", "Re-use 'why this company' answers"], "code": "", "pit": ["Applying only on campus", "No tracker, so no follow-ups"], "ask": [], "prac": [], "learn": [["Unstop", "https://unstop.com"], ["LinkedIn Jobs", "https://www.linkedin.com/jobs/"]], "rel": ["referrals", "cold-email", "resume"]}, {"id": "company-prep", "title": "Preparing for a specific company", "cat": "Career", "lvl": 2, "why": "Once you have an interview, one focused week beats general practice.", "core": ["1) Read 5–10 recent interview experiences for that company and role on LeetCode Discuss and GeeksforGeeks; note round types and repeated questions. 2) Solve its most frequent recent LeetCode-tagged problems (top 30). 3) Map its values to your STAR stories. 4) Use the product: find one improvement and one security thought to mention.", "Ask the recruiter about the round structure; they usually tell you."], "points": ["LeetCode company tags need Premium; free alternatives are Discuss posts and GitHub lists of company questions", "Glassdoor interview section"], "code": "", "pit": ["Only solving tagged problems without fundamentals"], "ask": [], "prac": [], "learn": [["LeetCode Discuss: interview experiences", "https://leetcode.com/discuss/interview-experience"], ["GfG interview experiences", "https://www.geeksforgeeks.org/interview-experiences/"]], "rel": ["star", "mock-interviews"]}, {"id": "offer", "title": "Offers, CTC and negotiation", "cat": "Career", "lvl": 2, "why": "Freshers often lose money or sign bad bonds by not knowing what to ask.", "core": ["CTC (cost to company) includes fixed salary, variable/bonus, joining bonus, stock (RSUs vesting over years), benefits. In-hand monthly pay is fixed salary minus tax and PF, divided by 12. Ask for the breakdown in writing.", "Check the service agreement or bond clause, notice period, location and relocation support before signing.", "Negotiation: research ranges on levels.fyi and Glassdoor; avoid naming a number first; if you have a competing written offer, mention it politely. Mass-recruiter fresher offers are rarely negotiable; product companies sometimes adjust joining bonus."], "points": ["RSUs: 4-year vesting is common, often with a 1-year cliff", "PPO = pre-placement offer from an internship"], "code": "", "pit": ["Comparing CTCs without separating fixed and variable"], "ask": ["What are your salary expectations?"], "prac": [], "learn": [["levels.fyi", "https://www.levels.fyi"], ["Glassdoor India", "https://www.glassdoor.co.in"]], "rel": ["application-pipeline"]}, {"id": "open-source", "title": "Open source and GSoC", "cat": "Career", "lvl": 3, "why": "A brand that removes the college question (see the tier-3 MCA student's GSoC story), and real code review experience.", "core": ["Pick one organisation whose tech you use (C++, Python, security tools). Set up the project locally, read the contribution guide, start with 'good first issue' labels, and join their chat.", "Aim for 3+ merged PRs before applying to programmes. GSoC contributor applications usually open in March–April (check the timeline each year); LFX Mentorship runs several cohorts a year; MLH Fellowship is another route.", "Your proposal should show you already understand the codebase: link your merged PRs and give a week-by-week plan."], "points": ["Quality of PRs > quantity", "Maintainers often refer good contributors for jobs"], "code": "", "pit": ["Typo-fix PRs to many repos", "Starting a month before the deadline"], "ask": [], "prac": [], "learn": [["Google Summer of Code", "https://summerofcode.withgoogle.com"], ["LFX Mentorship", "https://mentorship.lfx.linuxfoundation.org"], ["MLH Fellowship", "https://fellowship.mlh.io"]], "rel": ["projects"]}, {"id": "levels", "title": "The five difficulty levels", "cat": "Method", "lvl": 0, "why": "Tells you where to stop climbing on each topic, so you don't over-invest where your target jobs don't ask.", "core": ["L0 Foundation: you can't do it yet; learn syntax, ideas and vocabulary. L1 Core: you can do it with notes (service-company level). L2 Interview-ready: cold, timed, out loud (product companies). L3 Advanced: you can handle the twist: Hards, contests, design trade-offs (Big Tech). L4 Elite: rare proof such as CF 1900+, CVEs, merged open-source work, HFT puzzles.", "Your targets: DSA to L3, Core CS to L2, security to L3 (your edge), everything else to L1–L2 unless a specific job needs more."], "points": ["Climb in order", "Depth on one ladder beats breadth on five"], "code": "", "pit": ["Starting L4 topics before L2 is solid"], "ask": [], "prac": [], "learn": [], "rel": ["dp", "owasp", "aws-core"]}];
const LV = [["L0","Foundation","--l0"],["L1","Core","--l1"],["L2","Interview-ready","--l2"],["L3","Advanced","--l3"],["L4","Elite","--l4"]];
const CATS = ["Method","DSA","Core CS","Design","Security","Cloud","AI","HFT","Career"];
const CAT_NOTE = {Method:"How to learn faster", DSA:"Data structures and algorithms", "Core CS":"OS, DBMS, networks, OOP, SQL", Design:"LLD and system design", Security:"Your edge", Cloud:"AWS and TenantWall", AI:"From 14 Dec", HFT:"Later: Apr–Jul 2027", Career:"Getting the offer"};
const byId = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "style") e.style.cssText = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e; };
const kvar = l => `--k: var(${LV[l][2]})`;
const chip = l => el("span", {class: "chip", style: kvar(l)}, `${LV[l][0]} · ${LV[l][1]}`);

let store = {};
try { store = JSON.parse(localStorage.getItem("kb-progress") || "{}"); } catch (e) { store = {}; }
const save = () => { try { localStorage.setItem("kb-progress", JSON.stringify(store)); } catch (e) {} };
const done = id => !!(store.done || {})[id];

function rail(cur) {
  const r = $("#rail"); r.replaceChildren();
  for (const c of CATS) {
    const ts = TOPICS.filter(t => t.cat === c); if (!ts.length) continue;
    r.append(el("h4", {}, c));
    for (const t of ts) r.append(el("a", {href: "#" + t.id, class: (t.id === cur ? "cur " : "") + (done(t.id) ? "done" : ""), style: kvar(t.lvl)}, el("span", {class: "dot"}), t.title));
  }
  const n = TOPICS.filter(t => done(t.id)).length;
  $("#prog").textContent = `${n} / ${TOPICS.length} learned`;
}

function home() {
  const v = $("#view"); v.replaceChildren();
  v.append(el("div", {class: "hero"},
    el("p", {class: "cat"}, "Companion to your placement PDF"),
    el("h1", {}, "Every topic, explained for your plan"),
    el("p", {}, `${TOPICS.length} topics. Each page covers the concept in depth, why it matters for your targets, key points, code, common mistakes, interview questions you can tick off, practice problems and free resources. Tap any topic name in the PDF to land here.`)));
  v.append(el("div", {class: "lv"}, LV.map((l, i) => el("div", {style: kvar(i)}, el("b", {}, l[0]), el("i", {}, l[1]), ["Learn the idea", "Do it with notes", "Cold, timed, aloud", "Handle the twist", "Rare proof"][i]))));
  for (const c of CATS) {
    const ts = TOPICS.filter(t => t.cat === c); if (!ts.length) continue;
    v.append(el("section", {class: "grp"}, el("h2", {}, c, el("small", {}, `${ts.length} · ${CAT_NOTE[c]}`)),
      el("div", {class: "cards"}, ts.map(t => el("a", {href: "#" + t.id, class: "card" + (done(t.id) ? " done" : ""), style: kvar(t.lvl)}, chip(t.lvl), el("b", {}, t.title))))));
  }
  document.title = "Placement Knowledge Base";
}

function blk(title, sub, ...body) { return el("section", {class: "blk"}, el("h2", {}, title, sub ? el("small", {}, sub) : null), ...body); }
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };

function topic(t) {
  const v = $("#view"); v.replaceChildren();
  v.append(el("div", {class: "meta"}, chip(t.lvl), el("span", {class: "cat"}, t.cat)));
  v.append(el("h1", {class: "t-title"}, t.title));
  v.append(el("div", {class: "why", style: kvar(t.lvl)}, el("b", {}, "Why it matters for you"), el("p", {}, t.why)));
  v.append(blk("The concept", "in depth", el("div", {class: "core"}, t.core.map(p => el("p", {}, p)))));
  if (t.points.length) v.append(blk("Key points", "remember these", el("ul", {class: "pts"}, t.points.map(p => el("li", {}, p)))));
  if (t.code) v.append(blk(t.cat === "Security" || t.cat === "Cloud" || t.cat === "Method" || t.cat === "Career" ? "Example" : "Code", "C++ unless noted", el("pre", {}, el("code", {}, t.code))));
  if (t.pit.length) v.append(blk("Common mistakes", null, el("ul", {class: "pts pit"}, t.pit.map(p => el("li", {}, p)))));
  if (t.ask.length) {
    store.q = store.q || {};
    v.append(blk("Interview questions", "tick when you can answer cold",
      el("div", {class: "qs"}, t.ask.map((q, i) => { const k = t.id + ":" + i; const on = !!store.q[k];
        const box = el("input", {type: "checkbox", id: "q-" + t.id + "-" + i});
        box.checked = on;
        const row = el("label", {class: "q" + (on ? " ok" : ""), for: "q-" + t.id + "-" + i}, box, el("span", {}, q));
        box.addEventListener("change", () => { store.q[k] = box.checked; row.classList.toggle("ok", box.checked); save(); });
        return row; }))));
  }
  const lk = arr => el("div", {class: "links"}, arr.map(([n, u]) => el("a", {href: u, target: "_blank", rel: "noopener"}, n, el("span", {}, host(u)))));
  if (t.prac.length) v.append(blk("Practise", "solve these", lk(t.prac)));
  if (t.learn.length) v.append(blk("Learn from", "free unless noted", lk(t.learn)));
  if (t.rel.length) v.append(blk("Related topics", null, el("div", {class: "rel"}, t.rel.map(r => el("a", {href: "#" + r}, el("span", {class: "chip", style: kvar(byId[r].lvl)}, byId[r].title))))));
  const same = TOPICS.filter(x => x.cat === t.cat), i = same.indexOf(t);
  const btn = el("button", {class: "btn pri", type: "button", "aria-pressed": String(done(t.id))}, done(t.id) ? "✓ Learned" : "Mark as learned");
  btn.addEventListener("click", () => { store.done = store.done || {}; store.done[t.id] = !done(t.id); save();
    btn.setAttribute("aria-pressed", String(done(t.id))); btn.textContent = done(t.id) ? "✓ Learned" : "Mark as learned"; rail(t.id); });
  v.append(el("div", {class: "bar"}, btn, el("div", {class: "nav2"},
    i > 0 ? el("a", {class: "btn", href: "#" + same[i - 1].id}, "← " + same[i - 1].title) : null,
    i < same.length - 1 ? el("a", {class: "btn", href: "#" + same[i + 1].id}, same[i + 1].title + " →") : null,
    el("a", {class: "btn", href: "#"}, "All topics"))));
  document.title = t.title + " · Knowledge Base";
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const t = byId[id];
  t ? topic(t) : home();
  rail(t ? t.id : null);
  $("#rail").classList.remove("open"); $("#menu").setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0);
}

// search
const q = $("#q"), res = $("#res"); let hits = [], sel = 0;
function draw() { res.replaceChildren(...hits.map((t, i) => el("a", {href: "#" + t.id, class: i === sel ? "on" : "", style: kvar(t.lvl)}, chip(t.lvl), t.title))); res.hidden = !hits.length; }
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase(); sel = 0;
  if (!s) { hits = []; return draw(); }
  const score = t => { const T = t.title.toLowerCase(); if (T.startsWith(s)) return 3; if (T.includes(s)) return 2; return (t.core.join(" ") + t.points.join(" ") + t.why).toLowerCase().includes(s) ? 1 : 0; };
  hits = TOPICS.map(t => [score(t), t]).filter(x => x[0]).sort((a, b) => b[0] - a[0]).slice(0, 10).map(x => x[1]); draw();
});
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, hits.length - 1); draw(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
  else if (e.key === "Enter" && hits[sel]) { location.hash = hits[sel].id; q.value = ""; hits = []; draw(); q.blur(); }
  else if (e.key === "Escape") { q.value = ""; hits = []; draw(); }
});
res.addEventListener("click", () => { q.value = ""; hits = []; draw(); });
document.addEventListener("click", e => { if (!e.target.closest(".search")) { hits = []; draw(); } });
$("#menu").addEventListener("click", () => { const o = $("#rail").classList.toggle("open"); $("#menu").setAttribute("aria-expanded", String(o)); });
window.addEventListener("hashchange", route);
route();
</script>

</html>
