<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style>
<title>Placement Knowledge Base</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: field-manual reader. Sticky top bar with search; index rail on the left (drawer on phones); one topic per view, routed by #topic-id. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #121826; --muted: #5b6474; --line: #e1e5ec; --soft: #eef1f6;
  --brand: #c2410c; --code-bg: #0e1424; --code-ink: #e3e8f2;
  --l0: #15803d; --l1: #0e7490; --l2: #1d4ed8; --l3: #6d28d9; --l4: #c2410c;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d111a; --panel: #141a26; --ink: #e8ecf3; --muted: #9aa4b6; --line: #252e3e; --soft: #1a2232;
  --brand: #fb923c; --code-bg: #070b14; --code-ink: #dfe6f3;
  --l0: #4ade80; --l1: #22d3ee; --l2: #60a5fa; --l3: #a78bfa; --l4: #fb923c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d111a; --panel: #141a26; --ink: #e8ecf3; --muted: #9aa4b6; --line: #252e3e; --soft: #1a2232;
  --brand: #fb923c; --code-bg: #070b14; --code-ink: #dfe6f3;
  --l0: #4ade80; --l1: #22d3ee; --l2: #60a5fa; --l3: #a78bfa; --l4: #fb923c; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--brand); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 12px; align-items: center; }
.brand { font: 700 17px var(--f-display); color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand span { color: var(--brand); }
.search { flex: 1; min-width: 0; position: relative; max-width: 520px; }
.search input { width: 100%; font: 400 15px var(--f-body); padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgb(0 0 0 / .18); max-height: 60vh; overflow: auto; }
.results a { display: flex; gap: 8px; align-items: center; padding: 8px 12px; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
.results a:hover, .results a.on { background: var(--soft); }
.menu { display: none; font: 600 13px var(--f-mono); background: var(--soft); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.prog { font: 500 12px var(--f-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.wrap { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 0; min-height: calc(100vh - 60px); }
.rail { border-right: 1px solid var(--line); background: var(--panel); padding: 14px 10px 40px max(10px, env(safe-area-inset-left, 0px)); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); height: calc(100vh - 57px); overflow: auto; }
.rail h4 { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 4px; }
.rail a { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.35; }
.rail a:hover { background: var(--soft); }
.rail a.cur { background: var(--soft); font-weight: 600; }
.rail a .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--k); flex: none; }
.rail a.done::after { content: "✓"; margin-left: auto; color: var(--l0); font-size: 12px; }
main { padding-block: 26px 70px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.col { max-width: 780px; margin: 0 auto; }
.chip { display: inline-flex; align-items: center; font: 600 11.5px var(--f-mono); color: var(--k); border: 1px solid color-mix(in srgb, var(--k) 45%, transparent); background: color-mix(in srgb, var(--k) 12%, transparent); border-radius: 99px; padding: 1px 9px; white-space: nowrap; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.cat { font: 600 11.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.t-title { font-size: clamp(28px, 5vw, 40px); line-height: 1.08; letter-spacing: -.01em; }
.why { margin: 18px 0 8px; padding: 14px 16px; border-radius: 10px; background: color-mix(in srgb, var(--k) 9%, var(--panel)); border: 1px solid color-mix(in srgb, var(--k) 30%, transparent); }
.why b { display: block; font: 600 11.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--k); margin-bottom: 4px; }
.why p { margin: 0; }
section.blk { margin-top: 26px; }
section.blk h2 { font-size: 19px; margin-bottom: 8px; display: flex; align-items: baseline; gap: 10px; }
section.blk h2 small { font: 500 11px var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.core p { margin: 0 0 12px; max-width: 68ch; }
ul.pts { margin: 0; padding-left: 20px; }
ul.pts li { margin-bottom: 5px; }
ul.pit li::marker { content: "✗  "; color: #dc2626; }
pre { background: var(--code-bg); color: var(--code-ink); font: 500 13px/1.55 var(--f-mono); padding: 14px 16px; border-radius: 10px; overflow-x: auto; margin: 0; }
.qs { display: grid; gap: 6px; }
.q { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }
.q input { margin-top: 4px; accent-color: var(--l0); }
.q.ok { border-color: color-mix(in srgb, var(--l0) 45%, transparent); }
.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.links a { display: block; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); text-decoration: none; color: var(--ink); font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.links a span { display: block; font: 500 11px var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.links a:hover { border-color: var(--brand); }
.rel { display: flex; flex-wrap: wrap; gap: 8px; }
.rel a { text-decoration: none; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); }
.btn { font: 600 14px var(--f-body); padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.btn.pri { background: var(--l0); border-color: var(--l0); color: #fff; }
.btn.pri[aria-pressed="true"] { background: transparent; color: var(--l0); }
.nav2 { display: flex; gap: 8px; flex-wrap: wrap; }
/* home */
.hero h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.05; letter-spacing: -.02em; }
.hero p { color: var(--muted); max-width: 64ch; margin: 10px 0 0; font-size: 16px; }
.lv { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 22px 0 6px; }
.lv div { padding: 10px; border-radius: 10px; border-top: 4px solid var(--k); background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.lv b { display: block; font: 700 20px var(--f-display); color: var(--k); }
.lv i { font-style: normal; font-weight: 600; color: var(--ink); display: block; }
.grp { margin-top: 28px; }
.grp h2 { font-size: 20px; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.grp h2 small { font: 500 12px var(--f-mono); color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.card { display: block; padding: 11px 13px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); text-decoration: none; color: var(--ink); position: relative; }
.card:hover { border-color: var(--k); }
.card .chip { margin-bottom: 6px; }
.card b { display: block; font-weight: 600; line-height: 1.3; }
.card.done::after { content: "✓ learned"; position: absolute; top: 10px; right: 12px; font: 600 11px var(--f-mono); color: var(--l0); }
details.qa { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 0; }
details.qa summary { cursor: pointer; padding: 10px 12px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; list-style: none; }
details.qa summary::-webkit-details-marker { display: none; }
details.qa summary::after { content: "Show answer"; margin-left: auto; font: 600 11px var(--f-mono); color: var(--brand); white-space: nowrap; }
details.qa[open] summary::after { content: "Hide"; }
details.qa .qn { font: 600 12px var(--f-mono); color: var(--muted); }
details.qa p { margin: 0; padding: 0 12px 8px 40px; max-width: 72ch; }
details.qa .can { display: flex; gap: 8px; align-items: center; padding: 0 12px 10px 40px; font-size: 13px; color: var(--muted); cursor: pointer; }
@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .menu { display: inline-block; }
  .rail { display: none; position: fixed; z-index: 6; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 57px); bottom: 0; height: auto; border-right: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .rail.open { display: block; }
  .prog { display: none; }
  .lv { gap: 5px; } .lv div { padding: 7px 6px; font-size: 0; } .lv b { font-size: 17px; } .lv i { font-size: 10.5px; line-height: 1.2; }
}
@media (max-width: 520px) { .brand b { display: none; } }
@media (prefers-reduced-motion: no-preference) { .view { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(4px); } to { transform: none; } } }
</style>

<header class="top">
  <button class="menu" id="menu" type="button" aria-expanded="false" aria-controls="rail">Topics</button>
  <a class="brand" href="#"><b>Placement </b><span>Knowledge Base</span></a>
  <div class="search"><input id="q" type="search" placeholder="Search a topic: deadlock, sliding window, IAM…" autocomplete="off" aria-label="Search topics"><div class="results" id="res" hidden></div></div>
  <span class="prog" id="prog"></span>
</header>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="All topics"></nav>
  <main id="main"><div class="col view" id="view"></div></main>
</div>

<script>
const TOPICS = [{"id": "active-recall", "title": "Active recall", "cat": "Method", "lvl": 0, "why": "The single biggest learning multiplier. It's why the plan says 'solve before watching' and 'explain on a blank page'.", "core": ["Retrieving information from memory strengthens it far more than re-reading it (the testing effect, Roediger & Karpicke 2006). Struggling to recall is the point; it feels slower but sticks.", "In practice: close the video and solve, write a Core CS answer from memory before checking notes, and use flashcards that ask a question instead of showing a fact.", "The Feynman technique: explain the concept in simple words on a blank page as if teaching a junior. Where you get vague is exactly what to re-learn."], "points": ["Notes in question form ('Why are threads cheaper?')", "Teach a friend or explain aloud", "Use the AI Feynman-checker prompt to find gaps"], "code": "", "pit": ["Highlighting and re-watching (feels productive, isn't)"], "ask": [], "prac": [], "learn": [["Roediger & Karpicke 2006 (PDF)", "http://psychnet.wustl.edu/memory/wp-content/uploads/2018/04/Roediger-Karpicke-2006_PPS.pdf"], ["Anki", "https://apps.ankiweb.net"]], "rel": ["spaced-repetition", "error-log"], "qa": []}, {"id": "spaced-repetition", "title": "Spaced repetition (1-3-7-21)", "cat": "Method", "lvl": 0, "why": "Without revision you forget most of a solved problem within weeks. This turns 550 problems into lasting skill.", "core": ["Memory fades along a forgetting curve; each review at the right moment resets and flattens it. Spacing reviews out (1, 3, 7, 21 days) gives the most retention per minute.", "For DSA: every problem you failed or needed a hint for goes on the list. On its due day, re-solve from a blank file in ≤ 10 minutes. Two clean passes in a row → retire it.", "For Core CS facts: Anki does the scheduling automatically, 10 minutes a day."], "points": ["Revise before new problems each morning", "Keep revision to ~20% of DSA time", "Exam mode = revision only"], "code": "Google Sheets columns:\nDate | Problem | Link | Pattern | Mistake | R1 | R3 | R7 | R21\nR1: =A2+1   R3: =A2+3   R7: =A2+7   R21: =A2+21\nFilter: any R column <= TODAY() and not ticked", "pit": ["Re-reading old solutions instead of re-solving"], "ask": [], "prac": [], "learn": [["Anki manual", "https://docs.ankiweb.net"], ["Gwern on spaced repetition", "https://gwern.net/spaced-repetition"]], "rel": ["active-recall", "error-log"], "qa": []}, {"id": "timebox", "title": "The 20–40 minute rule", "cat": "Method", "lvl": 0, "why": "Stops you wasting hours stuck, and stops you giving up too early. Both are common.", "core": ["Easy/Medium: try for 20 minutes. Hard: 40 minutes. If stuck at the limit, read only the approach or hint (not code), then implement it yourself.", "Stuck time is valuable up to a point: you are building the search for a pattern. Beyond it, you're just tired. The hint converts the struggle into learning.", "Every problem you needed a hint for goes on the spaced-repetition list."], "points": ["Use the AI hint-only prompt for graded hints", "Read the editorial only until the key idea"], "code": "", "pit": ["Copying the full solution", "Spending 3 hours on one problem"], "ask": [], "prac": [], "learn": [], "rel": ["spaced-repetition", "umpire", "ai-tutor"], "qa": []}, {"id": "pattern-thinking", "title": "Patterns, not problems", "cat": "Method", "lvl": 0, "why": "300 problems become about 25 reusable patterns, which is how strong candidates solve problems they've never seen.", "core": ["After each solve, write one line: trigger → pattern. 'Sorted + pair sum → two pointers.' 'Minimum of the maximum → binary search on the answer.'", "Before coding a new problem, scan your trigger list. If nothing fits, run the fallback checklist: can I sort it? hash it? binary search the answer? define states (DP)? model it as a graph?"], "points": ["Keep the trigger list on one page", "Review it before every contest and interview"], "code": "", "pit": ["Memorising solutions instead of triggers"], "ask": [], "prac": [], "learn": [["NeetCode roadmap", "https://neetcode.io/roadmap"]], "rel": ["two-pointers", "sliding-window", "bs-answer", "dp"], "qa": []}, {"id": "interleaving", "title": "Interleaving", "cat": "Method", "lvl": 0, "why": "Interviews don't tell you the topic. Mixed practice trains you to identify the pattern, not just apply it.", "core": ["Blocked practice (ten graph problems in a row) feels smooth because you already know the pattern. Interleaved practice (a graph, then a DP, then a string) forces you to choose, which is the real interview skill. Studies show interleaving improves later test performance even though it feels harder.", "Use blocked practice when first learning a topic (Striver order), then interleave in revision days, contests and mocks."], "points": ["Sunday revision: random mix from the 1-3-7-21 list", "LeetCode 'pick one' or company-tagged lists are naturally interleaved"], "code": "", "pit": ["Interleaving before you know the basics of each topic"], "ask": [], "prac": [], "learn": [], "rel": ["pattern-thinking", "spaced-repetition"], "qa": []}, {"id": "speak-aloud", "title": "Speaking while you code", "cat": "Method", "lvl": 1, "why": "Interviewers score communication. Silence reads as 'stuck'. Tier-3 candidates practise this least.", "core": ["Narrate: restate the problem, ask about constraints, say the brute force and its complexity, explain the better idea before coding, comment while coding ('this map stores value → index'), then dry-run aloud.", "Practise one problem a day out loud, ideally recorded. Listen once a week for long silences and filler."], "points": ["Ask 'Shall I code this approach?' before coding", "Say complexity without being asked"], "code": "", "pit": ["Coding in silence for 10 minutes then explaining"], "ask": [], "prac": [], "learn": [["Pramp (free mock interviews)", "https://www.pramp.com"]], "rel": ["umpire", "mock-interviews"], "qa": []}, {"id": "error-log", "title": "The error log", "cat": "Method", "lvl": 0, "why": "Most wrong answers come from the same 10 mistakes. A log makes them visible so you stop repeating them.", "core": ["Every wrong submission or failed interview question: one line with the problem, the mistake (off-by-one, int overflow, missed empty input, wrong pattern, misread question) and the fix.", "Read the log before every contest, OA and interview. After a month, the top three mistake types become your personal pre-submit checklist."], "points": ["Tag mistakes by type to count them", "Pre-submit checklist: overflow? empty? n=1? duplicates? negative?"], "code": "", "pit": ["Logging without ever re-reading"], "ask": [], "prac": [], "learn": [], "rel": ["spaced-repetition", "oa-tactics"], "qa": []}, {"id": "upsolve", "title": "Upsolving", "cat": "Method", "lvl": 1, "why": "The problem just past your level teaches the most; contests only show you where that is.", "core": ["After a contest, take the first problem you couldn't solve. Try again for 30 minutes, then read the editorial idea, implement it yourself, and add it to the revision list.", "One upsolved problem per contest beats two new contests without upsolving."], "points": ["Rating grows from upsolving, not from attempts"], "code": "", "pit": ["Skipping upsolving because the contest went badly"], "ask": [], "prac": [], "learn": [["Codeforces editorials", "https://codeforces.com"]], "rel": ["cp", "timebox"], "qa": []}, {"id": "deep-work", "title": "Deep-work blocks (50/10)", "cat": "Method", "lvl": 0, "why": "Hours at a desk don't measure progress; focused blocks do. Six blocks is a full-force day.", "core": ["Work 50 minutes on one task with the phone in another room and notifications off; take a 10-minute break away from screens. Count blocks, not hours.", "Put the hardest work (new DSA) in your sharpest hours, and revision, AWS and admin when tired. Decide each block's task the night before so you start instantly."], "points": ["Pomofocus timer", "Track blocks per day in your sheet", "6 blocks = full force; 2 blocks = college day"], "code": "", "pit": ["Checking the phone 'just once' during a block"], "ask": [], "prac": [], "learn": [["Pomofocus", "https://pomofocus.io"], ["Cal Newport, Deep Work (book)", "https://calnewport.com/deep-work-rules-for-focused-success-in-a-distracted-world/"]], "rel": ["day-modes", "sleep"], "qa": []}, {"id": "sleep", "title": "Sleep, exercise and energy", "cat": "Method", "lvl": 0, "why": "Memory consolidation happens during sleep. Cutting sleep to study more is a net loss.", "core": ["Sleep 7–8 hours at a fixed time. Sleep after learning consolidates new memories; sleep deprivation hurts attention, problem-solving and recall the next day.", "Exercise 20–30 minutes a day (walk, sport, gym) improves focus and mood. One rest half-day a week prevents burnout, which costs weeks."], "points": ["No all-nighters before contests or interviews", "Caffeine before 2 pm"], "code": "", "pit": ["Comparing yourself to LinkedIn posts at midnight"], "ask": [], "prac": [], "learn": [["Matthew Walker, Why We Sleep (book)", "https://www.simonandschuster.com/books/Why-We-Sleep/Matthew-Walker/9781501144325"]], "rel": ["deep-work", "day-modes"], "qa": []}, {"id": "weekly-review", "title": "Weekly review", "cat": "Method", "lvl": 0, "why": "Plans fail quietly. A 30-minute review each Sunday catches drift before it becomes a lost month.", "core": ["Every Sunday: count problems, contests and blocks against the week's target; re-solve the week's failed problems; look at what slipped and why; set next week's three priorities.", "Monthly (last Sunday, 1 hour): check the milestone checklist, take one timed mock on old topics, cut whatever isn't moving a number."], "points": ["Move unfinished items, never stack them on top", "Adjust quotas by ±1 problem, not ±5"], "code": "", "pit": ["Abandoning the plan after one bad week"], "ask": [], "prac": [], "learn": [], "rel": ["day-modes", "spaced-repetition"], "qa": []}, {"id": "day-modes", "title": "Day modes and the never-zero rule", "cat": "Method", "lvl": 0, "why": "Your weeks will differ: home, college, exams, bad days. A recipe for each removes the daily decision and keeps the streak.", "core": ["Pick one mode each morning: Full force (6–8 blocks), College day (2 problems + AWS + flashcards), Exam mode (1 revision problem), Low energy (1 easy re-solve + read the error log), Sprint (mock + company set + applications).", "Never zero: the streak is 'at least one problem touched'. A low-energy day that keeps the streak beats a perfect day followed by four days off.", "Behind schedule? Cut the newest track (AI, then HFT), never DSA or revision, and never double tomorrow's quota."], "points": ["Plan tomorrow in 5 minutes tonight", "Exam mode 22 Mar – 7 Apr 2027"], "code": "", "pit": ["All-or-nothing thinking"], "ask": [], "prac": [], "learn": [], "rel": ["deep-work", "weekly-review"], "qa": []}, {"id": "ai-tutor", "title": "Using AI as a tutor", "cat": "Method", "lvl": 0, "why": "Claude and Gemini can be a free tutor and interviewer, or a crutch that makes you feel productive while learning nothing. The rules decide which.", "core": ["Use AI for: graded hints (one at a time), mock interviews, reviewing your accepted code, checking your Feynman explanations, generating flashcards, and resume critique.", "Never paste a problem and ask for the solution before your 20/40-minute timebox. Interviewers spot borrowed understanding in two minutes of follow-ups.", "Verify facts it gives you against docs; models can be confidently wrong, especially on exact numbers and APIs."], "points": ["Ask it to grade you 1–5 with one fix per area", "Use it to explain an editorial line you don't get"], "code": "Hint-only tutor prompt:\nI'm solving [problem]. Don't give the solution or code. Give me one hint at a time,\nthe smallest nudge first. Wait for me to say 'next' before the next hint.", "pit": ["Copying AI code into LeetCode", "Trusting its complexity analysis without checking"], "ask": [], "prac": [], "learn": [], "rel": ["timebox", "mock-interviews"], "qa": []}, {"id": "complexity", "title": "Time and space complexity", "cat": "DSA", "lvl": 0, "why": "Every interview answer ends with 'what's the complexity?'. It is also how you pick an approach before writing code: the input limit tells you which complexities will pass.", "core": ["Big-O describes how running time or memory grows as the input size n grows, ignoring constants. A judge runs roughly 10⁸ simple operations per second, so you can estimate before coding.", "Read n from the constraints and work backwards: n ≤ 10 allows O(n!), n ≤ 20 allows O(2ⁿ), n ≤ 500 allows O(n³), n ≤ 5000 allows O(n²), n ≤ 10⁶ needs O(n log n) or O(n), and n ≥ 10⁹ needs O(log n) or O(1) maths.", "Space counts extra memory you allocate, including the recursion stack. A recursive DFS on a path of 10⁵ nodes uses 10⁵ stack frames, which can overflow."], "points": ["Nested loops over the same array → O(n²); halving each step → O(log n)", "Sorting is O(n log n); a hash map lookup is O(1) average, O(n) worst", "Amortised O(1): vector push_back doubles capacity occasionally", "Recursion: work per call × number of calls (draw the tree)", "Two pointers moving one way each → O(n) total, not O(n²)"], "code": "", "pit": ["Forgetting the cost of string concatenation inside a loop", "Calling .size() or erase on the front of a vector inside a loop (erase is O(n))", "Saying O(1) for unordered_map without mentioning worst case when asked"], "ask": ["What is the complexity of your solution, time and space?", "Can you do better than O(n²)?", "Why is building a heap O(n) and not O(n log n)?"], "prac": [["Two Sum", "https://leetcode.com/problems/two-sum/"], ["Contains Duplicate", "https://leetcode.com/problems/contains-duplicate/"]], "learn": [["Big-O cheat sheet", "https://www.bigocheatsheet.com"], ["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["cpp-stl", "binary-search"], "qa": []}, {"id": "cpp-stl", "title": "C++ and the STL", "cat": "DSA", "lvl": 0, "why": "You chose C++ for DSA. In interviews and OAs, fluent STL saves 5–10 minutes per problem, and HFT firms test C++ more deeply than anyone.", "core": ["Containers: vector (dynamic array), deque, list, set/map (red-black tree, ordered, O(log n)), unordered_set/unordered_map (hash table, O(1) average), priority_queue (binary heap, max by default), stack, queue.", "Algorithms: sort, stable_sort, lower_bound/upper_bound (on sorted ranges), binary_search, reverse, accumulate, max_element, next_permutation, unique (with erase).", "Idioms: auto and range-for, structured bindings (auto [a, b] = p), lambdas as comparators, emplace_back, fast I/O with ios::sync_with_stdio(false); cin.tie(nullptr)."], "points": ["priority_queue<int, vector<int>, greater<int>> is a min-heap", "map[key] inserts a default if missing; use find or count to check", "lower_bound → first ≥ x; upper_bound → first > x", "Use long long when sums can pass 2·10⁹", "Pass big containers by reference (const vector<int>&)"], "code": "vector<int> a = {5, 1, 4};\nsort(a.begin(), a.end(), [](int x, int y) { return x > y; });\nunordered_map<int,int> freq; for (int x : a) freq[x]++;\npriority_queue<int, vector<int>, greater<int>> minh(a.begin(), a.end());\nauto it = lower_bound(a.rbegin(), a.rend(), 4); // works on reversed order", "pit": ["Iterator invalidation after erase/push_back", "Comparator must be a strict weak ordering (use <, never <=)", "Copying a vector into a function by value inside recursion"], "ask": ["Difference between map and unordered_map?", "How does vector grow?", "What is RAII?", "Why is unordered_map worst case O(n)?"], "prac": [["Top K Frequent Elements", "https://leetcode.com/problems/top-k-frequent-elements/"], ["Group Anagrams", "https://leetcode.com/problems/group-anagrams/"]], "learn": [["takeuforward STL", "https://takeuforward.org/c/c-stl-tutorial-most-asked-stl-functions-in-c/"], ["learncpp.com", "https://www.learncpp.com"], ["cppreference", "https://en.cppreference.com"]], "rel": ["complexity", "oop"], "qa": []}, {"id": "hashing", "title": "Hashing and frequency maps", "cat": "DSA", "lvl": 1, "why": "Turns many O(n²) 'have I seen this?' searches into O(n). It is the first optimisation interviewers expect.", "core": ["A hash table stores keys in buckets chosen by a hash function. Average lookup, insert and delete are O(1); collisions make the worst case O(n).", "Patterns: count frequencies, remember the index where a value was first seen, check complements (target − x), group by a canonical key (sorted string for anagrams)."], "points": ["Two Sum: store value → index, check target − x before inserting x", "Anagram key: sorted string or 26-count array", "Use an array of 26/128 instead of a map when the alphabet is small"], "code": "", "pit": ["Inserting before checking (pairs an element with itself)", "Using unordered_map with pair keys (needs a custom hash)"], "ask": ["How does a hash map handle collisions?", "Why not always use a hash map?"], "prac": [["Two Sum", "https://leetcode.com/problems/two-sum/"], ["Group Anagrams", "https://leetcode.com/problems/group-anagrams/"], ["Longest Consecutive Sequence", "https://leetcode.com/problems/longest-consecutive-sequence/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["prefix-sum", "sliding-window"], "qa": []}, {"id": "two-pointers", "title": "Two pointers", "cat": "DSA", "lvl": 1, "why": "One of the five most frequent interview patterns. Turns pair searches in sorted data from O(n²) into O(n).", "core": ["Keep two indices and move them based on a comparison. On a sorted array, if a[i] + a[j] is too small move i right; if too large move j left. Each pointer moves at most n times, so the total is O(n).", "Variants: opposite ends (pair sum, container with most water), same direction fast/slow (remove duplicates, linked-list cycle), and fixing one element then running two pointers on the rest (3Sum, O(n²))."], "points": ["Needs sorted input or a monotone condition", "3Sum: sort, fix i, two pointers on i+1..n−1, skip duplicates", "Partitioning (Dutch national flag) is three pointers"], "code": "sort(a.begin(), a.end());\nint i = 0, j = n - 1;\nwhile (i < j) {\n    int s = a[i] + a[j];\n    if (s == target) return {i, j};\n    if (s < target) i++; else j--;\n}", "pit": ["Not skipping duplicates in 3Sum", "Using it on unsorted data without sorting"], "ask": ["Why does moving the smaller side work in Container With Most Water?", "Prove two pointers doesn't miss a pair."], "prac": [["3Sum", "https://leetcode.com/problems/3sum/"], ["Container With Most Water", "https://leetcode.com/problems/container-with-most-water/"], ["Trapping Rain Water", "https://leetcode.com/problems/trapping-rain-water/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"], ["NeetCode practice", "https://neetcode.io/practice"]], "rel": ["sliding-window", "binary-search"], "qa": []}, {"id": "sliding-window", "title": "Sliding window", "cat": "DSA", "lvl": 1, "why": "Covers most 'longest/shortest substring or subarray such that…' questions, which appear in nearly every company's list.", "core": ["Maintain a window [l, r]. Expand r each step; while the window breaks the rule, shrink l. Every index enters and leaves once, so it's O(n).", "Fixed-size windows slide by adding a[r] and removing a[r−k]. Variable windows need the condition to be monotone: if a window is invalid, every bigger window containing it is invalid too.", "'Exactly k' problems are often solved as atMost(k) − atMost(k−1)."], "points": ["Track counts in a map or array for character windows", "Answer is updated after the shrink loop (longest) or inside it (shortest)", "Negative numbers break the monotone condition → use prefix sums instead"], "code": "int best = 0;\nfor (int l = 0, r = 0; r < n; r++) {\n    add(a[r]);\n    while (!valid()) remove(a[l++]);\n    best = max(best, r - l + 1);\n}", "pit": ["Using it on sums with negative numbers", "Forgetting to remove a[l] before l++"], "ask": ["Why is it O(n) when there's a nested while loop?", "How do you handle 'exactly k distinct'?"], "prac": [["Longest Substring Without Repeating Characters", "https://leetcode.com/problems/longest-substring-without-repeating-characters/"], ["Minimum Window Substring", "https://leetcode.com/problems/minimum-window-substring/"], ["Longest Repeating Character Replacement", "https://leetcode.com/problems/longest-repeating-character-replacement/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["two-pointers", "prefix-sum", "hashing"], "qa": []}, {"id": "prefix-sum", "title": "Prefix sums", "cat": "DSA", "lvl": 1, "why": "Range sums in O(1) and 'count subarrays with sum k' in O(n). Works with negative numbers where sliding window fails.", "core": ["pre[i] = a[0] + … + a[i−1]. The sum of a[l..r] is pre[r+1] − pre[l].", "To count subarrays summing to k: walk once, keep a map of how many times each prefix value has appeared; at each step add seen[pre − k]. Start with seen[0] = 1.", "2D prefix sums give rectangle sums in O(1); difference arrays apply range updates in O(1) then rebuild."], "points": ["seen[0] = 1 handles subarrays starting at index 0", "Use long long for prefix arrays", "XOR prefix works the same way for XOR queries"], "code": "unordered_map<long long,int> seen{{0, 1}};\nlong long s = 0; int ways = 0;\nfor (int x : a) { s += x; ways += seen[s - k]; seen[s]++; }", "pit": ["Off-by-one between pre[r+1] and pre[r]", "Forgetting the initial seen[0] = 1"], "ask": ["Why doesn't a sliding window work for Subarray Sum Equals K?"], "prac": [["Subarray Sum Equals K", "https://leetcode.com/problems/subarray-sum-equals-k/"], ["Range Sum Query 2D Immutable", "https://leetcode.com/problems/range-sum-query-2d-immutable/"], ["Continuous Subarray Sum", "https://leetcode.com/problems/continuous-subarray-sum/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["hashing", "sliding-window", "segment-tree"], "qa": []}, {"id": "binary-search", "title": "Binary search", "cat": "DSA", "lvl": 1, "why": "Asked at every level, and the bug-prone template interviewers watch closely. Step 4 of Striver's sheet.", "core": ["On a sorted range, compare with the middle and discard half. O(log n).", "Think of it as finding the boundary of a predicate that is false…false then true…true. Search for the first true. This one template covers lower_bound, first/last occurrence, rotated arrays and peaks.", "Use mid = lo + (hi − lo) / 2 to avoid overflow."], "points": ["Rotated sorted array: one half is always sorted; check which", "Peak element: compare a[mid] with a[mid+1]", "Search a 2D sorted matrix as a flattened 1D array"], "code": "int lo = 0, hi = n - 1, ans = n;\nwhile (lo <= hi) {\n    int mid = lo + (hi - lo) / 2;\n    if (a[mid] >= x) { ans = mid; hi = mid - 1; }\n    else lo = mid + 1;\n}", "pit": ["Infinite loop from lo = mid with lo < hi", "Wrong boundary returned (first vs last)"], "ask": ["Find the first and last position of an element.", "Search in a rotated sorted array with duplicates."], "prac": [["Search In Rotated Sorted Array", "https://leetcode.com/problems/search-in-rotated-sorted-array/"], ["Find First And Last Position Of Element In Sorted Array", "https://leetcode.com/problems/find-first-and-last-position-of-element-in-sorted-array/"], ["Find Peak Element", "https://leetcode.com/problems/find-peak-element/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["bs-answer", "two-pointers"], "qa": []}, {"id": "bs-answer", "title": "Binary search on the answer", "cat": "DSA", "lvl": 2, "why": "A favourite Medium/Hard twist at Amazon, Google and in OAs. Recognising it is most of the work.", "core": ["When the question asks for the minimum (or maximum) value X such that something is feasible, and feasibility is monotone in X, binary search over X and write an O(n) check(X).", "Classic shapes: 'minimise the largest sum when splitting into k parts', 'minimum speed/capacity to finish in D days', 'maximise the minimum distance between cows'."], "points": ["Range of X: from the smallest possible answer to the largest", "check(X) is usually greedy", "Total O(n log range)"], "code": "long long lo = MIN_ANS, hi = MAX_ANS, ans = hi;\nwhile (lo <= hi) {\n    long long mid = lo + (hi - lo) / 2;\n    if (ok(mid)) { ans = mid; hi = mid - 1; } else lo = mid + 1;\n}", "pit": ["Wrong bounds (lo too high excludes the answer)", "Non-monotone check"], "ask": ["How do you know the answer space is monotone?"], "prac": [["Koko Eating Bananas", "https://leetcode.com/problems/koko-eating-bananas/"], ["Split Array Largest Sum", "https://leetcode.com/problems/split-array-largest-sum/"], ["Capacity To Ship Packages Within D Days", "https://leetcode.com/problems/capacity-to-ship-packages-within-d-days/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["binary-search", "greedy"], "qa": []}, {"id": "linked-list", "title": "Linked lists", "cat": "DSA", "lvl": 1, "why": "Pointer manipulation questions are common in first rounds and test careful coding. Step 6 of the sheet.", "core": ["Each node holds a value and a pointer to the next. Insertion/deletion at a known node is O(1); access by index is O(n).", "Core techniques: a dummy head node to avoid edge cases, fast/slow pointers (middle, cycle detection by Floyd's algorithm, cycle start), and iterative reversal with prev/curr/next."], "points": ["Reverse: three pointers, return prev", "Cycle start: after meeting, move one pointer to head, step both by 1", "Merge two sorted lists with a dummy node", "LRU cache = hash map + doubly linked list"], "code": "ListNode* prev = nullptr; ListNode* cur = head;\nwhile (cur) { ListNode* nx = cur->next; cur->next = prev; prev = cur; cur = nx; }\nreturn prev;", "pit": ["Dereferencing null on fast->next->next", "Losing the rest of the list before re-linking"], "ask": ["Detect and remove a cycle.", "Reverse nodes in k-groups.", "Design an LRU cache."], "prac": [["Reverse Linked List", "https://leetcode.com/problems/reverse-linked-list/"], ["Linked List Cycle Ii", "https://leetcode.com/problems/linked-list-cycle-ii/"], ["Lru Cache", "https://leetcode.com/problems/lru-cache/"], ["Reverse Nodes In K Group", "https://leetcode.com/problems/reverse-nodes-in-k-group/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["two-pointers"], "qa": []}, {"id": "recursion", "title": "Recursion and backtracking", "cat": "DSA", "lvl": 1, "why": "The base for trees, graphs and DP. Subsets, permutations and N-Queens are standard interview questions.", "core": ["Recursion: solve a problem using smaller copies of itself; define the base case first, then trust the call.", "Backtracking explores a decision tree: choose, recurse, un-choose. It's exhaustive, so complexity is the size of the tree (2ⁿ for subsets, n! for permutations).", "Prune early: stop a branch as soon as it cannot lead to a valid answer."], "points": ["Pick / not-pick for subsets", "Swap-based or used[] array for permutations", "Skip duplicates by sorting and checking i > start && a[i] == a[i−1]"], "code": "void go(int i, vector<int>& cur) {\n    if (i == n) { res.push_back(cur); return; }\n    cur.push_back(a[i]); go(i + 1, cur); cur.pop_back(); // pick\n    go(i + 1, cur);                                    // skip\n}", "pit": ["Forgetting to un-choose", "Copying vectors in every call"], "ask": ["Generate all valid parentheses.", "Solve N-Queens.", "What's the complexity of your backtracking?"], "prac": [["Subsets Ii", "https://leetcode.com/problems/subsets-ii/"], ["Permutations", "https://leetcode.com/problems/permutations/"], ["Combination Sum", "https://leetcode.com/problems/combination-sum/"], ["N Queens", "https://leetcode.com/problems/n-queens/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["dp", "bitmask-dp"], "qa": []}, {"id": "stack-queue", "title": "Stacks and queues", "cat": "DSA", "lvl": 1, "why": "Expression parsing, bracket matching and undo-style problems. Step 9 of the sheet, and the base for monotonic stacks.", "core": ["A stack is last-in-first-out; a queue is first-in-first-out. Both give O(1) push and pop.", "Use a stack when the most recent unfinished item matters (brackets, function calls, undo). Use a queue for processing in arrival order (BFS, scheduling)."], "points": ["Valid parentheses with a stack of opening brackets", "Min-stack keeps a second stack of current minimums", "Queue using two stacks: amortised O(1)"], "code": "", "pit": ["Popping an empty stack", "Using std::stack when you need to iterate (use vector)"], "ask": ["Implement a queue with stacks.", "Design a min-stack."], "prac": [["Valid Parentheses", "https://leetcode.com/problems/valid-parentheses/"], ["Min Stack", "https://leetcode.com/problems/min-stack/"], ["Evaluate Reverse Polish Notation", "https://leetcode.com/problems/evaluate-reverse-polish-notation/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["monotonic-stack", "bfs"], "qa": []}, {"id": "monotonic-stack", "title": "Monotonic stack", "cat": "DSA", "lvl": 2, "why": "Solves next-greater, stock span and largest-rectangle problems in O(n). A common Medium/Hard step-up.", "core": ["Keep a stack whose values are always increasing (or decreasing). When a new element breaks the order, pop: each popped element has just found its next greater (or smaller) element.", "Every element is pushed and popped once, so the total is O(n). Store indices, not values, so you can compute distances and widths."], "points": ["Largest rectangle in histogram: previous and next smaller", "Daily temperatures: next greater, answer = index distance", "Sum of subarray minimums: count contributions with previous/next smaller"], "code": "vector<int> nge(n, -1); stack<int> st;\nfor (int i = 0; i < n; i++) {\n    while (!st.empty() && a[st.top()] < a[i]) { nge[st.top()] = a[i]; st.pop(); }\n    st.push(i);\n}", "pit": ["Strict vs non-strict comparison with duplicates (double counting)"], "ask": ["Largest rectangle in a histogram.", "Trapping rain water with a stack."], "prac": [["Daily Temperatures", "https://leetcode.com/problems/daily-temperatures/"], ["Largest Rectangle In Histogram", "https://leetcode.com/problems/largest-rectangle-in-histogram/"], ["Sum Of Subarray Minimums", "https://leetcode.com/problems/sum-of-subarray-minimums/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["stack-queue"], "qa": []}, {"id": "heap", "title": "Heaps and priority queues", "cat": "DSA", "lvl": 2, "why": "Top-K, merging sorted lists, scheduling and Dijkstra all use a heap. Very common at Amazon.", "core": ["A binary heap keeps the smallest (or largest) element on top. Push and pop are O(log n); peek is O(1); building from n items is O(n).", "Top K largest: keep a min-heap of size k; pop when it grows past k. Streaming median: a max-heap for the lower half and a min-heap for the upper half, kept balanced."], "points": ["K-way merge: push the head of each list", "Use pair<int,int> to sort by priority then id", "Lazy deletion: skip stale entries when popped"], "code": "", "pit": ["Default priority_queue is a max-heap", "Sorting everything when you only need top k"], "ask": ["Find the median of a data stream.", "Why is heapify O(n)?"], "prac": [["Kth Largest Element In An Array", "https://leetcode.com/problems/kth-largest-element-in-an-array/"], ["Merge K Sorted Lists", "https://leetcode.com/problems/merge-k-sorted-lists/"], ["Find Median From Data Stream", "https://leetcode.com/problems/find-median-from-data-stream/"], ["Task Scheduler", "https://leetcode.com/problems/task-scheduler/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["dijkstra", "greedy"], "qa": []}, {"id": "greedy", "title": "Greedy algorithms", "cat": "DSA", "lvl": 2, "why": "Short code, but you must justify it. Interviewers ask 'why does greedy work here?'.", "core": ["Make the locally best choice at each step and never revisit it. It works only when an exchange argument holds: any optimal solution can be changed step by step into the greedy one without getting worse.", "Most greedy solutions start by sorting: by end time (activity selection), by ratio (fractional knapsack), by deadline (job sequencing)."], "points": ["Interval scheduling: sort by end, take if start ≥ last end", "Jump game: track the furthest reachable index", "If greedy fails on a small counterexample → it's DP"], "code": "", "pit": ["Assuming greedy works without testing a counterexample (0/1 knapsack)"], "ask": ["Prove your greedy choice is safe.", "When would greedy fail here?"], "prac": [["Jump Game Ii", "https://leetcode.com/problems/jump-game-ii/"], ["Non Overlapping Intervals", "https://leetcode.com/problems/non-overlapping-intervals/"], ["Gas Station", "https://leetcode.com/problems/gas-station/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["intervals", "dp"], "qa": []}, {"id": "intervals", "title": "Interval problems", "cat": "DSA", "lvl": 2, "why": "Merge intervals and meeting rooms are top-asked at Google, Microsoft and Amazon.", "core": ["Sort by start (to merge) or by end (to choose the most non-overlapping). Then sweep once.", "For 'how many overlap at once' (meeting rooms), sweep over events: +1 at start, −1 at end, and track the maximum; or use a min-heap of end times."], "points": ["Merge: if start ≤ last end, extend; else push new", "Insert interval: three phases (before, overlapping, after)"], "code": "", "pit": ["Touching intervals: decide whether [1,2] and [2,3] overlap"], "ask": ["Minimum meeting rooms needed.", "Merge overlapping intervals."], "prac": [["Merge Intervals", "https://leetcode.com/problems/merge-intervals/"], ["Insert Interval", "https://leetcode.com/problems/insert-interval/"], ["Non Overlapping Intervals", "https://leetcode.com/problems/non-overlapping-intervals/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["greedy", "heap"], "qa": []}, {"id": "bit-manipulation", "title": "Bit manipulation", "cat": "DSA", "lvl": 1, "why": "Quick wins in OAs (single number, power of two), and the base for bitmask DP.", "core": ["x & 1 tests odd; x & (x−1) clears the lowest set bit; x & −x isolates it; a ^ a = 0, so XOR of all elements leaves the one that appears once.", "A mask of n bits represents a subset of n items: loop mask from 0 to 2ⁿ − 1 to enumerate all subsets."], "points": ["__builtin_popcount(x) counts set bits", "Check bit i: (x >> i) & 1; set: x | (1 << i)", "Use 1LL << i for i ≥ 31"], "code": "", "pit": ["Operator precedence: write (x & 1) == 0 with brackets"], "ask": ["Find the two numbers that appear once.", "Count bits from 0 to n."], "prac": [["Single Number", "https://leetcode.com/problems/single-number/"], ["Counting Bits", "https://leetcode.com/problems/counting-bits/"], ["Subsets", "https://leetcode.com/problems/subsets/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"], ["cp-algorithms: bit manipulation", "https://cp-algorithms.com/algebra/bit-manipulation.html"]], "rel": ["bitmask-dp", "trie"], "qa": []}, {"id": "trees", "title": "Binary trees", "cat": "DSA", "lvl": 2, "why": "The largest single topic in interviews. Step 13–14 of the sheet.", "core": ["Traversals: preorder, inorder, postorder (DFS) and level order (BFS with a queue). Know both recursive and iterative versions.", "Most tree problems are 'return something from each subtree and combine': height, diameter, balanced check, max path sum. Write a function that returns the subtree answer and updates a global best.", "Lowest common ancestor: if both sides return non-null, the current node is the LCA."], "points": ["Diameter = max over nodes of leftHeight + rightHeight", "Serialize with preorder + null markers", "Views (left/right/top/bottom) use BFS with column index"], "code": "int best = INT_MIN;\nint gain(TreeNode* r) {\n    if (!r) return 0;\n    int L = max(0, gain(r->left)), R = max(0, gain(r->right));\n    best = max(best, r->val + L + R);\n    return r->val + max(L, R);\n}", "pit": ["Confusing 'path through node' with 'path returned to parent'", "Recursion depth on skewed trees"], "ask": ["Maximum path sum.", "Serialize and deserialize a tree.", "Lowest common ancestor."], "prac": [["Binary Tree Maximum Path Sum", "https://leetcode.com/problems/binary-tree-maximum-path-sum/"], ["Lowest Common Ancestor Of A Binary Tree", "https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-tree/"], ["Serialize And Deserialize Binary Tree", "https://leetcode.com/problems/serialize-and-deserialize-binary-tree/"], ["Diameter Of Binary Tree", "https://leetcode.com/problems/diameter-of-binary-tree/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["bst", "tree-dp", "bfs"], "qa": []}, {"id": "bst", "title": "Binary search trees", "cat": "DSA", "lvl": 2, "why": "Common follow-up to tree questions; inorder-sorted property shows up everywhere.", "core": ["Left subtree < node < right subtree. Inorder traversal gives sorted order. Search, insert and delete are O(h): O(log n) if balanced, O(n) if skewed.", "Validate with a (low, high) range passed down, not just comparing with children."], "points": ["Kth smallest = kth node in inorder", "LCA in BST: walk down using values", "std::set/map are balanced BSTs (red-black)"], "code": "", "pit": ["Validating only parent-child pairs"], "ask": ["Validate a BST.", "Delete a node from a BST."], "prac": [["Validate Binary Search Tree", "https://leetcode.com/problems/validate-binary-search-tree/"], ["Kth Smallest Element In A Bst", "https://leetcode.com/problems/kth-smallest-element-in-a-bst/"], ["Delete Node In A Bst", "https://leetcode.com/problems/delete-node-in-a-bst/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["trees", "binary-search"], "qa": []}, {"id": "bfs", "title": "BFS and graph basics", "cat": "DSA", "lvl": 1, "why": "Graphs are in almost every product-company loop. BFS gives shortest paths when every edge costs the same.", "core": ["Store a graph as an adjacency list: vector<vector<int>> adj(n). Grids are implicit graphs with 4 neighbours.", "BFS uses a queue and visits nodes in order of distance from the source, so the first time you reach a node is its shortest path. O(V + E).", "Multi-source BFS starts with all sources in the queue (rotting oranges, nearest 0). 0-1 BFS uses a deque for edges of weight 0 or 1."], "points": ["Mark visited when pushing, not when popping", "Grid: dr/dc arrays for directions", "Bipartite check = BFS 2-colouring"], "code": "vector<int> dist(n, -1); queue<int> q; dist[s] = 0; q.push(s);\nwhile (!q.empty()) {\n    int u = q.front(); q.pop();\n    for (int v : adj[u]) if (dist[v] == -1) { dist[v] = dist[u] + 1; q.push(v); }\n}", "pit": ["Marking visited on pop → duplicates in queue"], "ask": ["Rotting oranges.", "Word ladder.", "Is the graph bipartite?"], "prac": [["Rotting Oranges", "https://leetcode.com/problems/rotting-oranges/"], ["Word Ladder", "https://leetcode.com/problems/word-ladder/"], ["Is Graph Bipartite", "https://leetcode.com/problems/is-graph-bipartite/"], ["Number Of Islands", "https://leetcode.com/problems/number-of-islands/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"], ["CSES problem set", "https://cses.fi/problemset/"]], "rel": ["dfs", "dijkstra", "topo-sort"], "qa": []}, {"id": "dfs", "title": "DFS, components and cycles", "cat": "DSA", "lvl": 1, "why": "Connected components, cycle detection and flood fill are standard graph questions.", "core": ["DFS goes deep along one path before backtracking. Recursive or with an explicit stack. O(V + E).", "Undirected cycle: you reach a visited node that isn't your parent. Directed cycle: you reach a node still on the current recursion path (keep an inStack array or 3 colours).", "Count components by starting a DFS from every unvisited node."], "points": ["Flood fill on grids is DFS", "Directed cycle check = topo sort fails", "Bridges/articulation points use discovery and low times (L3)"], "code": "", "pit": ["Stack overflow on 10⁶-node grids: use iterative DFS or BFS"], "ask": ["Detect a cycle in a directed graph.", "Number of islands.", "Clone a graph."], "prac": [["Number Of Islands", "https://leetcode.com/problems/number-of-islands/"], ["Clone Graph", "https://leetcode.com/problems/clone-graph/"], ["Course Schedule", "https://leetcode.com/problems/course-schedule/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"], ["CSES problem set", "https://cses.fi/problemset/"]], "rel": ["bfs", "topo-sort", "dsu"], "qa": []}, {"id": "dijkstra", "title": "Dijkstra and shortest paths", "cat": "DSA", "lvl": 2, "why": "The standard weighted shortest path. Asked at Google, Uber, Flipkart.", "core": ["Dijkstra: a min-heap of (distance, node). Pop the closest, relax its edges. Works only with non-negative weights. O((V + E) log V).", "Bellman-Ford relaxes all edges V−1 times, handles negative edges and detects negative cycles, O(VE). Floyd-Warshall gives all pairs in O(V³) for small V."], "points": ["Skip stale heap entries: if (d > dist[u]) continue", "Cheapest flights within K stops: BFS by level or Bellman-Ford with K rounds", "Path reconstruction with a parent array"], "code": "vector<long long> d(n, INF); d[s] = 0;\npriority_queue<pair<long long,int>, vector<pair<long long,int>>, greater<>> pq; pq.push({0, s});\nwhile (!pq.empty()) {\n    auto [du, u] = pq.top(); pq.pop();\n    if (du > d[u]) continue;\n    for (auto [v, w] : adj[u]) if (d[u] + w < d[v]) { d[v] = d[u] + w; pq.push({d[v], v}); }\n}", "pit": ["Using Dijkstra with negative edges", "int overflow on distances"], "ask": ["Why does Dijkstra fail with negative weights?", "Network delay time."], "prac": [["Network Delay Time", "https://leetcode.com/problems/network-delay-time/"], ["Path With Minimum Effort", "https://leetcode.com/problems/path-with-minimum-effort/"], ["Cheapest Flights Within K Stops", "https://leetcode.com/problems/cheapest-flights-within-k-stops/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"], ["cp-algorithms: Dijkstra", "https://cp-algorithms.com/graph/dijkstra.html"]], "rel": ["bfs", "heap"], "qa": []}, {"id": "topo-sort", "title": "Topological sort", "cat": "DSA", "lvl": 2, "why": "Course schedule and build-order questions; also how you detect cycles in directed graphs.", "core": ["An order of a DAG's nodes where every edge goes forward. Kahn's algorithm: push all nodes with in-degree 0, pop, decrement neighbours, push any that reach 0. If you output fewer than V nodes, there's a cycle.", "DFS version: add a node to the list after visiting all its children, then reverse."], "points": ["Alien dictionary: build edges from adjacent words", "Longest path in a DAG = DP in topo order"], "code": "", "pit": ["Not handling disconnected nodes"], "ask": ["Course schedule II.", "Alien dictionary."], "prac": [["Course Schedule Ii", "https://leetcode.com/problems/course-schedule-ii/"], ["Course Schedule", "https://leetcode.com/problems/course-schedule/"], ["Parallel Courses", "https://leetcode.com/problems/parallel-courses/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["dfs", "bfs"], "qa": []}, {"id": "dsu", "title": "Disjoint set union (Union-Find)", "cat": "DSA", "lvl": 2, "why": "Fast connectivity for dynamic merging, Kruskal's MST and 'accounts merge'.", "core": ["Each set has a root. find(x) follows parents to the root; union(a, b) links roots. With path compression and union by size, each operation is almost O(1) (inverse Ackermann).", "Kruskal's minimum spanning tree: sort edges by weight, add an edge if its ends are in different sets."], "points": ["Count components = number of successful unions subtracted from n", "Redundant connection: the edge whose ends are already joined"], "code": "vector<int> p(n), sz(n, 1); iota(p.begin(), p.end(), 0);\nfunction<int(int)> find = [&](int x) { return p[x] == x ? x : p[x] = find(p[x]); };\nauto unite = [&](int a, int b) { a = find(a); b = find(b); if (a == b) return false;\n    if (sz[a] < sz[b]) swap(a, b); p[b] = a; sz[a] += sz[b]; return true; };", "pit": ["Forgetting to call find before comparing"], "ask": ["Number of provinces.", "Accounts merge.", "Minimum spanning tree."], "prac": [["Number Of Provinces", "https://leetcode.com/problems/number-of-provinces/"], ["Redundant Connection", "https://leetcode.com/problems/redundant-connection/"], ["Accounts Merge", "https://leetcode.com/problems/accounts-merge/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"], ["cp-algorithms: DSU", "https://cp-algorithms.com/data_structures/disjoint_set_union.html"]], "rel": ["dfs"], "qa": []}, {"id": "dp", "title": "Dynamic programming", "cat": "DSA", "lvl": 2, "why": "The topic that separates L2 from L3. Striver step 16 is the longest; product companies ask at least one DP.", "core": ["DP = recursion + remembering answers to overlapping subproblems. Recipe: (1) define the state in words, e.g. dp[i] = best answer for the first i items; (2) write the transition from smaller states; (3) base cases; (4) the order to fill; (5) where the answer is.", "Go memoised recursion → bottom-up table → space-optimised (keep only the last row). Interviewers love seeing all three.", "Families: 1D (climbing stairs, house robber), grid paths, 0/1 and unbounded knapsack, subsequences (LIS, LCS, edit distance), partitions (palindrome partitioning, matrix chain), stocks (state machine), DP on trees, bitmask DP."], "points": ["Complexity = number of states × work per transition", "If greedy fails on a counterexample, think DP", "Print the solution by walking back through choices"], "code": "// 0/1 knapsack, space-optimised\nvector<int> dp(W + 1, 0);\nfor (int i = 0; i < n; i++)\n    for (int w = W; w >= wt[i]; w--)\n        dp[w] = max(dp[w], dp[w - wt[i]] + val[i]);", "pit": ["Iterating capacity upwards in 0/1 knapsack (turns it unbounded)", "Wrong base case for empty prefix"], "ask": ["Explain your state and transition.", "Can you reduce the space?", "Edit distance.", "Longest increasing subsequence in O(n log n)."], "prac": [["House Robber", "https://leetcode.com/problems/house-robber/"], ["Coin Change", "https://leetcode.com/problems/coin-change/"], ["Longest Increasing Subsequence", "https://leetcode.com/problems/longest-increasing-subsequence/"], ["Edit Distance", "https://leetcode.com/problems/edit-distance/"], ["Partition Equal Subset Sum", "https://leetcode.com/problems/partition-equal-subset-sum/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"], ["AtCoder Educational DP contest", "https://atcoder.jp/contests/dp"]], "rel": ["knapsack", "lcs", "bitmask-dp", "tree-dp", "recursion"], "qa": []}, {"id": "knapsack", "title": "Knapsack and subset DP", "cat": "DSA", "lvl": 2, "why": "Subset-sum, partition and coin-change are all knapsack in disguise.", "core": ["0/1 knapsack: each item once; loop capacity downwards. Unbounded (coin change): items reusable; loop capacity upwards.", "Subset sum to target T: boolean dp[t]. Partition equal subset: subset sum to total/2. Count of subsets with difference d: subset sum to (total + d)/2."], "points": ["Coin change (min coins): dp[x] = min(dp[x − c] + 1)", "Coin change II (count ways): loop coins outside, amounts inside"], "code": "", "pit": ["Order of loops changes combinations vs permutations"], "ask": ["Target sum.", "Partition equal subset sum."], "prac": [["Coin Change Ii", "https://leetcode.com/problems/coin-change-ii/"], ["Target Sum", "https://leetcode.com/problems/target-sum/"], ["Partition Equal Subset Sum", "https://leetcode.com/problems/partition-equal-subset-sum/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["dp"], "qa": []}, {"id": "lcs", "title": "String DP: LCS and edit distance", "cat": "DSA", "lvl": 2, "why": "Two-string comparison problems are a fixed pattern; once learned, a whole family falls.", "core": ["dp[i][j] = answer for prefixes a[0..i) and b[0..j). If a[i−1] == b[j−1], extend the diagonal; otherwise take the best of dropping one character.", "Edit distance: min of insert dp[i][j−1], delete dp[i−1][j], replace dp[i−1][j−1], each +1. Shortest common supersequence and longest palindromic subsequence (LCS of s and reverse(s)) follow."], "points": ["Space-optimise to two rows", "Distinct subsequences counts ways"], "code": "", "pit": ["Off-by-one between string index and dp index"], "ask": ["Edit distance.", "Longest common subsequence and print it."], "prac": [["Longest Common Subsequence", "https://leetcode.com/problems/longest-common-subsequence/"], ["Edit Distance", "https://leetcode.com/problems/edit-distance/"], ["Distinct Subsequences", "https://leetcode.com/problems/distinct-subsequences/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["dp", "string-algos"], "qa": []}, {"id": "bitmask-dp", "title": "Bitmask DP", "cat": "DSA", "lvl": 3, "why": "L3/L4 topic for hard rounds, OAs at top firms and HFT. Shows up when n ≤ 20.", "core": ["The state includes a mask of which items are used: dp[mask] or dp[mask][last]. 2ⁿ masks × n transitions → O(2ⁿ·n) or O(2ⁿ·n²).", "Travelling salesman: dp[mask][i] = shortest path visiting mask and ending at i."], "points": ["Iterate submasks: for (s = m; s; s = (s − 1) & m)", "Memory: 2²⁰ × 20 ints ≈ 80 MB, watch limits"], "code": "", "pit": ["Using it when n is 40 (meet-in-the-middle instead)"], "ask": ["Shortest path visiting all nodes."], "prac": [["Shortest Path Visiting All Nodes", "https://leetcode.com/problems/shortest-path-visiting-all-nodes/"], ["Partition To K Equal Sum Subsets", "https://leetcode.com/problems/partition-to-k-equal-sum-subsets/"], ["CSES: Elevator Rides", "https://cses.fi/problemset/task/1653"]], "learn": [["cp-algorithms: submask enumeration", "https://cp-algorithms.com/algebra/all-submasks.html"], ["CSES problem set", "https://cses.fi/problemset/"]], "rel": ["dp", "bit-manipulation"], "qa": []}, {"id": "tree-dp", "title": "DP on trees", "cat": "DSA", "lvl": 3, "why": "Hard-round favourite: house robber III, max path sum, rerooting.", "core": ["Compute dp for each node from its children in a post-order DFS. Often each node returns a small tuple (take, skip).", "Rerooting: compute answers for one root, then move the root to each child in O(1) to get answers for all roots in O(n)."], "points": ["House Robber III returns {rob, notRob}", "Sum of distances in tree is the classic rerooting problem"], "code": "", "pit": ["Recomputing subtrees (O(n²))"], "ask": ["House robber on a tree."], "prac": [["House Robber Iii", "https://leetcode.com/problems/house-robber-iii/"], ["Sum Of Distances In Tree", "https://leetcode.com/problems/sum-of-distances-in-tree/"], ["CSES: Tree Distances I", "https://cses.fi/problemset/task/1132"]], "learn": [["USACO Guide: DP on trees", "https://usaco.guide/gold/dp-trees"], ["CSES problem set", "https://cses.fi/problemset/"]], "rel": ["trees", "dp"], "qa": []}, {"id": "trie", "title": "Tries", "cat": "DSA", "lvl": 2, "why": "Autocomplete, word search and max-XOR problems. Last step of Striver's sheet.", "core": ["A tree where each edge is a character; the path from the root spells a prefix. Insert and search are O(word length).", "A bit trie stores numbers bit by bit from the top; to maximise XOR with x, greedily go to the opposite bit at each level."], "points": ["Node: array of 26 children + end flag (+ count for prefix counts)", "Word Search II: trie + DFS on the grid"], "code": "struct Node { Node* ch[26] = {}; bool end = false; };\nvoid insert(Node* r, const string& w) {\n    for (char c : w) { if (!r->ch[c - 'a']) r->ch[c - 'a'] = new Node(); r = r->ch[c - 'a']; }\n    r->end = true;\n}", "pit": ["Memory: 26 pointers per node; use array pools for big inputs"], "ask": ["Implement a trie.", "Maximum XOR of two numbers."], "prac": [["Implement Trie Prefix Tree", "https://leetcode.com/problems/implement-trie-prefix-tree/"], ["Word Search Ii", "https://leetcode.com/problems/word-search-ii/"], ["Maximum Xor Of Two Numbers In An Array", "https://leetcode.com/problems/maximum-xor-of-two-numbers-in-an-array/"]], "learn": [["Striver A2Z sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"]], "rel": ["bit-manipulation", "string-algos"], "qa": []}, {"id": "segment-tree", "title": "Segment trees and Fenwick trees", "cat": "DSA", "lvl": 3, "why": "L3: range queries with updates. Needed for CP, CSES and harder OAs (Google, D. E. Shaw).", "core": ["A segment tree stores an aggregate (sum, min, max) for each segment; query and point update are O(log n). With lazy propagation it supports range updates too.", "A Fenwick tree (BIT) is shorter code for prefix sums with point updates, O(log n) each, using i & −i."], "points": ["Size the segment tree array 4n", "Count inversions with a BIT over compressed values"], "code": "// Fenwick, 1-indexed\nvector<long long> bit(n + 1);\nvoid add(int i, long long v) { for (; i <= n; i += i & -i) bit[i] += v; }\nlong long sum(int i) { long long s = 0; for (; i > 0; i -= i & -i) s += bit[i]; return s; }", "pit": ["Forgetting to push lazy values down before recursing"], "ask": ["Range sum query, mutable.", "Count of smaller numbers after self."], "prac": [["Range Sum Query Mutable", "https://leetcode.com/problems/range-sum-query-mutable/"], ["Count Of Smaller Numbers After Self", "https://leetcode.com/problems/count-of-smaller-numbers-after-self/"], ["CSES: Range Queries", "https://cses.fi/problemset/"]], "learn": [["cp-algorithms: segment tree", "https://cp-algorithms.com/data_structures/segment_tree.html"], ["cp-algorithms: Fenwick tree", "https://cp-algorithms.com/data_structures/fenwick.html"]], "rel": ["prefix-sum"], "qa": []}, {"id": "string-algos", "title": "String algorithms: KMP, Z, hashing", "cat": "DSA", "lvl": 3, "why": "Pattern matching in O(n + m). Appears in hard rounds and CP.", "core": ["KMP builds a prefix function: pi[i] = length of the longest proper prefix of s[0..i] that is also a suffix. Matching never moves backwards in the text.", "The Z-function z[i] = length of the longest substring starting at i that matches a prefix. Search pattern + '$' + text.", "Rolling hash (Rabin-Karp) compares substrings in O(1) after O(n) preprocessing; use two moduli to reduce collisions."], "points": ["Shortest palindrome: KMP on s + '#' + reverse(s)", "Repeated substring pattern via prefix function"], "code": "", "pit": ["Single-modulus hashing can be broken by anti-hash tests"], "ask": ["Find the first occurrence of a pattern in O(n + m)."], "prac": [["Find The Index Of The First Occurrence In A String", "https://leetcode.com/problems/find-the-index-of-the-first-occurrence-in-a-string/"], ["Shortest Palindrome", "https://leetcode.com/problems/shortest-palindrome/"], ["Repeated Substring Pattern", "https://leetcode.com/problems/repeated-substring-pattern/"]], "learn": [["cp-algorithms: prefix function", "https://cp-algorithms.com/string/prefix-function.html"], ["cp-algorithms: Z-function", "https://cp-algorithms.com/string/z-function.html"], ["cp-algorithms: string hashing", "https://cp-algorithms.com/string/string-hashing.html"]], "rel": ["trie", "lcs"], "qa": []}, {"id": "cp", "title": "Competitive programming and contests", "cat": "DSA", "lvl": 3, "why": "Ratings are a filter recruiters understand, contests train speed under pressure (exactly what OAs test), and HFT firms hire heavily from strong CP profiles.", "core": ["Do one LeetCode weekly contest and one Codeforces Div 2/3 round a week. After each, upsolve the first problem you couldn't solve.", "The CP31 sheet gives 31 problems per rating band (800 → 1900): climb in order. CSES gives 300 classic problems by topic.", "Targets from your plan: LC 1800+ or CF 1400+ by mid-2027 for Big Tech; CF 1600–1900+ for HFT."], "points": ["Read all problems first; solve in order of confidence", "Stress-test with a brute force on random inputs", "Keep a contest log: problem, idea, mistake"], "code": "", "pit": ["Grinding new contests without upsolving", "Chasing rating over interview skills before L2 is done"], "ask": ["(Interviews rarely ask about CP; your rating speaks on the resume)"], "prac": [["Codeforces", "https://codeforces.com"], ["LeetCode contests", "https://leetcode.com/contest/"], ["CSES problem set", "https://cses.fi/problemset/"], ["AtCoder", "https://atcoder.jp"]], "learn": [["USACO Guide", "https://usaco.guide"], ["cp-algorithms", "https://cp-algorithms.com"], ["clist.by contest calendar", "https://clist.by"]], "rel": ["oa-tactics", "complexity"], "qa": []}, {"id": "p-two-sum", "title": "Two Sum", "cat": "Problems", "lvl": 1, "why": "Pattern: Hashing. The most famous first-round question; asked everywhere as a warm-up.", "core": ["Brute force checks every pair: O(n²). Instead, walk once and remember each value's index in a hash map. For each x, the partner you need is target − x; if it's already in the map, you're done.", "Check the map before inserting x, so an element is never paired with itself."], "points": ["For i in 0..n−1: if target − a[i] is in the map, return [map[target − a[i]], i]", "Otherwise store a[i] → i", "Complexity: O(n) time, O(n) space"], "code": "class Solution {\npublic:\n    vector<int> twoSum(vector<int>& nums, int target) {\n        unordered_map<int, int> pos;                 // value -> index\n        for (int i = 0; i < (int)nums.size(); i++) {\n            auto it = pos.find(target - nums[i]);\n            if (it != pos.end()) return {it->second, i};\n            pos[nums[i]] = i;\n        }\n        return {};\n    }\n};", "pit": ["Inserting before checking (pairs x with itself)", "Returning values instead of indices"], "ask": ["What if the array is sorted? (two pointers, O(1) space)", "What if there can be many answers? Return all pairs without duplicates."], "prac": [["Solve it on LeetCode: Two Sum", "https://leetcode.com/problems/two-sum/"]], "learn": [], "rel": ["hashing"], "qa": []}, {"id": "p-stock", "title": "Best Time to Buy and Sell Stock", "cat": "Problems", "lvl": 1, "why": "Pattern: Greedy. Amazon and Microsoft favourite; leads into the stock DP family.", "core": ["The best sale on day i uses the cheapest price before day i. Track the running minimum and the best difference."], "points": ["minPrice = a[0]; best = 0", "For each price: best = max(best, price − minPrice); minPrice = min(minPrice, price)", "Complexity: O(n) time, O(1) space"], "code": "class Solution {\npublic:\n    int maxProfit(vector<int>& prices) {\n        int lo = INT_MAX, best = 0;\n        for (int p : prices) { best = max(best, p - lo); lo = min(lo, p); }\n        return best;\n    }\n};", "pit": ["p − INT_MAX overflow if the order of the two lines is swapped carelessly (here best is updated first with lo = INT_MAX, which gives a negative number, safe)"], "ask": ["Unlimited transactions? (sum every positive difference)", "At most k transactions or with cooldown? (state-machine DP)"], "prac": [["Solve it on LeetCode: Best Time to Buy and Sell Stock", "https://leetcode.com/problems/best-time-to-buy-and-sell-stock/"]], "learn": [], "rel": ["greedy"], "qa": []}, {"id": "p-product-except-self", "title": "Product of Array Except Self", "cat": "Problems", "lvl": 2, "why": "Pattern: Prefix sum. Asked at Amazon, Meta, Microsoft; tests prefix thinking without division.", "core": ["answer[i] = (product of everything left of i) × (product of everything right of i). Fill left products in one pass, then multiply by a running right product in a second pass."], "points": ["res[i] = product of a[0..i−1]", "Walk from the right with r = 1: res[i] *= r; r *= a[i]", "Complexity: O(n) time, O(1) extra space (the output doesn't count)"], "code": "class Solution {\npublic:\n    vector<int> productExceptSelf(vector<int>& nums) {\n        int n = nums.size();\n        vector<int> res(n, 1);\n        for (int i = 1; i < n; i++) res[i] = res[i - 1] * nums[i - 1];\n        int r = 1;\n        for (int i = n - 1; i >= 0; i--) { res[i] *= r; r *= nums[i]; }\n        return res;\n    }\n};", "pit": ["Using division (breaks with zeros, and it's forbidden)"], "ask": ["Why is the output array not counted as extra space?"], "prac": [["Solve it on LeetCode: Product of Array Except Self", "https://leetcode.com/problems/product-of-array-except-self/"]], "learn": [], "rel": ["prefix-sum"], "qa": []}, {"id": "p-kadane", "title": "Maximum Subarray (Kadane)", "cat": "Problems", "lvl": 2, "why": "Pattern: Kadane. Classic; tests whether you see the 1-D DP hidden in it.", "core": ["At each index, the best subarray ending here either extends the best one ending at i−1 or starts fresh at i: cur = max(a[i], cur + a[i]). The answer is the best cur seen."], "points": ["cur = best = a[0]", "For i ≥ 1: cur = max(a[i], cur + a[i]); best = max(best, cur)", "Complexity: O(n) time, O(1) space"], "code": "class Solution {\npublic:\n    int maxSubArray(vector<int>& nums) {\n        int cur = nums[0], best = nums[0];\n        for (int i = 1; i < (int)nums.size(); i++) { cur = max(nums[i], cur + nums[i]); best = max(best, cur); }\n        return best;\n    }\n};", "pit": ["Starting best at 0 (wrong when all numbers are negative)"], "ask": ["Return the start and end indices too.", "Maximum product subarray? (track both max and min)"], "prac": [["Solve it on LeetCode: Maximum Subarray (Kadane)", "https://leetcode.com/problems/maximum-subarray/"]], "learn": [], "rel": ["dp"], "qa": []}, {"id": "p-longest-consecutive", "title": "Longest Consecutive Sequence", "cat": "Problems", "lvl": 2, "why": "Pattern: Hashing. Google and Amazon; the O(n) requirement is the whole point.", "core": ["Put all numbers in a hash set. Only start counting from x when x − 1 is not in the set (x is the start of a run), then walk x+1, x+2… Each number is visited at most twice, so the total is O(n)."], "points": ["set s(all)", "For x in s: if x−1 not in s, count the run from x", "Complexity: O(n) average time, O(n) space"], "code": "class Solution {\npublic:\n    int longestConsecutive(vector<int>& nums) {\n        unordered_set<int> s(nums.begin(), nums.end());\n        int best = 0;\n        for (int x : s) {\n            if (s.count(x - 1)) continue;          // not the start of a run\n            int len = 1;\n            while (s.count(x + len)) len++;\n            best = max(best, len);\n        }\n        return best;\n    }\n};", "pit": ["Starting a walk from every number (O(n²) on a long run)", "Sorting (O(n log n), not what's asked)"], "ask": ["Why is it O(n) even with the inner while loop?"], "prac": [["Solve it on LeetCode: Longest Consecutive Sequence", "https://leetcode.com/problems/longest-consecutive-sequence/"]], "learn": [], "rel": ["hashing"], "qa": []}, {"id": "p-group-anagrams", "title": "Group Anagrams", "cat": "Problems", "lvl": 2, "why": "Pattern: Hashing. Common at Amazon, Uber and service-company OAs.", "core": ["Anagrams share a canonical key. Use the sorted word (O(k log k)) or a 26-letter count string (O(k)) as the hash-map key, and append each word to its group."], "points": ["key = sorted(word)", "groups[key].push_back(word)", "Complexity: O(n·k log k) time, O(n·k) space"], "code": "class Solution {\npublic:\n    vector<vector<string>> groupAnagrams(vector<string>& strs) {\n        unordered_map<string, vector<string>> g;\n        for (auto& s : strs) { string k = s; sort(k.begin(), k.end()); g[k].push_back(s); }\n        vector<vector<string>> res;\n        for (auto& [k, v] : g) res.push_back(v);\n        return res;\n    }\n};", "pit": ["Using a count array as the key without separators (\"1\",\"11\" collisions)"], "ask": ["Make the key O(k) instead of O(k log k)."], "prac": [["Solve it on LeetCode: Group Anagrams", "https://leetcode.com/problems/group-anagrams/"]], "learn": [], "rel": ["hashing"], "qa": []}, {"id": "p-top-k", "title": "Top K Frequent Elements", "cat": "Problems", "lvl": 2, "why": "Pattern: Heap. Amazon's most-asked heap problem.", "core": ["Count frequencies with a hash map, then keep a min-heap of size k keyed by frequency; anything smaller than the heap's top can't be in the answer. Bucket sort by frequency gives O(n)."], "points": ["Count", "Push (freq, value) into a min-heap; pop when size > k", "Heap contents are the answer", "Complexity: O(n log k) time, O(n) space"], "code": "class Solution {\npublic:\n    vector<int> topKFrequent(vector<int>& nums, int k) {\n        unordered_map<int, int> f;\n        for (int x : nums) f[x]++;\n        priority_queue<pair<int,int>, vector<pair<int,int>>, greater<>> pq;   // (freq, value), min on top\n        for (auto& [v, c] : f) { pq.push({c, v}); if ((int)pq.size() > k) pq.pop(); }\n        vector<int> res;\n        while (!pq.empty()) { res.push_back(pq.top().second); pq.pop(); }\n        return res;\n    }\n};", "pit": ["Using a max-heap of all n elements (O(n log n))"], "ask": ["Do it in O(n) with buckets.", "What if the data is a stream?"], "prac": [["Solve it on LeetCode: Top K Frequent Elements", "https://leetcode.com/problems/top-k-frequent-elements/"]], "learn": [], "rel": ["heap"], "qa": []}, {"id": "p-3sum", "title": "3Sum", "cat": "Problems", "lvl": 2, "why": "Pattern: Two pointers. Top-10 at Meta, Amazon, Microsoft; tests duplicate handling.", "core": ["Sort. Fix a[i] and find pairs in a[i+1..n−1] summing to −a[i] with two pointers. Skip equal values of a[i], and skip equal values after finding a triple, so no duplicate triples appear."], "points": ["Sort", "For each i (skip a[i] == a[i−1]): l = i+1, r = n−1", "Move l or r by the sum's sign; on a hit, record and skip duplicates on both sides", "Complexity: O(n²) time, O(1) extra space (besides sorting)"], "code": "class Solution {\npublic:\n    vector<vector<int>> threeSum(vector<int>& a) {\n        sort(a.begin(), a.end());\n        vector<vector<int>> res; int n = a.size();\n        for (int i = 0; i < n - 2; i++) {\n            if (i && a[i] == a[i - 1]) continue;\n            int l = i + 1, r = n - 1;\n            while (l < r) {\n                int s = a[i] + a[l] + a[r];\n                if (s < 0) l++;\n                else if (s > 0) r--;\n                else {\n                    res.push_back({a[i], a[l], a[r]});\n                    while (l < r && a[l] == a[l + 1]) l++;\n                    while (l < r && a[r] == a[r - 1]) r--;\n                    l++; r--;\n                }\n            }\n        }\n        return res;\
