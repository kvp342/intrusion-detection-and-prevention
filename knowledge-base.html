n    }\n};", "pit": ["Not skipping duplicates", "Using a set of triples to dedupe (slow, and interviewers notice)"], "ask": ["4Sum?", "3Sum closest?"], "prac": [["Solve it on LeetCode: 3Sum", "https://leetcode.com/problems/3sum/"]], "learn": [], "rel": ["two-pointers"], "qa": []}, {"id": "p-container", "title": "Container With Most Water", "cat": "Problems", "lvl": 2, "why": "Pattern: Two pointers. Asked at Google and Amazon; the proof is the interview.", "core": ["Start with the widest container. The height is limited by the shorter line, so moving the taller line inward can never help: the width shrinks and the height can't exceed the shorter line. Always move the shorter one."], "points": ["l = 0, r = n−1", "area = (r − l) × min(h[l], h[r])", "Move the shorter side inward", "Complexity: O(n) time, O(1) space"], "code": "class Solution {\npublic:\n    int maxArea(vector<int>& h) {\n        int l = 0, r = h.size() - 1, best = 0;\n        while (l < r) {\n            best = max(best, (r - l) * min(h[l], h[r]));\n            if (h[l] < h[r]) l++; else r--;\n        }\n        return best;\n    }\n};", "pit": ["Moving the taller side"], "ask": ["Prove that moving the shorter side never skips the best answer."], "prac": [["Solve it on LeetCode: Container With Most Water", "https://leetcode.com/problems/container-with-most-water/"]], "learn": [], "rel": ["two-pointers"], "qa": []}, {"id": "p-trapping-rain", "title": "Trapping Rain Water", "cat": "Problems", "lvl": 3, "why": "Pattern: Two pointers. The most famous Hard; Google, Amazon, Goldman Sachs.", "core": ["Water above bar i = min(maxLeft, maxRight) − h[i]. With two pointers, whichever side has the smaller running maximum is the bottleneck, so that side's water is already known: process it and move inward."], "points": ["l, r at ends; lmax = rmax = 0", "If h[l] < h[r]: lmax = max(lmax, h[l]); water += lmax − h[l]; l++", "Else the same on the right", "Complexity: O(n) time, O(1) space"], "code": "class Solution {\npublic:\n    int trap(vector<int>& h) {\n        int l = 0, r = (int)h.size() - 1, lmax = 0, rmax = 0, w = 0;\n        while (l < r) {\n            if (h[l] < h[r]) { lmax = max(lmax, h[l]); w += lmax - h[l]; l++; }\n            else { rmax = max(rmax, h[r]); w += rmax - h[r]; r--; }\n        }\n        return w;\n    }\n};", "pit": ["Off-by-one with prefix arrays", "Forgetting the empty-array case"], "ask": ["Solve it with prefix/suffix maximum arrays first, then optimise.", "Solve it with a monotonic stack.", "Trapping Rain Water II (2-D, heap + BFS)"], "prac": [["Solve it on LeetCode: Trapping Rain Water", "https://leetcode.com/problems/trapping-rain-water/"]], "learn": [], "rel": ["two-pointers"], "qa": []}, {"id": "p-longest-substring", "title": "Longest Substring Without Repeating Characters", "cat": "Problems", "lvl": 2, "why": "Pattern: Sliding window. Top-5 most asked overall.", "core": ["Keep a window with no repeats. Remember the last index of each character; when s[r] was seen inside the window, jump l to one past that index."], "points": ["last[c] = −1 for all c; l = 0", "For each r: if last[s[r]] ≥ l, l = last[s[r]] + 1", "last[s[r]] = r; best = max(best, r − l + 1)", "Complexity: O(n) time, O(alphabet) space"], "code": "class Solution {\npublic:\n    int lengthOfLongestSubstring(string s) {\n        vector<int> last(256, -1);\n        int best = 0;\n        for (int l = 0, r = 0; r < (int)s.size(); r++) {\n            unsigned char c = s[r];\n            if (last[c] >= l) l = last[c] + 1;\n            last[c] = r;\n            best = max(best, r - l + 1);\n        }\n        return best;\n    }\n};", "pit": ["Moving l backwards when the old index is outside the window (the ≥ l check prevents it)"], "ask": ["At most k distinct characters?", "Return the substring itself."], "prac": [["Solve it on LeetCode: Longest Substring Without Repeating Characters", "https://leetcode.com/problems/longest-substring-without-repeating-characters/"]], "learn": [], "rel": ["sliding-window"], "qa": []}, {"id": "p-min-window", "title": "Minimum Window Substring", "cat": "Problems", "lvl": 3, "why": "Pattern: Sliding window. Hard sliding-window favourite at Meta, LinkedIn, Uber.", "core": ["Count what t needs. Expand r; when the window covers all of t (need count reaches 0), shrink l as far as possible while still covering, recording the smallest window."], "points": ["need[c] from t; missing = |t|", "Expand r: if need[s[r]] > 0, missing−−; need[s[r]]−−", "While missing == 0: record; need[s[l]]++; if it becomes > 0, missing++; l++", "Complexity: O(|s| + |t|) time, O(alphabet) space"], "code": "class Solution {\npublic:\n    string minWindow(string s, string t) {\n        vector<int> need(128, 0);\n        for (char c : t) need[c]++;\n        int missing = t.size(), start = 0, len = INT_MAX;\n        for (int l = 0, r = 0; r < (int)s.size(); r++) {\n            if (need[s[r]]-- > 0) missing--;\n            while (missing == 0) {\n                if (r - l + 1 < len) { len = r - l + 1; start = l; }\n                if (++need[s[l++]] > 0) missing++;\n            }\n        }\n        return len == INT_MAX ? \"\" : s.substr(start, len);\n    }\n};", "pit": ["Forgetting duplicate letters in t", "Recording the window after shrinking past validity"], "ask": ["Why does each character enter and leave at most once?"], "prac": [["Solve it on LeetCode: Minimum Window Substring", "https://leetcode.com/problems/minimum-window-substring/"]], "learn": [], "rel": ["sliding-window"], "qa": []}, {"id": "p-subarray-sum-k", "title": "Subarray Sum Equals K", "cat": "Problems", "lvl": 2, "why": "Pattern: Prefix sum. Common at Meta, Google; the trap is trying a sliding window.", "core": ["Negative numbers break sliding windows. A subarray (j, i] sums to k exactly when prefix[i] − prefix[j] = k. Keep counts of every prefix seen; at each i add count[prefix − k]."], "points": ["count[0] = 1; s = 0", "For x: s += x; ans += count[s − k]; count[s]++", "Complexity: O(n) time, O(n) space"], "code": "class Solution {\npublic:\n    int subarraySum(vector<int>& nums, int k) {\n        unordered_map<long long, int> cnt{{0, 1}};\n        long long s = 0; int ans = 0;\n        for (int x : nums) { s += x; auto it = cnt.find(s - k); if (it != cnt.end()) ans += it->second; cnt[s]++; }\n        return ans;\n    }\n};", "pit": ["Missing cnt[0] = 1", "Using a sliding window"], "ask": ["Longest subarray with sum k?", "Count subarrays divisible by k?"], "prac": [["Solve it on LeetCode: Subarray Sum Equals K", "https://leetcode.com/problems/subarray-sum-equals-k/"]], "learn": [], "rel": ["prefix-sum"], "qa": []}, {"id": "p-search-rotated", "title": "Search in Rotated Sorted Array", "cat": "Problems", "lvl": 2, "why": "Pattern: Binary search. Microsoft, Amazon, LinkedIn staple.", "core": ["At any mid, one half [lo, mid] or [mid, hi] is sorted. Check whether the target lies in the sorted half's range; if so search there, otherwise search the other half."], "points": ["If a[lo] ≤ a[mid]: left half sorted; go left if a[lo] ≤ target < a[mid]", "Else right half sorted; go right if a[mid] < target ≤ a[hi]", "Complexity: O(log n) time, O(1) space"], "code": "class Solution {\npublic:\n    int search(vector<int>& a, int target) {\n        int lo = 0, hi = a.size() - 1;\n        while (lo <= hi) {\n            int mid = lo + (hi - lo) / 2;\n            if (a[mid] == target) return mid;\n            if (a[lo] <= a[mid]) {\n                if (a[lo] <= target && target < a[mid]) hi = mid - 1; else lo = mid + 1;\n            } else {\n                if (a[mid] < target && target <= a[hi]) lo = mid + 1; else hi = mid - 1;\n            }\n        }\n        return -1;\n    }\n};", "pit": ["Using < instead of ≤ in a[lo] ≤ a[mid] (fails on two elements)"], "ask": ["With duplicates? (worst case O(n): shrink lo/hi when a[lo] == a[mid] == a[hi])", "Find the rotation point / minimum."], "prac": [["Solve it on LeetCode: Search in Rotated Sorted Array", "https://leetcode.com/problems/search-in-rotated-sorted-array/"]], "learn": [], "rel": ["binary-search"], "qa": []}, {"id": "p-koko", "title": "Koko Eating Bananas", "cat": "Problems", "lvl": 2, "why": "Pattern: Binary search on the answer. The textbook binary-search-on-answer problem.", "core": ["If Koko can finish at speed k, she can at any faster speed: feasibility is monotone. Binary search k in [1, max pile]; check(k) sums ceil(pile / k) hours."], "points": ["lo = 1, hi = max(piles)", "check(k): Σ ⌈p/k⌉ ≤ h", "Find the smallest k where check is true", "Complexity: O(n log max) time, O(1) space"], "code": "class Solution {\npublic:\n    int minEatingSpeed(vector<int>& piles, int h) {\n        int lo = 1, hi = *max_element(piles.begin(), piles.end()), ans = hi;\n        while (lo <= hi) {\n            int k = lo + (hi - lo) / 2;\n            long long hours = 0;\n            for (int p : piles) hours += (p + k - 1) / k;\n            if (hours <= h) { ans = k; hi = k - 1; } else lo = k + 1;\n        }\n        return ans;\n    }\n};", "pit": ["int overflow in the hours sum", "Starting lo at 0 (division by zero)"], "ask": ["Capacity to ship packages in D days.", "Split array largest sum."], "prac": [["Solve it on LeetCode: Koko Eating Bananas", "https://leetcode.com/problems/koko-eating-bananas/"]], "learn": [], "rel": ["bs-answer"], "qa": []}, {"id": "p-valid-parens", "title": "Valid Parentheses", "cat": "Problems", "lvl": 1, "why": "Pattern: Stack. The standard stack opener in first rounds.", "core": ["Push opening brackets. On a closing bracket the stack top must be its matching opener; pop it. At the end the stack must be empty."], "points": ["Map ) → (, ] → [, } → {", "Mismatch or empty stack on a closer → false", "Complexity: O(n) time, O(n) space"], "code": "class Solution {\npublic:\n    bool isValid(string s) {\n        string st;\n        for (char c : s) {\n            if (c == '(' || c == '[' || c == '{') st.push_back(c);\n            else {\n                char want = c == ')' ? '(' : c == ']' ? '[' : '{';\n                if (st.empty() || st.back() != want) return false;\n                st.pop_back();\n            }\n        }\n        return st.empty();\n    }\n};", "pit": ["Forgetting the final empty check", "Popping an empty stack"], "ask": ["Minimum additions to make it valid?", "Longest valid parentheses (Hard)"], "prac": [["Solve it on LeetCode: Valid Parentheses", "https://leetcode.com/problems/valid-parentheses/"]], "learn": [], "rel": ["stack-queue"], "qa": []}, {"id": "p-daily-temps", "title": "Daily Temperatures", "cat": "Problems", "lvl": 2, "why": "Pattern: Monotonic stack. The cleanest next-greater-element problem.", "core": ["Keep a stack of indices with decreasing temperatures. When a warmer day arrives, every colder day on the stack has found its answer: pop and record the distance."], "points": ["For i: while stack top is colder than t[i], res[top] = i − top, pop", "Push i", "Complexity: O(n) time (each index pushed and popped once), O(n) space"], "code": "class Solution {\npublic:\n    vector<int> dailyTemperatures(vector<int>& t) {\n        vector<int> res(t.size(), 0), st;\n        for (int i = 0; i < (int)t.size(); i++) {\n            while (!st.empty() && t[st.back()] < t[i]) { res[st.back()] = i - st.back(); st.pop_back(); }\n            st.push_back(i);\n        }\n        return res;\n    }\n};", "pit": ["Storing temperatures instead of indices"], "ask": ["Next greater element in a circular array."], "prac": [["Solve it on LeetCode: Daily Temperatures", "https://leetcode.com/problems/daily-temperatures/"]], "learn": [], "rel": ["monotonic-stack"], "qa": []}, {"id": "p-histogram", "title": "Largest Rectangle in Histogram", "cat": "Problems", "lvl": 3, "why": "Pattern: Monotonic stack. Hard-round favourite at Google and Amazon; base for Maximal Rectangle.", "core": ["For each bar, the widest rectangle of its height spans between its previous smaller and next smaller bars. An increasing stack finds both: when a bar is popped, the current index is its next smaller and the new stack top is its previous smaller."], "points": ["Append a 0-height sentinel", "Pop while h[top] ≥ h[i]: width = i − (new top) − 1", "Area = h[popped] × width", "Complexity: O(n) time, O(n) space"], "code": "class Solution {\npublic:\n    int largestRectangleArea(vector<int>& h) {\n        h.push_back(0);\n        vector<int> st; int best = 0;\n        for (int i = 0; i < (int)h.size(); i++) {\n            while (!st.empty() && h[st.back()] >= h[i]) {\n                int height = h[st.back()]; st.pop_back();\n                int left = st.empty() ? -1 : st.back();\n                best = max(best, height * (i - left - 1));\n            }\n            st.push_back(i);\n        }\n        h.pop_back();\n        return best;\n    }\n};", "pit": ["Forgetting the sentinel, so bars left on the stack are never measured"], "ask": ["Maximal rectangle of 1s in a matrix (apply this per row)."], "prac": [["Solve it on LeetCode: Largest Rectangle in Histogram", "https://leetcode.com/problems/largest-rectangle-in-histogram/"]], "learn": [], "rel": ["monotonic-stack"], "qa": []}, {"id": "p-reverse-list", "title": "Reverse Linked List", "cat": "Problems", "lvl": 1, "why": "Pattern: Linked list. Asked in almost every first round; often followed by the recursive version.", "core": ["Walk the list re-pointing each node's next to the previous node. Save next before overwriting it."], "points": ["prev = null, cur = head", "nx = cur.next; cur.next = prev; prev = cur; cur = nx", "Return prev", "Complexity: O(n) time, O(1) space"], "code": "class Solution {\npublic:\n    ListNode* reverseList(ListNode* head) {\n        ListNode* prev = nullptr;\n        while (head) { ListNode* nx = head->next; head->next = prev; prev = head; head = nx; }\n        return prev;\n    }\n};", "pit": ["Losing the rest of the list"], "ask": ["Reverse recursively.", "Reverse nodes between positions m and n.", "Reverse in groups of k (Hard)."], "prac": [["Solve it on LeetCode: Reverse Linked List", "https://leetcode.com/problems/reverse-linked-list/"]], "learn": [], "rel": ["linked-list"], "qa": []}, {"id": "p-cycle-ii", "title": "Linked List Cycle II", "cat": "Problems", "lvl": 2, "why": "Pattern: Linked list. Floyd's algorithm; the proof is a common follow-up.", "core": ["Slow moves 1, fast moves 2; if they meet there's a cycle. Then move one pointer to head and step both by 1: they meet at the cycle start, because head-to-start distance equals meeting-point-to-start distance (mod cycle length)."], "points": ["Detect: slow/fast meet", "Reset one to head; step both by 1 until equal", "Complexity: O(n) time, O(1) space"], "code": "class Solution {\npublic:\n    ListNode* detectCycle(ListNode* head) {\n        ListNode *s = head, *f = head;\n        while (f && f->next) {\n            s = s->next; f = f->next->next;\n            if (s == f) { s = head; while (s != f) { s = s->next; f = f->next; } return s; }\n        }\n        return nullptr;\n    }\n};", "pit": ["Checking f->next->next without checking f->next"], "ask": ["Prove why the second phase meets at the start.", "Find the cycle length."], "prac": [["Solve it on LeetCode: Linked List Cycle II", "https://leetcode.com/problems/linked-list-cycle-ii/"]], "learn": [], "rel": ["linked-list"], "qa": []}, {"id": "p-merge-k", "title": "Merge K Sorted Lists", "cat": "Problems", "lvl": 3, "why": "Pattern: Heap. Amazon, Google, Meta Hard; tests heap use with pointers.", "core": ["Push each list's head into a min-heap keyed by value. Pop the smallest, append it, push its next. Every node goes through the heap once."], "points": ["Min-heap of (val, node)", "Pop, append, push node->next", "Complexity: O(N log k) time, O(k) space"], "code": "class Solution {\npublic:\n    ListNode* mergeKLists(vector<ListNode*>& lists) {\n        auto cmp = [](ListNode* a, ListNode* b) { return a->val > b->val; };\n        priority_queue<ListNode*, vector<ListNode*>, decltype(cmp)> pq(cmp);\n        for (auto l : lists) if (l) pq.push(l);\n        ListNode dummy(0); ListNode* t = &dummy;\n        while (!pq.empty()) { auto n = pq.top(); pq.pop(); t->next = n; t = n; if (n->next) pq.push(n->next); }\n        return dummy.next;\n    }\n};", "pit": ["Pushing null heads"], "ask": ["Divide and conquer: merge pairs (same complexity, no heap).", "What if lists are huge files on disk? (external merge)"], "prac": [["Solve it on LeetCode: Merge K Sorted Lists", "https://leetcode.com/problems/merge-k-sorted-lists/"]], "learn": [], "rel": ["heap"], "qa": []}, {"id": "p-lru", "title": "LRU Cache", "cat": "Problems", "lvl": 2, "why": "Pattern: Linked list. One of the most-asked design questions for freshers at Amazon, Microsoft, Swiggy.", "core": ["Need O(1) get and put with recency order. A hash map gives O(1) lookup of a node; a doubly linked list gives O(1) move-to-front and remove-from-back. std::list + splice does both."], "points": ["map key → list iterator", "get: splice the node to the front", "put: update or insert at front; if over capacity, erase the back and its map entry", "Complexity: O(1) per operation, O(capacity) space"], "code": "class LRUCache {\n    int cap;\n    list<pair<int,int>> dq;                                  // front = most recent\n    unordered_map<int, list<pair<int,int>>::iterator> pos;\npublic:\n    LRUCache(int capacity) : cap(capacity) {}\n    int get(int key) {\n        auto it = pos.find(key);\n        if (it == pos.end()) return -1;\n        dq.splice(dq.begin(), dq, it->second);\n        return it->second->second;\n    }\n    void put(int key, int value) {\n        auto it = pos.find(key);\n        if (it != pos.end()) { it->second->second = value; dq.splice(dq.begin(), dq, it->second); return; }\n        dq.emplace_front(key, value); pos[key] = dq.begin();\n        if ((int)dq.size() > cap) { pos.erase(dq.back().first); dq.pop_back(); }\n    }\n};", "pit": ["Forgetting to move on update", "Erasing from the map after popping (dangling)"], "ask": ["Make it thread-safe.", "LFU cache (Hard).", "How does Redis approximate LRU?"], "prac": [["Solve it on LeetCode: LRU Cache", "https://leetcode.com/problems/lru-cache/"]], "learn": [], "rel": ["linked-list"], "qa": []}, {"id": "p-level-order", "title": "Binary Tree Level Order Traversal", "cat": "Problems", "lvl": 2, "why": "Pattern: BFS. Base for zigzag, right view, and many tree BFS questions.", "core": ["BFS with a queue; process exactly the current queue size each round to keep levels separate."], "points": ["q = [root]", "While q: sz = q.size(); pop sz nodes into one level, pushing children", "Complexity: O(n) time, O(width) space"], "code": "class Solution {\npublic:\n    vector<vector<int>> levelOrder(TreeNode* root) {\n        vector<vector<int>> res; if (!root) return res;\n        queue<TreeNode*> q; q.push(root);\n        while (!q.empty()) {\n            int sz = q.size(); res.emplace_back();\n            while (sz--) { auto n = q.front(); q.pop(); res.back().push_back(n->val);\n                if (n->left) q.push(n->left); if (n->right) q.push(n->right); }\n        }\n        return res;\n    }\n};", "pit": ["Reading q.size() inside the loop condition (it changes)"], "ask": ["Zigzag order.", "Right side view.", "Average of each level."], "prac": [["Solve it on LeetCode: Binary Tree Level Order Traversal", "https://leetcode.com/problems/binary-tree-level-order-traversal/"]], "learn": [], "rel": ["bfs"], "qa": []}, {"id": "p-lca", "title": "Lowest Common Ancestor of a Binary Tree", "cat": "Problems", "lvl": 2, "why": "Pattern: Trees. Asked at Meta, Amazon, Microsoft; short code, tricky reasoning.", "core": ["Recurse: return the node if it's p or q. If the left and right subtrees each return non-null, this node is the LCA; otherwise pass up whichever side is non-null."], "points": ["Base: null, p or q → return it", "L = lca(left), R = lca(right)", "Both non-null → root; else the non-null one", "Complexity: O(n) time, O(h) space"], "code": "class Solution {\npublic:\n    TreeNode* lowestCommonAncestor(TreeNode* root, TreeNode* p, TreeNode* q) {\n        if (!root || root == p || root == q) return root;\n        TreeNode* L = lowestCommonAncestor(root->left, p, q);\n        TreeNode* R = lowestCommonAncestor(root->right, p, q);\n        return L && R ? root : (L ? L : R);\n    }\n};", "pit": ["Assuming it's a BST (that version walks by value)"], "ask": ["LCA in a BST.", "What if p or q may not exist in the tree?"], "prac": [["Solve it on LeetCode: Lowest Common Ancestor of a Binary Tree", "https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-tree/"]], "learn": [], "rel": ["trees"], "qa": []}, {"id": "p-validate-bst", "title": "Validate Binary Search Tree", "cat": "Problems", "lvl": 2, "why": "Pattern: BST. Tests whether you know the BST property is global, not parent-child.", "core": ["Every node must lie strictly between bounds inherited from its ancestors. Pass (lo, hi) down: left child gets (lo, val), right child gets (val, hi). Use long long or pointers for the bounds."], "points": ["valid(node, lo, hi): lo < val < hi", "Recurse left with hi = val, right with lo = val", "Complexity: O(n) time, O(h) space"], "code": "class Solution {\n    bool ok(TreeNode* n, long long lo, long long hi) {\n        if (!n) return true;\n        if (n->val <= lo || n->val >= hi) return false;\n        return ok(n->left, lo, n->val) && ok(n->right, n->val, hi);\n    }\npublic:\n    bool isValidBST(TreeNode* root) { return ok(root, LLONG_MIN, LLONG_MAX); }\n};", "pit": ["Only comparing a node with its children", "int bounds failing for INT_MIN/INT_MAX values"], "ask": ["Do it with an inorder traversal (must be strictly increasing).", "Recover a BST with two swapped nodes."], "prac": [["Solve it on LeetCode: Validate Binary Search Tree", "https://leetcode.com/problems/validate-binary-search-tree/"]], "learn": [], "rel": ["bst"], "qa": []}, {"id": "p-max-path-sum", "title": "Binary Tree Maximum Path Sum", "cat": "Problems", "lvl": 3, "why": "Pattern: Trees. Google and Meta Hard; the 'return one thing, record another' pattern.", "core": ["A path can bend at one node. For each node, the best path through it is val + best downward gain from left + from right (ignoring negative gains). But only one side can be returned to the parent."], "points": ["gain(n) = n.val + max(0, gain(left), gain(right))… returning only one side", "best = max(best, val + max(0,L) + max(0,R))", "Complexity: O(n) time, O(h) space"], "code": "class Solution {\n    int best = INT_MIN;\n    int gain(TreeNode* n) {\n        if (!n) return 0;\n        int L = max(0, gain(n->left)), R = max(0, gain(n->right));\n        best = max(best, n->val + L + R);\n        return n->val + max(L, R);\n    }\npublic:\n    int maxPathSum(TreeNode* root) { gain(root); return best; }\n};", "pit": ["Returning L + R to the parent (that's not a path)", "Initialising best to 0 (fails on all-negative trees)"], "ask": ["Diameter of a binary tree (same pattern with edge counts)."], "prac": [["Solve it on LeetCode: Binary Tree Maximum Path Sum", "https://leetcode.com/problems/binary-tree-maximum-path-sum/"]], "learn": [], "rel": ["trees"], "qa": []}, {"id": "p-islands", "title": "Number of Islands", "cat": "Problems", "lvl": 2, "why": "Pattern: DFS. Most-asked graph problem; grid as an implicit graph.", "core": ["Scan the grid; each unvisited '1' starts a new island. Flood-fill it (DFS or BFS) and mark visited so it isn't counted again."], "points": ["For each cell == '1': count++, flood fill", "Fill: mark '0', recurse into 4 neighbours inside bounds", "Complexity: O(rows × cols) time and space (recursion)"], "code": "class Solution {\n    void fill(vector<vector<char>>& g, int r, int c) {\n        if (r < 0 || c < 0 || r >= (int)g.size() || c >= (int)g[0].size() || g[r][c] != '1') return;\n        g[r][c] = '0';\n        fill(g, r + 1, c); fill(g, r - 1, c); fill(g, r, c + 1); fill(g, r, c - 1);\n    }\npublic:\n    int numIslands(vector<vector<char>>& g) {\n        int n = 0;\n        for (int r = 0; r < (int)g.size(); r++) for (int c = 0; c < (int)g[0].size(); c++) if (g[r][c] == '1') { n++; fill(g, r, c); }\n        return n;\n    }\n};", "pit": ["Deep recursion on big grids (use BFS or an explicit stack)", "Not mentioning that you modify the input"], "ask": ["Max area of an island.", "Number of distinct islands.", "Do it with DSU."], "prac": [["Solve it on LeetCode: Number of Islands", "https://leetcode.com/problems/number-of-islands/"]], "learn": [], "rel": ["dfs"], "qa": []}, {"id": "p-course-schedule", "title": "Course Schedule", "cat": "Problems", "lvl": 2, "why": "Pattern: Topological sort. Amazon and Google; cycle detection in a directed graph.", "core": ["Courses are nodes, prerequisites are edges. All courses can be finished exactly when the graph has no cycle. Kahn's algorithm: repeatedly take nodes with in-degree 0; if you process all n, there's no cycle."], "points": ["Build adjacency and in-degrees", "Queue all in-degree-0 nodes; pop, decrement neighbours", "Return processed == n", "Complexity: O(V + E) time and space"], "code": "class Solution {\npublic:\n    bool canFinish(int n, vector<vector<int>>& pre) {\n        vector<vector<int>> adj(n); vector<int> indeg(n, 0);\n        for (auto& e : pre) { adj[e[1]].push_back(e[0]); indeg[e[0]]++; }\n        queue<int> q; for (int i = 0; i < n; i++) if (!indeg[i]) q.push(i);\n        int done = 0;\n        while (!q.empty()) { int u = q.front(); q.pop(); done++; for (int v : adj[u]) if (--indeg[v] == 0) q.push(v); }\n        return done == n;\n    }\n};", "pit": ["Reversing the edge direction (harmless here, wrong in Course Schedule II's order)"], "ask": ["Return a valid order (Course Schedule II).", "Do it with DFS colouring."], "prac": [["Solve it on LeetCode: Course Schedule", "https://leetcode.com/problems/course-schedule/"]], "learn": [], "rel": ["topo-sort"], "qa": []}, {"id": "p-rotting-oranges", "title": "Rotting Oranges", "cat": "Problems", "lvl": 2, "why": "Pattern: BFS. Multi-source BFS; Amazon's favourite grid BFS.", "core": ["All rotten oranges start the BFS together. Each BFS level is one minute. At the end, if any fresh orange remains, return −1."], "points": ["Queue all rotten cells; count fresh", "BFS level by level, rotting neighbours and decrementing fresh", "Answer = levels used, or −1", "Complexity: O(rows × cols) time and space"], "code": "class Solution {\npublic:\n    int orangesRotting(vector<vector<int>>& g) {\n        int R = g.size(), C = g[0].size(), fresh = 0, mins = 0;\n        queue<pair<int,int>> q;\n        for (int r = 0; r < R; r++) for (int c = 0; c < C; c++) { if (g[r][c] == 2) q.push({r, c}); else if (g[r][c] == 1) fresh++; }\n        int dr[] = {1,-1,0,0}, dc[] = {0,0,1,-1};\n        while (!q.empty() && fresh) {\n            for (int sz = q.size(); sz--; ) {\n                auto [r, c] = q.front(); q.pop();\n                for (int k = 0; k < 4; k++) { int nr = r + dr[k], nc = c + dc[k];\n                    if (nr >= 0 && nc >= 0 && nr < R && nc < C && g[nr][nc] == 1) { g[nr][nc] = 2; fresh--; q.push({nr, nc}); } }\n            }\n            mins++;\n        }\n        return fresh ? -1 : mins;\n    }\n};", "pit": ["Counting a minute after the last level (stop when fresh is 0)"], "ask": ["01 Matrix (distance to nearest 0).", "Walls and gates."], "prac": [["Solve it on LeetCode: Rotting Oranges", "https://leetcode.com/problems/rotting-oranges/"]], "learn": [], "rel": ["bfs"], "qa": []}, {"id": "p-network-delay", "title": "Network Delay Time", "cat": "Problems", "lvl": 2, "why": "Pattern: Dijkstra. The standard Dijkstra question.", "core": ["Shortest time for the signal to reach every node = the largest shortest-path distance from k. Run Dijkstra with a min-heap; if any node is unreachable, return −1."], "points": ["dist[k] = 0; heap (d, node)", "Pop; skip stale; relax edges", "Answer = max(dist) or −1", "Complexity: O((V + E) log V) time"], "code": "class Solution {\npublic:\n    int networkDelayTime(vector<vector<int>>& times, int n, int k) {\n        vector<vector<pair<int,int>>> adj(n + 1);\n        for (auto& t : times) adj[t[0]].push_back({t[1], t[2]});\n        vector<int> d(n + 1, INT_MAX); d[k] = 0;\n        priority_queue<pair<int,int>, vector<pair<int,int>>, greater<>> pq; pq.push({0, k});\n        while (!pq.empty()) {\n            auto [du, u] = pq.top(); pq.pop();\n            if (du > d[u]) continue;\n            for (auto [v, w] : adj[u]) if (du + w < d[v]) { d[v] = du + w; pq.push({d[v], v}); }\n        }\n        int ans = *max_element(d.begin() + 1, d.end());\n        return ans == INT_MAX ? -1 : ans;\n    }\n};", "pit": ["Not skipping stale heap entries (still correct, slower)", "1-indexed nodes"], "ask": ["Cheapest flights within K stops (Bellman-Ford / BFS by stops).", "Path with minimum effort."], "prac": [["Solve it on LeetCode: Network Delay Time", "https://leetcode.com/problems/network-delay-time/"]], "learn": [], "rel": ["dijkstra"], "qa": []}, {"id": "p-provinces", "title": "Number of Provinces", "cat": "Problems", "lvl": 2, "why": "Pattern: DSU. Connected components; a clean place to show Union-Find.", "core": ["Each city starts alone. For every connected pair, union their sets; each successful union reduces the count of components by one."], "points": ["parent[i] = i; comps = n", "For i < j with isConnected[i][j]: if unite(i, j), comps−−", "Complexity: O(n² α(n)) time, O(n) space"], "code": "class Solution {\n    vector<int> p;\n    int find(int x) { return p[x] == x ? x : p[x] = find(p[x]); }\npublic:\n    int findCircleNum(vector<vector<int>>& g) {\n        int n = g.size(), comps = n; p.resize(n); iota(p.begin(), p.end(), 0);\n        for (int i = 0; i < n; i++) for (int j = i + 1; j < n; j++)\n            if (g[i][j]) { int a = find(i), b = find(j); if (a != b) { p[a] = b; comps--; } }\n        return comps;\n    }\n};", "pit": ["Comparing raw parents instead of roots"], "ask": ["Solve it with DFS too.", "Redundant connection.", "Accounts merge."], "prac": [["Solve it on LeetCode: Number of Provinces", "https://leetcode.com/problems/number-of-provinces/"]], "learn": [], "rel": ["dsu"], "qa": []}, {"id": "p-house-robber", "title": "House Robber", "cat": "Problems", "lvl": 2, "why": "Pattern: DP. The first DP most interviewers ask.", "core": ["At house i you either rob it (take a[i] + best up to i−2) or skip it (best up to i−1). Only the last two values are needed."], "points": ["dp[i] = max(dp[i−1], dp[i−2] + a[i])", "Keep two variables", "Complexity: O(n) time, O(1) space"], "code": "class Solution {\npublic:\n    int rob(vector<int>& a) {\n        int prev2 = 0, prev1 = 0;\n        for (int x : a) { int cur = max(prev1, prev2 + x); prev2 = prev1; prev1 = cur; }\n        return prev1;\n    }\n};", "pit": ["Greedy 'take every other house'"], "ask": ["Houses in a circle (House Robber II).", "Houses on a tree (House Robber III)."], "prac": [["Solve it on LeetCode: House Robber", "https://leetcode.com/problems/house-robber/"]], "learn": [], "rel": ["dp"], "qa": []}, {"id": "p-coin-change", "title": "Coin Change", "cat": "Problems", "lvl": 2, "why": "Pattern: Knapsack. Most-asked unbounded-knapsack problem; greedy fails on it.", "core": ["dp[x] = fewest coins to make x. dp[x] = min over coins c ≤ x of dp[x − c] + 1. Greedy fails (coins 1, 3, 4 for 6: greedy gives 3, best is 2)."], "points": ["dp[0] = 0, others = ∞", "For x in 1..amount, for c: dp[x] = min(dp[x], dp[x−c] + 1)", "Answer dp[amount] or −1", "Complexity: O(amount × coins) time, O(amount) space"], "code": "class Solution {\npublic:\n    int coinChange(vector<int>& coins, int amount) {\n        vector<int> dp(amount + 1, INT_MAX); dp[0] = 0;\n        for (int x = 1; x <= amount; x++)\n            for (int c : coins) if (c <= x && dp[x - c] != INT_MAX) dp[x] = min(dp[x], dp[x - c] + 1);\n        return dp[amount] == INT_MAX ? -1 : dp[amount];\n    }\n};", "pit": ["INT_MAX + 1 overflow", "Using greedy"], "ask": ["Count the number of ways (Coin Change II: coins in the outer loop).", "Print the coins used."], "prac": [["Solve it on LeetCode: Coin Change", "https://leetcode.com/problems/coin-change/"]], "learn": [], "rel": ["knapsack"], "qa": []}, {"id": "p-lis", "title": "Longest Increasing Subsequence", "cat": "Problems", "lvl": 2, "why": "Pattern: DP. Asked for both the O(n²) DP and the O(n log n) follow-up.", "core": ["O(n²): dp[i] = 1 + max dp[j] for j < i with a[j] < a[i]. O(n log n): keep tails[len] = smallest possible tail of an increasing subsequence of length len+1; for each x, replace the first tail ≥ x (lower_bound) or append."], "points": ["tails = []", "For x: it = lower_bound(tails, x); replace or push_back", "Answer = tails.size()", "Complexity: O(n log n) time, O(n) space"], "code": "class Solution {\npublic:\n    int lengthOfLIS(vector<int>& a) {\n        vector<int> tails;\n        for (int x : a) {\n            auto it = lower_bound(tails.begin(), tails.end(), x);\n            if (it == tails.end()) tails.push_back(x); else *it = x;\n        }\n        return tails.size();\n    }\n};", "pit": ["Thinking tails is the subsequence itself (it isn't)", "upper_bound for strictly increasing (use lower_bound)"], "ask": ["Print the actual subsequence.", "Russian doll envelopes (Hard)."], "prac": [["Solve it on LeetCode: Longest Increasing Subsequence", "https://leetcode.com/problems/longest-increasing-subsequence/"]], "learn": [], "rel": ["dp"], "qa": []}, {"id": "p-lcs", "title": "Longest Common Subsequence", "cat": "Problems", "lvl": 2, "why": "Pattern: String DP. The base of all two-string DP.", "core": ["dp[i][j] = LCS of a[0..i) and b[0..j). If a[i−1] == b[j−1], dp[i][j] = dp[i−1][j−1] + 1; else max(dp[i−1][j], dp[i][j−1])."], "points": ["(n+1) × (m+1) table, row/column 0 are 0", "Fill row by row", "Space-optimise to two rows", "Complexity: O(n × m) time, O(m) space"], "code": "class Solution {\npublic:\n    int longestCommonSubsequence(string a, string b) {\n        int n = a.size(), m = b.size();\n        vector<int> prev(m + 1, 0), cur(m + 1, 0);\n        for (int i = 1; i <= n; i++) {\n            for (int j = 1; j <= m; j++)\n                cur[j] = a[i - 1] == b[j - 1] ? prev[j - 1] + 1 : max(prev[j], cur[j - 1]);\n            swap(prev, cur);\n        }\n        return prev[m];\n    }\n};", "pit": ["Mixing string index i−1 with dp index i"], "ask": ["Print the LCS.", "Shortest common supersequence.", "Longest palindromic subsequence."], "prac": [["Solve it on LeetCode: Longest Common Subsequence", "https://leetcode.com/problems/longest-common-subsequence/"]], "learn": [], "rel": ["lcs"], "qa": []}, {"id": "p-edit-distance", "title": "Edit Distance", "cat": "Problems", "lvl": 2, "why": "Pattern: String DP. Google, Amazon, Microsoft; real-world use in spell checkers and diff.", "core": ["dp[i][j] = edits to turn a[0..i) into b[0..j). Equal last characters cost nothing (diagonal). Otherwise 1 + min(insert dp[i][j−1], delete dp[i−1][j], replace dp[i−1][j−1]). Base: dp[i][0] = i, dp[0][j] = j."], "points": ["Fill base row and column", "Apply the transition", "Answer dp[n][m]", "Complexity: O(n × m) time and space (O(m) with two rows)"], "code": "class Solution {\npublic:\n    int minDistance(string a, string b) {\n        int n = a.size(), m = b.size();\n        vector<vector<int>> dp(n + 1, vector<int>(m + 1));\n        for (int i = 0; i <= n; i++) dp[i][0] = i;\n        for (int j = 0; j <= m; j++) dp[0][j] = j;\n        for (int i = 1; i <= n; i++) for (int j = 1; j <= m; j++)\n            dp[i][j] = a[i - 1] == b[j - 1] ? dp[i - 1][j - 1] : 1 + min({dp[i][j - 1], dp[i - 1][j], dp[i - 1][j - 1]});\n        return dp[n][m];\n    }\n};", "pit": ["Wrong base cases"], "ask": ["Reduce to O(min(n, m)) space.", "One edit distance (O(n))."], "prac": [["Solve it on LeetCode: Edit Distance", "https://leetcode.com/problems/edit-distance/"]], "learn": [], "rel": ["lcs"], "qa": []}, {"id": "p-partition-subset", "title": "Partition Equal Subset Sum", "cat": "Problems", "lvl": 2, "why": "Pattern: Knapsack. 0/1 knapsack in disguise; Amazon and Meta.", "core": ["Equal halves exist iff some subset sums to total/2 (total must be even). Boolean 0/1 knapsack over sums, iterating sums downwards so each number is used once."], "points": ["If total is odd → false", "dp[0] = true; for x: for s = T..x: dp[s] |= dp[s − x]", "Complexity: O(n × total) time, O(total) space"], "code": "class Solution {\npublic:\n    bool canPartition(vector<int>& a) {\n        int total = accumulate(a.begin(), a.end(), 0);\n        if (total % 2) return false;\n        int T = total / 2; vector<char> dp(T + 1, 0); dp[0] = 1;\n        for (int x : a) for (int s = T; s >= x; s--) dp[s] |= dp[s - x];\n        return dp[T];\n    }\n};", "pit": ["Iterating sums upwards (reuses a number)"], "ask": ["Use a bitset for speed.", "Target sum (count sign assignments)."], "prac": [["Solve it on LeetCode: Partition Equal Subset Sum", "https://leetcode.com/problems/partition-equal-subset-sum/"]], "learn": [], "rel": ["knapsack"], "qa": []}, {"id": "p-subsets", "title": "Subsets", "cat": "Problems", "lvl": 2, "why": "Pattern: Backtracking. The entry point to backtracking; often followed by Subsets II.", "core": ["Each element is either in or out: a binary decision tree with 2ⁿ leaves. Recurse with pick / skip, or iterate: for each element, copy every existing subset and add it."], "points": ["go(i): if i == n, record", "Pick a[i], go(i+1), unpick; go(i+1)", "Complexity: O(n × 2ⁿ) time, O(n) recursion depth"], "code": "class Solution {\n    vector<vector<int>> res; vector<int> cur;\n    void go(vector<int>& a, int i) {\n        if (i == (int)a.size()) { res.push_back(cur); return; }\n        cur.push_back(a[i]); go(a, i + 1); cur.pop_back();\n        go(a, i + 1);\n    }\npublic:\n    vector<vector<int>> subsets(vector<int>& a) { go(a, 0); return res; }\n};", "pit": ["Forgetting to pop after the pick branch"], "ask": ["Subsets II with duplicates (sort, skip equal siblings).", "Do it with bitmasks."], "prac": [["Solve it on LeetCode: Subsets", "https://leetcode.com/problems/subsets/"]], "learn": [], "rel": ["recursion"], "qa": []}, {"id": "p-merge-intervals", "title": "Merge Intervals", "cat": "Problems", "lvl": 2, "why": "Pattern: Intervals. Top-asked at Google, Meta, Bloomberg.", "core": ["Sort by start. Walk once: if the current interval starts before the last merged one ends, extend the end; otherwise start a new merged interval."], "points": ["Sort by start", "If start ≤ last.end: last.end = max(last.end, end); else push", "Complexity: O(n log n) time, O(n) output"], "code": "class Solution {\npublic:\n    vector<vector<int>> merge(vector<vector<int>>& iv) {\n        sort(iv.begin(), iv.end());\n        vector<vector<int>> res;\n        for (auto& x : iv) {\n            if (!res.empty() && x[0] <= res.back()[1]) res.back()[1] = max(res.back()[1], x[1]);\n            else res.push_back(x);\n        }\n        return res;\n    }\n};", "pit": ["Setting end = x.end instead of max (a long interval swallowing a short one)"], "ask": ["Insert interval.", "Meeting rooms II (minimum rooms)."], "prac": [["Solve it on LeetCode: Merge Intervals", "https://leetcode.com/problems/merge-intervals/"]], "learn": [], "rel": ["intervals"], "qa": []}, {"id": "p-kth-largest", "title": "Kth Largest Element in an Array", "cat": "Problems", "lvl": 2, "why": "Pattern: Heap. Asked with the follow-up 'can you beat O(n log n)?'.", "core": ["Keep a min-heap of size k: its top is the k-th largest. Quickselect averages O(n)."], "points": ["Push each x; pop when size > k", "Return top", "Complexity: O(n log k) time, O(k) space"], "code": "class Solution {\npublic:\n    int findKthLargest(vector<int>& a, int k) {\n        priority_queue<int, vector<int>, greater<int>> pq;\n        for (int x : a) { pq.push(x); if ((int)pq.size() > k) pq.pop(); }\n        return pq.top();\n    }\n};", "pit": ["Max-heap of everything (O(n log n))"], "ask": ["Quickselect (average O(n), worst O(n²)).", "nth_element in C++."], "prac": [["Solve it on LeetCode: Kth Largest Element in an Array", "https://leetcode.com/problems/kth-largest-element-in-an-array/"]], "learn": [], "rel": ["heap"], "qa": []}, {"id": "p-trie", "title": "Implement Trie (Prefix Tree)", "cat": "Problems", "lvl": 2, "why": "Pattern: Trie. Common design-style question; base for autocomplete and Word Search II.", "core": ["Each node has 26 children and an end-of-word flag. Insert walks/creates nodes; search walks and checks the flag; startsWith only walks."], "points": ["insert: create missing children, mark end", "search: walk, return end flag", "startsWith: walk, return true", "Complexity: O(length) per operation, O(total characters × 26) space"], "code": "class Trie {\n    struct Node { Node* ch[26] = {}; bool end = false; };\n    Node* root = new Node();\n    Node* walk(const string& w) { Node* n = root; for (char c : w) { n = n->ch[c - 'a']; if (!n) return nullptr; } return n; }\npublic:\n    void insert(string w) { Node* n = root; for (char c : w) { if (!n->ch[c - 'a']) n->ch[c - 'a'] = new Node(); n = n->ch[c - 'a']; } n->end = true; }\n    bool search(string w) { Node* n = walk(w); return n && n->end; }\n    bool startsWith(string p) { return walk(p) != nullptr; }\n};", "pit": ["Leaking memory (mention a destructor or arena)"], "ask": ["Word Search II.", "Autocomplete top-3 suggestions.", "Max XOR with a bit trie."], "prac": [["Solve it on LeetCode: Implement Trie (Prefix Tree)", "https://leetcode.com/problems/implement-trie-prefix-tree/"]], "learn": [], "rel": ["trie"], "qa": []}, {"id": "p-jump-game", "title": "Jump Game", "cat": "Problems", "lvl": 2, "why": "Pattern: Greedy. A short greedy problem that tests whether you'd reach for DP unnecessarily.", "core": ["Track the furthest index reachable so far. If you ever stand on an index beyond it, you're stuck."], "points": ["reach = 0", "For i: if i > reach → false; reach = max(reach, i + a[i])", "Complexity: O(n) time, O(1) space"], "code": "class Solution {\npublic:\n    bool canJump(vector<int>& a) {\n        int reach = 0;\n        for (int i = 0; i < (int)a.size(); i++) { if (i > reach) return false; reach = max(reach, i + a[i]); }\n        return true;\n    }\n};", "pit": ["O(n²) DP when greedy suffices"], "ask": ["Minimum number of jumps (Jump Game II, greedy BFS by levels)."], "prac": [["Solve it on LeetCode: Jump Game", "https://leetcode.com/problems/jump-game/"]], "learn": [], "rel": ["greedy"], "qa": []}, {"id": "p-median-stream", "title": "Find Median from Data Stream", "cat": "Problems", "lvl": 3, "why": "Pattern: Heap. Classic two-heap design; Google, Amazon, Microsoft.", "core": ["Keep the smaller half in a max-heap and the larger half in a min-heap, sizes equal or the max-heap one bigger. The median is the max-heap top, or the average of both tops."], "points": ["Push to lo (max-heap), move lo's top to hi", "If hi is bigger, move hi's top back to lo", "Median from the tops", "Complexity: O(log n) per add, O(1) median"], "code": "class MedianFinder {\n    priority_queue<int> lo;                                   // max-heap: smaller half\n    priority_queue<int, vector<int>, greater<int>> hi;        // min-heap: larger half\npublic:\n    void addNum(int x) {\n        lo.push(x); hi.push(lo.top()); lo.pop();\n        if (hi.size() > lo.size()) { lo.push(hi.top()); hi.pop(); }\n    }\n    double findMedian() { return lo.size() > hi.size() ? lo.top() : (lo.top() + (double)hi.top()) / 2.0; }\n};", "pit": ["Integer division when averaging", "int overflow when adding two big tops (cast first)"], "ask": ["If all numbers are in 0..100? (counting array)", "Sliding window median."], "prac": [["Solve it on LeetCode: Find Median from Data Stream", "https://leetcode.com/problems/find-median-from-data-stream/"]], "learn": [], "rel": ["heap"], "qa": []}, {"id": "process-thread", "title": "Processes and threads", "cat": "Core CS", "lvl": 1, "why": "The most-asked OS question in every technical round, product or service company.", "core": ["A process is a running program with its own address space (code, data, heap, stack), file descriptors and a PCB (process control block) in the kernel.", "A thread is a unit of execution inside a process. Threads share the process's code, data, heap and files, but each has its own stack, registers and program counter.", "Threads are cheaper because creating one and switching between threads of the same process don't need a new address space or a TLB flush. The cost of sharing is that one thread's bug (or a missing lock) can corrupt the whole process."], "points": ["Process states: new, ready, running, waiting, terminated", "fork() copies the process (copy-on-write); exec() replaces its image", "User-level vs kernel-level threads", "Zombie: finished but parent hasn't called wait(); orphan: parent died first"], "code": "", "pit": ["Saying threads share the stack (they don't)"], "ask": ["Process vs thread, and why threads are cheaper?", "What happens on a context switch?", "What is a zombie process?"], "prac": [], "learn": [["OSTEP (free OS book)", "https://pages.cs.wisc.edu/~remzi/OSTEP/"], ["GfG: process vs thread", "https://www.geeksforgeeks.org/operating-systems/difference-between-process-and-thread/"], ["Gate Smashers (YouTube)", "https://www.youtube.com/@GateSmashers"]], "rel": ["scheduling", "sync", "virtual-memory"], "qa": []}, {"id": "scheduling", "title": "CPU scheduling", "cat": "Core CS", "lvl": 1, "why": "Numerical questions in OAs (compute waiting time) and conceptual ones in interviews.", "core": ["The scheduler picks which ready process runs next. Goals: high CPU use and throughput, low waiting, turnaround and response time, fairness.", "FCFS (convoy effect), SJF/SRTF (optimal average waiting, needs burst estimates, can starve long jobs), priority (starvation fixed by ageing), round robin (time quantum; good response time), multilevel feedback queues (what real systems approximate). Linux uses CFS, which tracks virtual runtime in a red-black tree."], "points": ["Turnaround = completion − arrival; waiting = turnaround − burst", "Preemptive vs non-preemptive", "Quantum too small → too many context switches; too big → FCFS"], "code": "", "pit": ["Mixing up turnaround and response time"], "ask": ["Compare round robin and SJF.", "What is starvation and how does ageing fix it?"], "prac": [], "learn": [["OSTEP (free OS book)", "https://pages.cs.wisc.edu/~remzi/OSTEP/"], ["Gate Smashers (YouTube)", "https://www.youtube.com/@GateSmashers"]], "rel": ["process-thread"], "qa": []}, {"id": "deadlock", "title": "Deadlock", "cat": "Core CS", "lvl": 1, "why": "Top-5 OS question. Also asked in DBMS (transaction deadlocks).", "core": ["A set of processes each waiting for a resource held by another in the set, so none can proceed.", "Coffman conditions, all four needed: mutual exclusion, hold and wait, no preemption, circular wait.", "Handling: prevention (break one condition, e.g. always lock resources in a fixed global order to stop circular wait), avoidance (Banker's algorithm keeps the system in a safe state), detection + recovery (wait-for graph, kill or roll back), or ignore it (most OSes)."], "points": ["Fixed lock ordering is the practical fix in code", "Livelock: processes keep changing state but make no progress", "Starvation ≠ deadlock"], "code": "", "pit": ["Listing only three conditions"], "ask": ["Four conditions of deadlock?", "How would you prevent deadlock in your code?", "Explain Banker's algorithm."], "prac": [], "learn": [["OSTEP (free OS book)", "https://pages.cs.wisc.edu/~remzi/OSTEP/"], ["GfG: deadlock", "https://www.geeksforgeeks.org/operating-systems/introduction-of-deadlock-in-operating-system/"], ["Gate Smashers (YouTube)", "https://www.youtube.com/@GateSmashers"]], "rel": ["sync", "acid"], "qa": []}, {"id": "sync", "title": "Synchronisation: mutex, semaphore, race conditions", "cat": "Core CS", "lvl": 2, "why": "Asked in OS rounds and C++/HFT interviews; producer-consumer is a classic whiteboard question.", "core": ["A race condition happens when the result depends on the timing of threads touching shared data. The code that touches it is the critical section; it needs mutual exclusion, progress and bounded waiting.", "A mutex is a lock with an owner: only the thread that locked it unlocks it. A semaphore is a counter: wait() decrements and blocks at 0, signal() increments. A binary semaphore looks like a mutex but has no owner; a counting semaphore guards N identical resources.", "Producer-consumer with a bounded buffer: semaphores empty = N and full = 0, plus a mutex for the buffer. Condition variables let a thread sleep until a predicate becomes true (always wait in a loop)."], "points": ["Spinlock: busy-waits, good for very short sections", "Atomics avoid locks for single variables", "Readers-writers and dining philosophers are the other classics"], "code": "std::mutex m; std::condition_variable cv; std::queue<int> q;\nvoid produce(int x) { { std::lock_guard<std::mutex> g(m); q.push(x); } cv.notify_one(); }\nint consume() { std::unique_lock<std::mutex> g(m); cv.wait(g, [] { return !q.empty(); });\n    int x = q.front(); q.pop(); return x; }", "pit": ["Using if instead of while around a condition wait (spurious wake-ups)"], "ask": ["Mutex vs semaphore with an example.", "Write producer-consumer.", "What is a race condition?"], "prac": [], "learn": [["OSTEP (free OS book)", "https://pages.cs.wisc.edu/~remzi/OSTEP/"], ["cppreference: thread support", "https://en.cppreference.com/w/cpp/thread"]], "rel": ["deadlock", "process-thread"], "qa": []}, {"id": "virtual-memory", "title": "Memory management and virtual memory", "cat": "Core CS", "lvl": 2, "why": "Second most-asked OS area after processes. Also needed for binary exploitation (stack, heap, ASLR).", "core": ["Each process sees its own virtual address space. The MMU translates virtual pages to physical frames using page tables; the TLB caches recent translations.", "Why: isolation (one process can't read another's memory), programs bigger than RAM, simpler loading, and sharing (shared libraries, copy-on-write after fork).", "A page fault happens when a page isn't in RAM: the OS loads it from disk and may evict another (FIFO, LRU, optimal; Belady's anomaly hits FIFO). Thrashing is when the system spends more time paging than running because working sets don't fit."], "points": ["Internal fragmentation (paging) vs external (segmentation)", "Multi-level page tables save memory", "Effective access time with TLB hit ratio"], "code": "", "pit": ["Confusing virtual memory with swap space only"], "ask": ["Why do we need virtual memory?", "What happens on a page fault?", "What is thrashing?", "LRU page replacement: implement it (→ LRU cache)."], "prac": [], "learn": [["OSTEP (free OS book)", "https://pages.cs.wisc.edu/~remzi/OSTEP/"], ["Gate Smashers (YouTube)", "https://www.youtube.com/@GateSmashers"]], "rel": ["process-thread", "binary-exploitation"], "qa": []}, {"id": "normalisation", "title": "Normalisation and keys", "cat": "Core CS", "lvl": 1, "why": "The standard DBMS opener in interviews and a frequent OA MCQ.", "core": ["Keys: a super key identifies a row; a candidate key is a minimal super key; the primary key is the chosen candidate; a foreign key references another table's key.", "Normalisation removes redundancy that causes insert, update and delete anomalies. 1NF: atomic values. 2NF: 1NF and no partial dependency on part of a composite key. 3NF: 2NF and no transitive dependency (non-key → non-key). BCNF: every determinant is a candidate key.", "Denormalisation trades redundancy for faster reads, common in analytics and NoSQL."], "points": ["Example: Student(roll, name, dept, dept_head) → dept_head depends on dept → split into Student and Dept for 3NF", "Lossless join and dependency preservation", "ER diagram → tables"], "code": "", "pit": ["Not giving a concrete table example"], "ask": ["Explain 1NF to 3NF with one table.", "Difference between 3NF and BCNF?", "Primary vs unique key?"], "prac": [], "learn": [["GfG: normal forms", "https://www.geeksforgeeks.org/dbms/normal-forms-in-dbms/"], ["Gate Smashers (YouTube)", "https://www.youtube.com/@GateSmashers"], ["CMU 15-445 (free lectures)", "https://15445.courses.cs.cmu.edu"]], "rel": ["acid", "indexing", "sql"], "qa": []}, {"id": "acid", "title": "Transactions, ACID and isolation", "cat": "Core CS", "lvl": 2, "why": "Asked at every product company, especially fintechs like Razorpay where money moves.", "core": ["Atomicity (all or nothing, via undo logs), Consistency (constraints hold before and after), Isolation (concurrent transactions behave as if run in some order), Durability (committed data survives crashes, via write-ahead logging).", "Anomalies: dirty read, non-repeatable read, phantom read. Isolation levels: Read Uncommitted (allows all), Read Committed (stops dirty reads), Repeatable Read (also stops non-repeatable reads), Serializable (stops phantoms).", "Implementations use locks (two-phase locking) or MVCC (each transaction reads a snapshot; PostgreSQL, MySQL InnoDB)."], "points": ["Read Committed prevents dirty reads", "2PL: growing phase then shrinking phase", "Deadlocks between transactions are detected and one is rolled back"], "code": "", "pit": ["Saying 'Consistency' means the same as in CAP (it doesn't)"], "ask": ["Explain ACID with a bank transfer.", "Which isolation level prevents dirty reads?", "What is MVCC?"], "prac": [], "learn": [["GfG: ACID", "https://www.geeksforgeeks.org/dbms/acid-properties-in-dbms/"], ["CMU 15-445", "https://15445.courses.cs.cmu.edu"]], "rel": ["normalisation", "deadlock", "cap"], "qa": []}, {"id": "indexing", "title": "Indexing and B+ trees", "cat": "Core CS", "lvl": 2, "why": "'Why is my query slow?' is a real-job question and a favourite follow-up in backend interviews.", "core": ["An index is a separate structure that maps column values to row locations so the database avoids scanning the whole table.", "Most databases use B+ trees: wide, shallow trees (each node holds hundreds of keys, sized to a disk page) with all values in linked leaves. A lookup touches about 3–4 pages for millions of rows, and range scans walk the leaves.", "A clustered index stores rows in key order (one per table, usually the primary key); secondary indexes point to it. Composite indexes follow the leftmost-prefix rule."], "points": ["Indexes speed reads but slow writes and use space", "Covering index answers a query from the index alone", "Hash indexes: equality only, no ranges", "Use EXPLAIN to see the query plan"], "code": "", "pit": ["Indexing low-cardinality columns (gender) expecting gains", "Applying a function to an indexed column in WHERE stops index use"], "ask": ["How does an index speed up a query?", "Why B+ tree and not a binary tree or hash?", "Clustered vs non-clustered?"], "prac": [], "learn": [["Use The Index, Luke (free)", "https://use-the-index-luke.com"], ["CMU 15-445", "https://15445.courses.cs.cmu.edu"]], "rel": ["normalisation", "sql"], "qa": []}, {"id": "sql", "title": "SQL for interviews", "cat": "Core CS", "lvl": 1, "why": "Many OAs include 1–2 SQL questions; analyst-flavoured and backend roles always do.", "core": ["Order of evaluation: FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. WHERE filters rows, HAVING filters groups.", "Joins: INNER (matches only), LEFT (all left rows), self-join (employee–manager), anti-join (LEFT JOIN … WHERE right.id IS NULL).", "Window functions compute over a partition without collapsing rows: ROW_NUMBER, RANK, DENSE_RANK, LAG/LEAD, running SUM() OVER (ORDER BY …)."], "points": ["DENSE_RANK for 'Nth highest' with ties", "COUNT(col) ignores NULLs, COUNT(*) doesn't", "Parameterised queries prevent SQL injection"], "code": "SELECT dept, name, salary FROM (\n  SELECT d.name AS dept, e.name, e.salary,\n         DENSE_RANK() OVER (PARTITION BY e.dept_id ORDER BY e.salary DESC) AS r\n  FROM employee e JOIN department d ON d.id = e.dept_id\n) t WHERE r = 2;", "pit": ["Using WHERE with an aggregate", "Forgetting NULL handling in comparisons"], "ask": ["Second-highest salary per department.", "Find duplicate emails.", "Difference between RANK and DENSE_RANK?"], "prac": [["LeetCode SQL 50", "https://leetcode.com/studyplan/top-sql-50/"], ["SQLBolt", "https://sqlbolt.com"]], "learn": [["SQLBolt", "https://sqlbolt.com"], ["Mode SQL tutorial", "https://mode.com/sql-tutorial/"]], "rel": ["indexing", "sqli"], "qa": []}, {"id": "osi-tcpip", "title": "OSI and TCP/IP models", "cat": "Core CS", "lvl": 1, "why": "The first Computer Networks question in most interviews, and the vocabulary for everything in security.", "core": ["OSI has 7 layers: Physical, Data link (MAC, switches), Network (IP, routers), Transport (TCP/UDP, ports), Session, Presentation, Application. TCP/IP merges them into 4: Link, Internet, Transport, Application.", "Each layer wraps the one above with its own header (encapsulation): HTTP data → TCP segment → IP packet → Ethernet frame."], "points": ["Devices: hub (L1), switch (L2), router (L3)", "ARP maps IP → MAC", "Subnetting: /24 = 256 addresses, 254 usable hosts"], "code": "", "pit": ["Putting TLS or HTTP at the wrong layer without explaining"], "ask": ["Explain the OSI model.", "Which layer does a router work at?", "What is ARP?"], "prac": [], "learn": [["Gate Smashers (YouTube)", "https://www.youtube.com/@GateSmashers"], ["Computer Networking: A Top-Down Approach (Kurose)", "https://gaia.cs.umass.edu/kurose_ross/index.php"]], "rel": ["tcp-udp", "url-flow"], "qa": []}, {"id": "tcp-udp", "title": "TCP vs UDP and the handshake", "cat": "Core CS", "lvl": 1, "why": "Asked in nearly every CN round; the 'why not 2-way?' follow-up catches people out.", "core": ["TCP is connection-oriented and reliable: ordered delivery, retransmission, flow control (receiver window) and congestion control (slow start, congestion avoidance, fast retransmit). UDP is connectionless with no guarantees but low overhead and latency.", "Handshake: client SYN (seq x) → server SYN-ACK (seq y, ack x+1) → client ACK (ack y+1). Three steps are needed so both sides confirm the other received their initial sequence number; two would leave the server unsure the client saw its SYN, and stale duplicate SYNs could open ghost connections.", "Closing uses FIN/ACK in four steps; TIME_WAIT keeps the socket around to absorb late packets."], "points": ["Use UDP for video calls, games, DNS, live streams; QUIC builds reliability on UDP", "Flow control protects the receiver; congestion control protects the network", "SYN flood attack exploits half-open connections (SYN cookies defend)"], "code": "", "pit": ["Mixing flow and congestion control"], "ask": ["Why a 3-way and not 2-way handshake?", "When would you choose UDP?", "Flow vs congestion control?"], "prac": [], "learn": [["Kurose & Ross", "https://gaia.cs.umass.edu/kurose_ross/index.php"], ["Gate Smashers (YouTube)", "https://www.youtube.com/@GateSmashers"]], "rel": ["osi-tcpip", "http-tls"], "qa": []}, {"id": "http-tls", "title": "HTTP, HTTPS and TLS", "cat": "Core CS", "lvl": 2, "why": "Bridges CN and security. Your AppSec and cloud work depends on it.", "core": ["HTTP is a stateless request/response protocol: methods (GET, POST, PUT, DELETE, PATCH), status codes (2xx ok, 3xx redirect, 4xx client error, 5xx server error), headers, cookies for state.", "HTTPS is HTTP over TLS. In TLS 1.3 the client and server agree keys with an ephemeral Diffie-Hellman exchange, the server proves its identity with a certificate signed by a trusted CA, and then traffic is encrypted with a fast symmetric cipher (AES-GCM or ChaCha20).", "HTTP/2 multiplexes streams over one TCP connection; HTTP/3 runs over QUIC (UDP) to avoid head-of-line blocking."], "points": ["Asymmetric crypto for key exchange/auth, symmetric for bulk data", "Security headers: HSTS, CSP, X-Frame-Options", "Idempotent methods: GET, PUT, DELETE"], "code": "", "pit": ["Saying HTTPS encrypts with the server's public key directly (old RSA key exchange, not TLS 1.3)"], "ask": ["How does HTTPS work?", "Difference between HTTP/1.1, 2 and 3?", "What are cookies and how are they secured?"], "prac": [], "learn": [["The Illustrated TLS 1.3 Connection", "https://tls13.xargs.org"], ["MDN HTTP docs", "https://developer.mozilla.org/en-US/docs/Web/HTTP"]], "rel": ["tcp-udp", "url-flow", "crypto-basics"], "qa": []}, {"id": "url-flow", "title": "What happens when you type a URL", "cat": "Core CS", "lvl": 2, "why": "The single most popular CN interview question. It lets you show breadth from DNS to rendering.", "core": ["1) Browser checks its caches and parses the URL. 2) DNS resolution: browser → OS → resolver → root → TLD (.com) → authoritative server, giving an IP. 3) TCP handshake (or QUIC). 4) TLS handshake. 5) HTTP request sent; it may pass through a CDN, load balancer and reverse proxy. 6) The server builds a response (app server, cache, database). 7) The browser parses HTML, fetches CSS/JS/images, builds the DOM and CSSOM, lays out and paints.", "Go deeper on whichever layer the interviewer prods: DNS record types (A, AAAA, CNAME, MX), TTL caching, ARP on the local network, keep-alive."], "points": ["DNS uses UDP port 53 (TCP for large responses)", "Mention a CDN and load balancer to show system awareness", "Security add-on: HSTS, certificate validation"], "code": "", "pit": ["Skipping DNS or TLS", "Going so deep on one step you never finish"], "ask": ["What happens when you type google.com and press Enter?", "How does DNS resolution work?"], "prac": [], "learn": [["alex/what-happens-when (GitHub)", "https://github.com/alex/what-happens-when"]], "rel": ["osi-tcpip", "tcp-udp", "http-tls", "caching"], "qa": []}, {"id": "oop", "title": "OOP: the four pillars", "cat": "Core CS", "lvl": 1, "why": "Asked in every service-company interview and most product ones, often with 'show me in C++'.", "core": ["Encapsulation: bundle data with methods and hide internals (private members, public interface). Abstraction: expose what an object does, not how (abstract classes, interfaces). Inheritance: a class reuses and extends another ('is-a'). Polymorphism: one interface, many forms; compile-time (overloading, templates) and run-time (virtual functions).", "Prefer composition ('has-a') over deep inheritance trees."], "points": ["Overloading = same name, different parameters (compile time)", "Overriding = derived class redefines a virtual function (run time)", "Abstract class has at least one pure virtual function"], "code": "struct Shape { virtual double area() const = 0; virtual ~Shape() = default; };\nstruct Circle : Shape { double r; explicit Circle(double r) : r(r) {}\n    double area() const override { return 3.14159 * r * r; } };\nstd::unique_ptr<Shape> s = std::make_unique<Circle>(2.0); // runtime polymorphism", "pit": ["Forgetting a virtual destructor in a base class"], "ask": ["Explain the four pillars with examples.", "Overloading vs overriding?", "Abstract class vs interface?"], "prac": [], "learn": [["learncpp.com: OOP chapters", "https://www.learncpp.com"], ["GfG: OOP in C++", "https://www.geeksforgeeks.org/cpp/object-oriented-programming-in-cpp/"]], "rel": ["vtable", "solid", "lld"], "qa": []}, {"id": "vtable", "title": "Virtual functions and the vtable", "cat": "Core CS", "lvl": 2, "why": "A C++-specific depth question that separates prepared candidates, and essential for HFT and binary exploitation.", "core": ["Each class with virtual functions has a vtable: an array of function pointers to its versions of those functions. Each object stores a hidden vptr pointing to its class's vtable.", "A virtual call loads the vptr, indexes the vtable and jumps: one extra indirection, and it usually blocks inlining (why low-latency C++ avoids virtual calls on hot paths, using templates/CRTP instead).", "Constructors set the vptr, so calling a virtual function inside a constructor uses the current class's version, not the derived one."], "points": ["Virtual destructor needed for delete through a base pointer", "Object slicing: copying a derived object into a base by value", "Overwriting a vptr is a classic exploitation primitive"], "code": "", "pit": ["Thinking vtables are per object (they're per class)"], "ask": ["How does a virtual function call work?", "Why should base destructors be virtual?", "What is object slicing?"], "prac": [], "learn": [["learncpp: the virtual table", "https://www.learncpp.com/cpp-tutorial/the-virtual-table/"]], "rel": ["oop", "binary-exploitation"], "qa": []}, {"id": "solid", "title": "SOLID and design patterns", "cat": "Core CS", "lvl": 2, "why": "The vocabulary of every LLD round.", "core": ["S: single responsibility. O: open for extension, closed for modification. L: Liskov substitution (a subclass must work wherever the base does). I: interface segregation (small, focused interfaces). D: dependency inversion (depend on abstractions, inject dependencies).", "Patterns to know cold: Singleton (one instance; thread-safe via a function-local static in C++11), Factory (create objects without naming concrete classes), Strategy (swap algorithms at runtime), Observer (subscribers notified of events), plus Decorator and Adapter."], "points": ["Square-Rectangle is the classic Liskov violation", "Strategy = pass a pricing/parking-fee policy object", "Observer = notification systems"], "code": "", "pit": ["Naming patterns without a concrete use case"], "ask": ["Explain SOLID with examples.", "Implement a thread-safe singleton.", "Where would you use the strategy pattern?"], "prac": [], "learn": [["Refactoring.Guru design patterns (free)", "https://refactoring.guru/design-patterns"], ["awesome-low-level-design", "https://github.com/ashishps1/awesome-low-level-design"]], "rel": ["oop", "lld"], "qa": []}, {"id": "lld", "title": "Low-level design (LLD)", "cat": "Design", "lvl": 1, "why": "Freshers at product companies get LLD more often than HLD. Flipkart, Swiggy, Atlassian and others run a machine-coding or LLD round.", "core": ["Process: clarify requirements and scope (5 min) → list entities (nouns) and behaviours (verbs) → define classes, fields and relationships → key interfaces → walk through one flow → discuss extensions, concurrency and patterns used.", "Practise: parking lot, library management, Splitwise, elevator, snake and ladder, BookMyShow, rate limiter, LRU cache, vending machine."], "points": ["Draw a class diagram first", "Use enums for states and types", "Mention thread safety where shared state exists", "Machine-coding rounds want runnable, clean code in 60–90 min"], "code": "", "pit": ["Starting to code before agreeing on requirements", "God classes that do everything"], "ask": ["Design a parking lot.", "Design Splitwise.", "Design an elevator system."], "prac": [], "learn": [["awesome-low-level-design", "https://github.com/ashishps1/awesome-low-level-design"], ["Refactoring.Guru", "https://refactoring.guru/design-patterns"]], "rel": ["solid", "oop", "hld"], "qa": []}, {"id": "hld", "title": "High-level system design (HLD)", "cat": "Design", "lvl": 2, "why": "Big Tech asks light HLD even for new grads; a clear design discussion lifts you above candidates who only grind DSA. Your AWS SAA prep covers half of it.", "core": ["Framework: requirements (functional + non-functional: scale, latency, availability) → back-of-envelope numbers (QPS, storage) → API → data model → high-level diagram → deep dive on the bottleneck → trade-offs.", "Building blocks: load balancer, stateless app servers, cache (Redis), CDN, SQL vs NoSQL, replication, sharding, message queues (SQS/Kafka), object storage (S3), rate limiter, search index.", "Starter designs: URL shortener, pastebin, rate limiter, chat app, news feed, notification service."], "points": ["1 day ≈ 10⁵ seconds; 1M requests/day ≈ 12 QPS", "Read-heavy → cache + replicas; write-heavy → sharding + queues", "State the trade-off you chose and why"], "code": "", "pit": ["Jumping to microservices for a simple system", "No numbers"], "ask": ["Design a URL shortener.", "How would you scale it to 100× traffic?"], "prac": [], "learn": [["System Design Primer", "https://github.com/donnemartin/system-design-primer"], ["roadmap.sh system design", "https://roadmap.sh/system-design"], ["ByteByteGo blog (free posts)", "https://blog.bytebytego.com"]], "rel": ["caching", "cap", "load-balancing", "lld"], "qa": []}, {"id": "caching", "title": "Caching and CDNs", "cat": "Design", "lvl": 2, "why": "The first scaling answer in any design question, and it links to LRU (a DSA favourite).", "core": ["A cache keeps hot data in fast storage. Patterns: cache-aside (app reads cache, falls back to DB and fills cache), write-through (write cache and DB together), write-back (write cache, flush later).", "Eviction: LRU, LFU, TTL. Invalidation is the hard part: set TTLs, delete on write, version keys.", "A CDN caches static (and some dynamic) content at edge locations close to users (CloudFront on AWS)."], "points": ["Cache stampede: many misses at once; use locking or early refresh", "Hit ratio is the metric", "LRU = hash map + doubly linked list"], "code": "", "pit": ["Caching data that must be strongly consistent without a plan"], "ask": ["How would you add caching to this system?", "How do you keep the cache consistent?"], "prac": [], "learn": [["System Design Primer: cache", "https://github.com/donnemartin/system-design-primer#cache"]], "rel": ["hld", "linked-list"], "qa": []}, {"id": "load-balancing", "title": "Load balancing, replication and sharding", "cat": "Design", "lvl": 2, "why": "Core scaling vocabulary for HLD rounds and AWS SAA.", "core": ["A load balancer spreads requests across servers (round robin, least connections, consistent hashing) and removes unhealthy ones via health checks. L4 balances by IP/port, L7 by HTTP content.", "Replication copies data to more nodes for read scaling and availability (leader-follower; replication lag means followers can be stale). Sharding splits data across nodes by a key for write scaling; choose a key that spreads load evenly and avoids cross-shard queries.", "Consistent hashing keeps most keys in place when nodes join or leave."], "points": ["AWS: ALB (L7), NLB (L4), Auto Scaling groups, RDS read replicas, DynamoDB partitions", "Hot shard problem: celebrity users"], "code": "", "pit": ["Sharding before trying caching and replicas"], "ask": ["How would you shard a users table?", "What is consistent hashing?"], "prac": [], "learn": [["System Design Primer", "https://github.com/donnemartin/system-design-primer"]], "rel": ["hld", "cap", "aws-core"], "qa": []}, {"id": "cap", "title": "CAP theorem and consistency", "cat": "Design", "lvl": 3, "why": "An L3 depth question that shows you understand distributed trade-offs.", "core": ["During a network partition, a distributed store must choose between consistency (every read sees the latest write) and availability (every request gets a response). PACELC adds: Else, when there's no partition, choose between latency and consistency.", "Consistency models range from strong (linearisable) to eventual. Banking ledgers lean to consistency; social feeds lean to availability."], "points": ["Quorums: R + W > N gives read-your-writes", "Idempotency keys make retries safe (payments)"], "code": "", "pit": ["Saying a system can 'pick two' outside partitions"], "ask": ["Explain CAP with an example.", "How do you make a payment API safe to retry?"], "prac": [], "learn": [["Designing Data-Intensive Applications (book)", "https://dataintensive.net"]], "rel": ["hld", "acid"], "qa": []}, {"id": "qa-os", "title": "Operating systems: model answers", "cat": "Q&A", "lvl": 2, "why": "OS is asked in nearly every technical round. These are the questions that come up most.", "core": ["Read the question, answer it out loud from memory, then open the model answer and compare. Mark the ones you missed and re-do them in 3 days."], "points": [], "code": "", "pit": [], "ask": [], "prac": [], "learn": [["OSTEP (free book)", "https://pages.cs.wisc.edu/~remzi/OSTEP/"]], "rel": ["process-thread", "deadlock", "virtual-memory", "sync", "scheduling"], "qa": [["What is the difference between a process and a thread?", "A process is a running program with its own address space, open files and a process control block. A thread is a unit of execution inside a process; threads of the same process share code, heap and files but each has its own stack, registers and program counter. Threads are cheaper to create and switch between because no new address space is needed and the TLB isn't flushed. The cost is safety: a bug or race in one thread can corrupt the whole process, so shared data needs synchronisation."], ["What happens during a context switch?", "The kernel saves the running task's CPU state (registers, program counter, stack pointer) into its PCB or thread control block, picks the next task with the scheduler, restores that task's saved state and, if it belongs to another process, switches the page tables, which also invalidates TLB entries. Context switches are pure overhead, which is why too small a round-robin time quantum hurts throughput."], ["What are the four conditions for deadlock, and how do you prevent it?", "Mutual exclusion, hold and wait, no preemption and circular wait; all four must hold. Prevention breaks one of them. In practice the easiest is circular wait: acquire locks in one fixed global order. Others: request all resources at once (breaks hold and wait), or allow preemption. Avoidance (Banker's algorithm) only grants a request if the system stays in a safe state. Detection builds a wait-for graph and recovers by killing or rolling back a process."], ["Mutex vs semaphore?", "A mutex is a lock with an owner: one thread locks it and the same thread must unlock it, giving mutual exclusion for a critical section. A semaphore is a counter with wait (decrement, block at zero) and signal (increment). A counting semaphore lets up to N threads use N identical resources, like a pool of 5 database connections. A binary semaphore looks like a mutex but has no owner, so it's also used for signalling between threads, for example producer to consumer."], ["What is virtual memory and why is it used?", "Each process sees a private, contiguous address space. The MMU translates virtual pages to physical frames through page tables, with the TLB caching recent translations. Benefits: isolation between processes, running programs larger than RAM by keeping only the working set in memory, simpler loading and linking, and sharing (shared libraries, copy-on-write after fork). The cost is translation overhead and page faults."], ["What is a page fault and what is thrashing?", "A page fault occurs when a process touches a page that isn't in RAM. The OS traps, finds the page on disk, picks a victim frame with a replacement policy such as LRU, loads the page, updates the page table and restarts the instruction. Thrashing is when the combined working sets don't fit in memory, so the system spends most of its time paging instead of executing. Fixes: reduce the degree of multiprogramming or add memory."], ["Compare FCFS, SJF and round robin scheduling.", "FCFS runs jobs in arrival order; simple but short jobs wait behind long ones (convoy effect). SJF picks the shortest burst and gives the minimum average waiting time, but needs burst estimates and can starve long jobs. Round robin gives each process a time quantum in turn: good response time for interactive systems; the quantum must be large relative to the context-switch cost. Real systems use multilevel feedback queues or Linux's CFS."], ["What is a race condition, and what is a critical section?", "A race condition is when the result depends on the timing of threads accessing shared data, for example two threads doing count++ (load, add, store) and losing an update. The critical section is the code that touches the shared data. A correct solution needs mutual exclusion, progress and bounded waiting, implemented with locks, semaphores or atomic operations."], ["What are zombie and orphan processes?", "A zombie has finished but its parent hasn't called wait() to read its exit status, so its process-table entry remains. An orphan's parent died first; it's re-parented to init or systemd, which reaps it. Many zombies can exhaust process IDs, so parents must wait() or handle SIGCHLD."], ["What do fork() and exec() do?", "fork() creates a child that is a copy of the parent; modern kernels share pages copy-on-write until either side writes. It returns 0 in the child and the child's PID in the parent. exec() replaces the current process image with a new program, keeping the PID and open file descriptors. A shell runs a command with fork, then exec in the child, while the parent waits."], ["Internal vs external fragmentation?", "Internal fragmentation is wasted space inside an allocated block, for example the unused part of the last page. External fragmentation is enough total free memory split into pieces too small to use, typical of variable-size allocation and segmentation. Paging removes external fragmentation at the cost of some internal fragmentation."]]}, {"id": "qa-dbms", "title": "DBMS and SQL: model answers", "cat": "Q&A", "lvl": 2, "why": "Every backend and fintech interview asks these; Razorpay-style companies go deeper on transactions.", "core": ["Read the question, answer it out loud from memory, then open the model answer and compare. Mark the ones you missed and re-do them in 3 days."], "points": [], "code": "", "pit": [], "ask": [], "prac": [], "learn": [["CMU 15-445 (free lectures)", "https://15445.courses.cs.cmu.edu"], ["Use The Index, Luke", "https://use-the-index-luke.com"]], "rel": ["acid", "normalisation", "indexing", "sql"], "qa": [["Explain normalisation up to 3NF with an example.", "Take Student(roll, name, dept, dept_head). 1NF: every value is atomic, no repeating groups. 2NF: no non-key column depends on part of a composite key. 3NF: no non-key column depends on another non-key column. dept_head depends on dept, not on roll, so it's a transitive dependency; split into Student(roll, name, dept) and Dept(dept, dept_head). This removes update anomalies: changing a head now touches one row."], ["What are the ACID properties?", "Atomicity: a transaction happens fully or not at all, using undo logs. Consistency: constraints hold before and after. Isolation: concurrent transactions behave as if run one after another, to the chosen isolation level. Durability: once committed, data survives crashes, using write-ahead logging. Example: a bank transfer debits one account and credits another; atomicity stops money disappearing if the system crashes in between."], ["Which isolation level prevents dirty reads? Explain the anomalies.", "A dirty read is reading another transaction's uncommitted data; a non-repeatable read is the same row returning different values within one transaction; a phantom read is a repeated range query returning new rows. Read Committed prevents dirty reads, Repeatable Read also prevents non-repeatable reads, and Serializable prevents phantoms. Higher isolation costs concurrency. PostgreSQL and MySQL implement these with MVCC snapshots."], ["How does an index speed up a query, and why B+ trees?", "Without an index the database scans every row. A B+ tree index keeps keys sorted in wide, shallow nodes sized to disk pages, so finding a key among millions takes about 3 to 4 page reads, and range queries walk the linked leaf level. Hash indexes are faster for exact matches but can't do ranges. Indexes speed reads but slow inserts and updates and use space."], ["Clustered vs non-clustered index?", "A clustered index determines the physical order of the rows; there's one per table, usually the primary key. A non-clustered (secondary)
