 index is a separate structure storing the key plus a pointer or the primary key, so lookups may need a second step. A covering index includes all columns the query needs and avoids that step."], ["Primary key vs unique key vs foreign key?", "A primary key uniquely identifies each row and can't be null; one per table. A unique key also enforces uniqueness but allows null (one or many nulls depending on the database) and a table can have several. A foreign key references another table's key and enforces referential integrity, for example orders.user_id must exist in users.id."], ["DELETE vs TRUNCATE vs DROP?", "DELETE removes chosen rows with WHERE, is logged row by row, fires triggers and can be rolled back. TRUNCATE removes all rows quickly by deallocating pages, usually can't use WHERE and resets identity counters. DROP removes the table itself along with its structure, indexes and constraints."], ["Write SQL for the second-highest salary per department.", "Use a window function: SELECT dept_id, name, salary FROM (SELECT e.*, DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS r FROM employee e) t WHERE r = 2. DENSE_RANK handles ties so two people sharing the top salary don't push the second-highest to rank 3. Without window functions, use a correlated subquery counting distinct higher salaries."], ["What is the difference between WHERE and HAVING?", "WHERE filters rows before grouping and can't use aggregates. HAVING filters groups after GROUP BY and can use aggregates, for example SELECT dept, COUNT(*) FROM emp GROUP BY dept HAVING COUNT(*) > 5. The logical order is FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY."], ["SQL vs NoSQL: when would you choose each?", "SQL databases give a fixed schema, joins and strong ACID transactions: good for payments, orders, anything relational. NoSQL stores (document, key-value, wide-column, graph) give flexible schemas and easier horizontal scaling, often with eventual consistency: good for huge write volumes, caching, feeds and logs. Many systems use both, for example PostgreSQL for orders and Redis for sessions."], ["How do you prevent SQL injection?", "Never build queries by concatenating user input. Use parameterised queries or prepared statements, where the query structure and the data are sent separately, so input can't change the query. Add least-privilege database accounts and input validation as extra layers."]]}, {"id": "qa-cn", "title": "Computer networks: model answers", "cat": "Q&A", "lvl": 2, "why": "CN questions are short but frequent, and they connect directly to your security work.", "core": ["Read the question, answer it out loud from memory, then open the model answer and compare. Mark the ones you missed and re-do them in 3 days."], "points": [], "code": "", "pit": [], "ask": [], "prac": [], "learn": [["Kurose and Ross", "https://gaia.cs.umass.edu/kurose_ross/index.php"], ["The Illustrated TLS 1.3 Connection", "https://tls13.xargs.org"]], "rel": ["osi-tcpip", "tcp-udp", "http-tls", "url-flow"], "qa": [["What happens when you type google.com and press Enter?", "The browser checks its caches, then resolves the name through DNS: OS cache, then a recursive resolver that asks the root, the .com TLD server and Google's authoritative server, returning an IP. The browser opens a TCP connection (three-way handshake) or QUIC, then a TLS handshake that checks Google's certificate and agrees keys. It sends an HTTP GET; the request may pass a CDN and load balancer to an application server. The response HTML is parsed, CSS, JS and images are fetched, and the page is laid out and painted."], ["Explain the TCP three-way handshake. Why not two?", "Client sends SYN with sequence number x; server replies SYN-ACK with its own sequence y and ack x+1; client sends ACK y+1. Three messages are needed so both sides know the other received their initial sequence number. With two, the server couldn't tell whether the client got its SYN, and an old duplicate SYN could open a ghost connection."], ["TCP vs UDP, and when would you use UDP?", "TCP is connection-oriented and reliable: ordered delivery, acknowledgements, retransmission, flow and congestion control. UDP sends independent datagrams with no guarantees and very little overhead. Use UDP when latency matters more than perfect delivery: video calls, online games, live streaming, DNS lookups. QUIC (HTTP/3) adds reliability on top of UDP to avoid TCP's head-of-line blocking."], ["Flow control vs congestion control?", "Flow control protects the receiver: the receiver advertises a window of how much it can buffer, and the sender never exceeds it. Congestion control protects the network: the sender keeps a congestion window that grows with slow start and additive increase, and shrinks sharply on packet loss (multiplicative decrease)."], ["Explain the OSI model and where common devices sit.", "Physical (bits on the wire), data link (frames, MAC addresses, switches), network (IP packets, routing, routers), transport (TCP/UDP, ports), session, presentation and application (HTTP, DNS). TCP/IP merges them into link, internet, transport and application. Each layer adds its own header: data, then segment, packet and frame."], ["How does HTTPS work?", "HTTPS is HTTP over TLS. In TLS 1.3 the client and server exchange ephemeral Diffie-Hellman key shares to derive a shared secret; the server proves its identity with a certificate signed by a trusted certificate authority, which the client verifies. After the handshake, traffic is encrypted and integrity-protected with a fast symmetric cipher such as AES-GCM. Asymmetric crypto is used only to authenticate and agree keys because it's slow."], ["What is DNS and which record types matter?", "DNS maps names to addresses through a hierarchy of servers with caching controlled by TTLs. A maps to IPv4, AAAA to IPv6, CNAME aliases one name to another, MX gives mail servers, NS names authoritative servers, TXT holds text such as SPF records. It mostly uses UDP port 53, falling back to TCP for large responses."], ["What is subnetting? How many hosts in a /26?", "Subnetting splits a network by borrowing host bits for the network part. A /26 leaves 32 − 26 = 6 host bits: 2⁶ = 64 addresses, minus the network and broadcast addresses, so 62 usable hosts. Subnetting limits broadcast domains and lets you apply security rules per subnet, like public and private subnets in an AWS VPC."], ["What is ARP, and what is ARP spoofing?", "ARP finds the MAC address for an IP on the local network: a host broadcasts 'who has 192.168.1.1?' and the owner replies with its MAC. ARP has no authentication, so an attacker can send forged replies and become the man in the middle. Defences include dynamic ARP inspection on switches and encrypting traffic with TLS."], ["HTTP/1.1 vs HTTP/2 vs HTTP/3?", "HTTP/1.1 sends requests one after another per connection (browsers open several connections). HTTP/2 multiplexes many streams over one TCP connection with header compression, but a lost TCP packet still blocks all streams. HTTP/3 runs over QUIC on UDP, so streams are independent and connection setup is faster."]]}, {"id": "qa-oop", "title": "OOP and C++: model answers", "cat": "Q&A", "lvl": 2, "why": "Every service-company round and most product rounds ask OOP; C++ depth is a plus for HFT.", "core": ["Read the question, answer it out loud from memory, then open the model answer and compare. Mark the ones you missed and re-do them in 3 days."], "points": [], "code": "", "pit": [], "ask": [], "prac": [], "learn": [["learncpp.com", "https://www.learncpp.com"], ["Refactoring.Guru", "https://refactoring.guru/design-patterns"]], "rel": ["oop", "vtable", "solid"], "qa": [["Explain the four pillars of OOP with examples.", "Encapsulation: keep data private and expose methods, like a BankAccount whose balance changes only through deposit and withdraw. Abstraction: show what an object does, not how, like an abstract Shape with area(). Inheritance: a Circle is a Shape and reuses its interface. Polymorphism: calling area() on a Shape reference runs Circle's or Square's version at run time through virtual functions; overloading and templates give compile-time polymorphism."], ["Overloading vs overriding?", "Overloading is the same function name with different parameter lists in the same scope, resolved at compile time. Overriding is a derived class redefining a base class's virtual function with the same signature, resolved at run time through the vtable. In C++, mark overrides with the override keyword so the compiler catches signature mistakes."], ["How does a virtual function call work in C++?", "Each class with virtual functions has a vtable, an array of pointers to its versions of those functions. Each object holds a hidden vptr to its class's vtable, set by the constructor. A virtual call loads the vptr, indexes the vtable and jumps: one extra indirection that usually prevents inlining."], ["Why should a base class destructor be virtual?", "If you delete a derived object through a base pointer and the destructor isn't virtual, only the base destructor runs; the derived part's resources leak and the behaviour is undefined. Any class meant to be used polymorphically should have a virtual destructor."], ["Abstract class vs interface?", "In C++ an abstract class has at least one pure virtual function (= 0) and can't be instantiated; it can still have data and implemented methods. An interface is the special case with only pure virtual functions and no data. Java and C# have a separate interface keyword; C++ uses abstract classes for both."], ["What is RAII?", "Resource Acquisition Is Initialisation: tie a resource's lifetime to an object's lifetime. The constructor acquires (memory, file, lock) and the destructor releases, so cleanup happens automatically even when an exception is thrown. unique_ptr, lock_guard and ifstream are RAII types; it's why modern C++ rarely needs raw new and delete."], ["unique_ptr vs shared_ptr?", "unique_ptr has one owner, can be moved but not copied, and has no overhead over a raw pointer. shared_ptr allows many owners through a reference count and frees the object when the count reaches zero; it costs an atomic counter and can leak through cycles, which weak_ptr breaks. Default to unique_ptr."], ["Explain SOLID briefly.", "Single responsibility: one reason to change. Open/closed: extend behaviour without editing existing code, through interfaces. Liskov substitution: a subclass must work anywhere its base does (a Square that breaks Rectangle's setters violates it). Interface segregation: small focused interfaces. Dependency inversion: depend on abstractions and inject concrete implementations."], ["Shallow copy vs deep copy?", "A shallow copy copies member values, so two objects end up pointing at the same heap memory, leading to double frees. A deep copy allocates new memory and copies the pointed-to data. If a class owns a raw resource, follow the rule of three/five (destructor, copy and move operations), or use RAII members like vector so the defaults are correct."], ["What is a static member, and what is const correctness?", "A static data member belongs to the class, not to any object, so all instances share it; a static member function has no this pointer. Const correctness means marking anything that shouldn't change as const: const references for parameters you only read, and const member functions that promise not to modify the object."]]}, {"id": "qa-security", "title": "Security and cloud: model answers", "cat": "Q&A", "lvl": 2, "why": "Your edge as a cybersecurity student: SDE interviewers remember a strong security answer.", "core": ["Read the question, answer it out loud from memory, then open the model answer and compare. Mark the ones you missed and re-do them in 3 days."], "points": [], "code": "", "pit": [], "ask": [], "prac": [], "learn": [["OWASP Cheat Sheet Series", "https://cheatsheetseries.owasp.org"], ["AWS IAM policy evaluation", "https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html"]], "rel": ["owasp", "sqli", "xss", "iam", "crypto-basics"], "qa": [["Authentication vs authorisation?", "Authentication verifies who you are (password, MFA, certificate). Authorisation decides what you may do once identified (roles, policies, ownership checks). Broken access control, the top OWASP risk, is an authorisation failure: the user is logged in but the app doesn't check they own the object they request."], ["Hashing vs encryption, and how should passwords be stored?", "Hashing is one-way and fixed-length, used for integrity. Encryption is reversible with a key. Passwords should be hashed with a slow, salted algorithm such as Argon2id or bcrypt: the salt defeats precomputed tables and the slowness makes brute force expensive. Never encrypt passwords or use a fast hash like MD5 or SHA-256 alone."], ["What is XSS and how do you prevent it?", "Cross-site scripting runs attacker-controlled JavaScript in another user's browser on your site, through reflected input, stored content or client-side DOM writes. Prevent it with context-aware output encoding, frameworks that escape by default, a Content-Security-Policy, and HttpOnly cookies so stolen scripts can't read session tokens."], ["What is CSRF?", "Cross-site request forgery makes a logged-in user's browser send an unwanted request, such as changing their email, from another site, because the browser attaches cookies automatically. Defences: SameSite cookies, anti-CSRF tokens tied to the session, and re-authentication for sensitive actions."], ["What is SSRF and why is it dangerous in the cloud?", "Server-side request forgery makes your server fetch a URL the attacker controls. They point it at internal services or the cloud metadata endpoint at 169.254.169.254 to steal temporary IAM credentials. Defend with allow-lists, blocking private address ranges after DNS resolution, IMDSv2 on AWS, and least-privilege instance roles."], ["How does AWS IAM decide whether a request is allowed?", "Everything starts denied. AWS evaluates all applicable policies: identity policies, resource policies, permission boundaries and organisation SCPs. An explicit Deny anywhere wins; otherwise an Allow is needed and nothing may cap it. That's why TenantWall uses explicit denies to enforce tenant isolation even if someone adds a broad allow later."], ["What is ABAC and why use it for multi-tenant isolation?", "Attribute-based access control grants access when attributes match, for example a principal's tenant tag equals a resource's tenant tag. One policy covers every tenant, so onboarding a new tenant needs no new policy, unlike role-per-tenant RBAC. The tags themselves must be protected so users can't re-tag themselves into another tenant."], ["How would you detect unauthorised access attempts in AWS?", "Enable CloudTrail, including S3 data events for sensitive buckets, and send it to CloudWatch Logs. Create a metric filter matching AccessDenied and UnauthorizedOperation error codes, put an alarm on the metric, and notify through SNS. GuardDuty adds managed threat detection. This is the monitoring layer in TenantWall."], ["Explain a buffer overflow and the main mitigations.", "Writing past the end of a stack buffer can overwrite the saved return address and redirect execution. Stack canaries detect the overwrite before return, NX/DEP stops executing injected code on the stack, and ASLR randomises addresses so the attacker must first leak one. Attackers respond with return-oriented programming and info leaks, so the real fix is bounds-checked code."], ["What is threat modelling?", "A structured way to find design-level risks before attackers do: draw the data flow and trust boundaries, then for each element ask STRIDE (spoofing, tampering, repudiation, information disclosure, denial of service, elevation of privilege), and record a mitigation for each threat. It turns 'is it secure?' into a checklist you can defend in an interview."]]}, {"id": "owasp", "title": "OWASP Top 10", "cat": "Security", "lvl": 1, "why": "The shared language of AppSec. Even SDE interviewers are impressed when you name the risk in your own project.", "core": ["The OWASP Top 10 (2021) lists the most critical web risks: A01 Broken Access Control, A02 Cryptographic Failures, A03 Injection (incl. XSS), A04 Insecure Design, A05 Security Misconfiguration, A06 Vulnerable and Outdated Components, A07 Identification and Authentication Failures, A08 Software and Data Integrity Failures, A09 Security Logging and Monitoring Failures, A10 Server-Side Request Forgery.", "Broken access control is #1: the app checks that you are logged in but not that you may access this object."], "points": ["Authentication = who you are; authorisation = what you may do", "Defence in depth: validate input, encode output, least privilege, logging", "A09 is exactly what TenantWall's CloudTrail + CloudWatch alarm addresses"], "code": "", "pit": ["Memorising the list without one exploit + one fix for each"], "ask": ["Name three OWASP risks and how you'd prevent them.", "Authentication vs authorisation?"], "prac": [["PortSwigger Web Security Academy", "https://portswigger.net/web-security/all-labs"]], "learn": [["OWASP Top 10", "https://owasp.org/www-project-top-ten/"], ["OWASP Cheat Sheet Series", "https://cheatsheetseries.owasp.org"]], "rel": ["sqli", "xss", "access-control", "ssrf"], "qa": []}, {"id": "sqli", "title": "SQL injection", "cat": "Security", "lvl": 1, "why": "The classic vulnerability; first PortSwigger topic and a guaranteed security interview question.", "core": ["Happens when user input is concatenated into a SQL query, so the input changes the query's structure. ' OR '1'='1 turns a login check into 'always true'; UNION SELECT reads other tables; blind SQLi infers data from true/false or timing differences.", "Fix: parameterised queries / prepared statements, which send the query and the data separately so data can never become code. Add least-privilege DB accounts and input validation as extra layers. Escaping by hand is fragile."], "points": ["ORMs are safe unless you build raw queries with strings", "Second-order SQLi: stored input used later in a query"], "code": "// vulnerable\nq = \"SELECT * FROM users WHERE name = '\" + name + \"'\";\n// safe (prepared statement)\nstmt = db.prepare(\"SELECT * FROM users WHERE name = ?\"); stmt.bind(1, name);", "pit": ["Thinking input filtering alone fixes it"], "ask": ["What is SQL injection and how do you prevent it?", "Why do prepared statements work?"], "prac": [["PortSwigger: SQL injection labs", "https://portswigger.net/web-security/sql-injection"]], "learn": [["PortSwigger: SQL injection", "https://portswigger.net/web-security/sql-injection"], ["OWASP SQLi prevention cheat sheet", "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"]], "rel": ["owasp", "sql"], "qa": []}, {"id": "xss", "title": "Cross-site scripting (XSS) and CSRF", "cat": "Security", "lvl": 1, "why": "The two most common client-side web bugs; asked in AppSec and full-stack interviews.", "core": ["XSS: attacker-controlled script runs in another user's browser on your site. Reflected (from the request), stored (saved in the database), DOM-based (client JS writes untrusted data into the page). Impact: steal session data, act as the user.", "Fix XSS: context-aware output encoding (HTML, attribute, JS, URL), frameworks that escape by default, a Content-Security-Policy, HttpOnly cookies.", "CSRF: a malicious site makes the victim's browser send an authenticated request (e.g. change email). Fix: SameSite cookies, anti-CSRF tokens, re-authentication for sensitive actions."], "points": ["innerHTML with user data → DOM XSS", "SameSite=Lax is the modern default in browsers", "CORS is not a CSRF defence"], "code": "", "pit": ["Confusing XSS (runs script) with CSRF (forges a request)"], "ask": ["Difference between XSS and CSRF?", "How does CSP help?"], "prac": [["PortSwigger: XSS labs", "https://portswigger.net/web-security/cross-site-scripting"], ["PortSwigger: CSRF labs", "https://portswigger.net/web-security/csrf"]], "learn": [["PortSwigger: XSS", "https://portswigger.net/web-security/cross-site-scripting"], ["PortSwigger: CSRF", "https://portswigger.net/web-security/csrf"]], "rel": ["owasp", "http-tls"], "qa": []}, {"id": "access-control", "title": "Broken access control and IDOR", "cat": "Security", "lvl": 2, "why": "OWASP #1 and the most common bug-bounty finding. Directly related to TenantWall's tenant isolation.", "core": ["IDOR (insecure direct object reference): the app uses an ID from the request (/invoice?id=1043) without checking the object belongs to the user. Change the ID, read someone else's data.", "Other forms: missing function-level checks (normal user calls /admin API), privilege escalation via a role parameter, path traversal.", "Fix: enforce authorisation on the server for every request and object (deny by default), centralise checks, use unguessable IDs only as extra defence, test with two accounts."], "points": ["Multi-tenant SaaS: every query filtered by tenant_id from the session, never from the request", "ABAC in TenantWall enforces this at the AWS layer with tags"], "code": "", "pit": ["Relying on hidden UI elements as access control"], "ask": ["What is IDOR and how would you test for it?", "How do you enforce tenant isolation?"], "prac": [["PortSwigger: access control labs", "https://portswigger.net/web-security/access-control"]], "learn": [["PortSwigger: access control", "https://portswigger.net/web-security/access-control"]], "rel": ["owasp", "abac", "iam"], "qa": []}, {"id": "ssrf", "title": "Server-side request forgery (SSRF)", "cat": "Security", "lvl": 2, "why": "OWASP A10 and the bug behind major cloud breaches; ties web security to AWS.", "core": ["The server fetches a URL the attacker controls (image preview, webhook, PDF generator). The attacker points it at internal addresses: localhost admin panels, internal services, or the cloud metadata endpoint (169.254.169.254) to steal temporary IAM credentials.", "Fix: allow-lists of destinations, block private and link-local ranges after DNS resolution, disable redirects, and on AWS require IMDSv2 (session tokens) and give instances least-privilege roles."], "points": ["The 2019 Capital One breach involved SSRF + over-privileged IAM role", "flaws.cloud level 5 shows the metadata attack"], "code": "", "pit": ["Blocking by string matching (bypassed with decimal IPs, DNS rebinding)"], "ask": ["What is SSRF and why is it dangerous in the cloud?"], "prac": [["PortSwigger: SSRF labs", "https://portswigger.net/web-security/ssrf"], ["flaws.cloud", "http://flaws.cloud"]], "learn": [["PortSwigger: SSRF", "https://portswigger.net/web-security/ssrf"]], "rel": ["owasp", "iam", "aws-core"], "qa": []}, {"id": "crypto-basics", "title": "Hashing, encryption and passwords", "cat": "Security", "lvl": 1, "why": "A common short question in security and backend interviews.", "core": ["Hashing is one-way and fixed-length (SHA-256): used for integrity and fingerprints. Encryption is reversible with a key: symmetric (AES, one shared key, fast) or asymmetric (RSA/ECC, public/private key pair, used for key exchange and signatures).", "Passwords: never encrypt, never plain-hash. Use a slow, salted password hash (Argon2id, bcrypt, scrypt). The salt stops precomputed rainbow tables; slowness stops brute force.", "Digital signatures: hash the message, sign with the private key; anyone verifies with the public key."], "points": ["Encoding (Base64) is not encryption", "MAC/HMAC = integrity + authenticity with a shared key", "AES-GCM gives encryption + integrity"], "code": "", "pit": ["Saying 'we hash with MD5' for passwords"], "ask": ["Hashing vs encryption?", "How should passwords be stored?", "Symmetric vs asymmetric?"], "prac": [], "learn": [["OWASP Password Storage cheat sheet", "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"], ["CryptoHack (free)", "https://cryptohack.org"]], "rel": ["http-tls", "owasp"], "qa": []}, {"id": "threat-modelling", "title": "Threat modelling (STRIDE)", "cat": "Security", "lvl": 2, "why": "Lets you add 'I threat-modelled it' to any project answer. Security-engineer interviews ask you to do it live.", "core": ["Draw the system's data flow: users, processes, data stores, trust boundaries. For each element, ask STRIDE: Spoofing (identity), Tampering (data), Repudiation (no audit trail), Information disclosure, Denial of service, Elevation of privilege.", "For each threat, record a mitigation and its priority. Four questions: what are we building, what can go wrong, what will we do about it, did we do a good job?"], "points": ["Trust boundaries are where most bugs live", "Repudiation → logging (CloudTrail)", "Elevation of privilege → IAM least privilege"], "code": "", "pit": ["A list of threats with no mitigations"], "ask": ["Threat-model a login page.", "Threat-model your project."], "prac": [], "learn": [["OWASP Threat Modeling", "https://owasp.org/www-community/Threat_Modeling"], ["Microsoft STRIDE", "https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats"]], "rel": ["owasp", "tenantwall"], "qa": []}, {"id": "binary-exploitation", "title": "Binary exploitation basics", "cat": "Security", "lvl": 3, "why": "Your L3 security rung and the binary taster from the roadmap. It makes your C/C++ and OS memory knowledge concrete, which HFT and systems interviewers value.", "core": ["Stack layout: local buffers sit below the saved frame pointer and return address. Writing past a buffer (gets, strcpy without bounds) overwrites the return address and redirects execution.", "Defences and bypasses: stack canaries (detect overwrite), NX/DEP (stack not executable → return-oriented programming chains existing code 'gadgets'), ASLR (randomised addresses → need an info leak), PIE, RELRO.", "Other bug classes: format strings (printf(user)), use-after-free and double free on the heap, integer overflows. Tools: GDB with pwndbg, pwntools, Ghidra for reversing, checksec."], "points": ["Start with pwn.college's program-security modules", "Write a short write-up for every challenge you solve", "Secure C++: bounds-checked containers, avoid raw C strings"], "code": "", "pit": ["Jumping to heap exploitation before stack basics"], "ask": ["What is a buffer overflow and how do canaries and ASLR stop it?", "What is ROP?"], "prac": [["pwn.college", "https://pwn.college"], ["picoCTF", "https://picoctf.org"], ["ROP Emporium", "https://ropemporium.com"]], "learn": [["pwn.college", "https://pwn.college"], ["Nightmare (free course)", "https://guyinatuxedo.github.io"]], "rel": ["virtual-memory", "vtable", "ctf"], "qa": []}, {"id": "ctf", "title": "CTFs and security labs", "cat": "Security", "lvl": 2, "why": "A proven hiring channel for security roles (see the KPMG story) and great resume proof.", "core": ["Jeopardy CTFs have categories: web, pwn (binary exploitation), reverse engineering, crypto, forensics, misc. Each solved challenge gives a flag.", "Path: OverTheWire Bandit (Linux) → picoCTF (all categories, beginner) → PortSwigger labs (web) → pwn.college (binary) → live CTFs on CTFtime with a team.", "Write up each solve on a blog or GitHub: problem, approach, the key insight, the fix. Write-ups are what recruiters can read."], "points": ["Join or form a college team; India has many college CTFs", "Top-25% finish in a mid-rated CTF is a solid resume line"], "code": "", "pit": ["Only reading write-ups without solving"], "ask": ["Tell me about a CTF challenge you solved."], "prac": [["OverTheWire Bandit", "https://overthewire.org/wargames/bandit/"], ["picoCTF", "https://picoctf.org"], ["CTFtime", "https://ctftime.org"], ["TryHackMe", "https://tryhackme.com"]], "learn": [["CTF101", "https://ctf101.org"]], "rel": ["binary-exploitation", "bug-bounty"], "qa": []}, {"id": "bug-bounty", "title": "Bug bounty and responsible disclosure", "cat": "Security", "lvl": 4, "why": "An accepted report is proof no college name can match. It's your L4 security goal.", "core": ["Bug bounty programmes pay or credit researchers for reporting vulnerabilities within a defined scope. Read the scope and rules first; testing out of scope is illegal.", "Start with recon on wide-scope programmes, focus on one bug class you know well (IDOR, access control, XSS), and read disclosed reports on HackerOne Hacktivity to learn what gets accepted.", "Responsible disclosure: report privately, give details and impact, don't access more data than needed, wait for a fix before publishing."], "points": ["Quality report: steps to reproduce, impact, fix suggestion", "Indian govt sites: report to CERT-In", "Duplicates are normal at first"], "code": "", "pit": ["Running automated scanners against programmes that forbid them"], "ask": ["Walk me through a vulnerability you found."], "prac": [["HackerOne Hacktivity", "https://hackerone.com/hacktivity"], ["Bugcrowd", "https://bugcrowd.com"]], "learn": [["PortSwigger Academy", "https://portswigger.net/web-security"], ["HackerOne Hacker101 (free)", "https://www.hacker101.com"]], "rel": ["access-control", "ctf"], "qa": []}, {"id": "iam", "title": "AWS IAM and least privilege", "cat": "Cloud", "lvl": 1, "why": "Week 1 of your AWS track and the heart of TenantWall. The most important AWS service for security roles.", "core": ["Principals (users, roles) get permissions from JSON policies: Effect (Allow/Deny), Action, Resource, Condition. Roles give temporary credentials and are preferred over long-lived user keys.", "Evaluation logic: everything starts as an implicit deny; an Allow grants access; an explicit Deny anywhere always wins (over any Allow). Permission boundaries and SCPs cap what can be allowed.", "Tools from your professor's list: the IAM Policy Generator builds policy JSON; IAM Access Analyzer finds resources shared outside your account and validates policies; it can generate least-privilege policies from CloudTrail activity."], "points": ["Explicit deny > allow > implicit deny", "Never use the root account day to day; enable MFA", "Use roles for EC2/Lambda, not access keys"], "code": "{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Deny\",\n    \"Action\": \"s3:*\",\n    \"Resource\": \"*\",\n    \"Condition\": {\"Bool\": {\"aws:SecureTransport\": \"false\"}}\n  }]\n}", "pit": ["Policies with \"Action\": \"*\" and \"Resource\": \"*\""], "ask": ["Explain IAM policy evaluation.", "Role vs user?", "How do you achieve least privilege?"], "prac": [], "learn": [["AWS docs: policy evaluation logic", "https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html"], ["AWS docs: IAM Access Analyzer", "https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html"], ["flaws2.cloud", "http://flaws2.cloud"]], "rel": ["abac", "tenantwall", "cloudtrail"], "qa": []}, {"id": "abac", "title": "ABAC: attribute-based access control", "cat": "Cloud", "lvl": 3, "why": "The core idea of your TenantWall paper.", "core": ["RBAC grants by role; ABAC grants by matching attributes. In AWS, attributes are tags on principals (aws:PrincipalTag/tenant) and on resources (aws:ResourceTag/tenant). One policy can say 'allow only when the principal's tenant tag equals the resource's tenant tag', so adding a tenant needs no new policy.", "For S3, use object or bucket tags, or prefix-based conditions (s3:prefix with ${aws:PrincipalTag/tenant}). Protect the tags themselves: deny changing tenant tags (aws:TagKeys, aws:RequestTag) so a user can't re-tag into another tenant."], "points": ["Scales better than one role per tenant", "Pair with an explicit deny on tag modification", "Test isolation with two tenant users (should get AccessDenied)"], "code": "\"Condition\": {\n  \"StringEquals\": {\n    \"aws:ResourceTag/tenant\": \"${aws:PrincipalTag/tenant}\"\n  }\n}", "pit": ["Letting principals edit their own tags"], "ask": ["RBAC vs ABAC?", "How does TenantWall stop tenant A reading tenant B's data?"], "prac": [], "learn": [["AWS docs: What is ABAC?", "https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html"], ["AWS docs: ABAC tutorial", "https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_attribute-based-access-control.html"]], "rel": ["iam", "tenantwall", "access-control"], "qa": []}, {"id": "cloudtrail", "title": "CloudTrail and CloudWatch alarms", "cat": "Cloud", "lvl": 2, "why": "Your professor asked for exactly this in TenantWall: log every access attempt and alert on denied ones.", "core": ["CloudTrail records API calls (who, what, when, from where). Management events are on by default; S3 object-level reads and writes need data events enabled on the trail. Send the trail to CloudWatch Logs.", "Create a metric filter on the log group with the pattern { ($.errorCode = \"*UnauthorizedOperation\") || ($.errorCode = \"AccessDenied*\") }, which turns matching events into a metric. Put a CloudWatch alarm on it (e.g. ≥ 1 in 5 minutes) whose action publishes to an SNS topic with an email subscription.", "Test: as tenant A, try to read tenant B's object; you should get AccessDenied, see the event in CloudTrail, the metric tick up and an email arrive."], "points": ["Confirm the SNS email subscription or nothing arrives", "Data events cost money; limit them to TenantWall buckets", "This maps to OWASP A09 (logging and monitoring failures)"], "code": "", "pit": ["Expecting S3 GetObject in CloudTrail without data events"], "ask": ["How would you detect unauthorised access attempts in AWS?"], "prac": [], "learn": [["AWS docs: CloudTrail data events", "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html"], ["AWS docs: CloudWatch alarms for CloudTrail", "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudwatch-alarms-for-cloudtrail.html"]], "rel": ["tenantwall", "iam"], "qa": []}, {"id": "tenantwall", "title": "TenantWall (your research project)", "cat": "Cloud", "lvl": 3, "why": "Your strongest resume line: real cloud security research with a professor. It deserves a polished write-up, a diagram and a 2-minute interview story.", "core": ["What: multi-tenant isolation on EC2 and S3 using ABAC (tag-matched IAM policies), so tenants can't reach each other's resources.", "Your professor's additions: a CloudTrail trail with S3 data events; a CloudWatch metric filter on AccessDenied/UnauthorizedOperation with an alarm and SNS email; policies built with the Policy Generator and checked with IAM Access Analyzer; a flowchart and an AWS-icon architecture diagram; explicit deny statements (confirm the exact meaning with your professor).", "Plan: deadline 21 Mar 2027. Build in Dec–Jan, run isolation tests and collect evidence (screenshots, alarm emails), write in Feb–Mar."], "points": ["Interview story: problem → design (ABAC) → how you proved isolation → what the alarm caught", "Diagram in diagrams.net with the AWS icon set", "Put the policies and test scripts on GitHub (no keys!)"], "code": "", "pit": ["Committing AWS keys to GitHub", "Leaving resources running and getting billed"], "ask": ["Tell me about your project.", "How did you verify isolation?", "What would you change at 1,000 tenants?"], "prac": [], "learn": [["diagrams.net (AWS icons)", "https://app.diagrams.net"], ["AWS docs: ABAC", "https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html"]], "rel": ["abac", "cloudtrail", "iam", "threat-modelling"], "qa": []}, {"id": "aws-core", "title": "AWS core services and the SAA-C03 exam", "cat": "Cloud", "lvl": 2, "why": "30 minutes a day from 16 Nov, exam in the week of 19 Apr 2027. Cloud skills plus a cert lift both SDE and security profiles.", "core": ["Compute: EC2 (instances, AMIs, security groups), Auto Scaling, Lambda. Storage: S3 (classes, versioning, lifecycle, encryption, Block Public Access), EBS, EFS. Databases: RDS (Multi-AZ for HA, read replicas for scale), DynamoDB, ElastiCache. Networking: VPC, public/private subnets, route tables, internet and NAT gateways, ALB/NLB, Route 53, CloudFront. Integration: SQS, SNS. Security: IAM, KMS, CloudTrail, GuardDuty.", "Exam domains: secure architectures 30%, resilient 26%, high-performing 24%, cost-optimised 20%. 65 questions, 130 minutes, pass mark 720/1000."], "points": ["Multi-AZ = availability; read replica = read scale", "NAT gateway lets private subnets reach the internet outbound only", "Set a billing alarm in week 1"], "code": "", "pit": ["Only watching videos; do the labs", "Leaving NAT gateways running (they cost hourly)"], "ask": ["Design a highly available web app on AWS.", "Security group vs NACL?"], "prac": [], "learn": [["AWS SAA-C03 exam guide", "https://aws.amazon.com/certification/certified-solutions-architect-associate/"], ["freeCodeCamp SAA course (YouTube)", "https://www.youtube.com/@freecodecamp"], ["AWS Skill Builder (free tier)", "https://skillbuilder.aws"]], "rel": ["iam", "load-balancing", "hld"], "qa": []}, {"id": "llm-rag", "title": "LLMs and RAG apps", "cat": "AI", "lvl": 2, "why": "Your AI track from 14 Dec (≤1 h). An AI + security project is a rare combination on a fresher resume.", "core": ["An LLM predicts the next token from a prompt; it knows only its training data and what you put in the context window.", "RAG (retrieval-augmented generation): split documents into chunks, embed them as vectors, store them in a vector index; at question time, embed the question, retrieve the closest chunks and put them in the prompt so the answer is grounded in your data.", "Tool calling lets the model request a function (search, database query) that your code runs. Evals: a fixed set of questions with expected answers to measure changes."], "points": ["Chunk size and overlap matter more than the model", "Always cite retrieved sources in answers", "Evaluate before and after every change"], "code": "", "pit": ["No evaluation set", "Putting secrets in prompts"], "ask": ["How does RAG work?", "How would you evaluate an LLM feature?"], "prac": [], "learn": [["DeepLearning.AI short courses (free)", "https://www.deeplearning.ai/short-courses/"], ["Anthropic docs", "https://docs.anthropic.com"]], "rel": ["prompt-injection"], "qa": []}, {"id": "prompt-injection", "title": "Prompt injection and AI security", "cat": "AI", "lvl": 3, "why": "Where your AI and cyber tracks meet. Few freshers can talk about it.", "core": ["Prompt injection: untrusted text (a web page, an email, a document in your RAG store) contains instructions that the model follows instead of the developer's. Direct injection comes from the user; indirect injection hides in retrieved content.", "Risks grow with tools: an injected instruction can make an agent leak data or take actions. Defences: treat model output as untrusted, least-privilege tools, human confirmation for risky actions, separate trusted instructions from data, output filtering, and red-team tests.", "The OWASP Top 10 for LLM applications lists prompt injection, sensitive information disclosure, supply chain, data poisoning, improper output handling, excessive agency and more."], "points": ["Build a test set of injection attempts for your RAG project", "Log and monitor model actions"], "code": "", "pit": ["Believing a system prompt alone stops injection"], "ask": ["What is prompt injection and how would you mitigate it?"], "prac": [], "learn": [["OWASP LLM Top 10", "https://genai.owasp.org/llm-top-10/"], ["Gandalf (Lakera) prompt-injection game", "https://gandalf.lakera.ai"]], "rel": ["llm-rag", "owasp"], "qa": []}, {"id": "probability", "title": "Probability for HFT interviews", "cat": "HFT", "lvl": 3, "why": "The later HFT track (Apr–Jul 2027). It also makes maths-heavy OA questions easy.", "core": ["Counting: permutations, combinations, stars and bars, inclusion–exclusion. Conditional probability and Bayes' rule: P(A|B) = P(B|A)·P(A) / P(B).", "Expectation is linear even for dependent variables: E[X + Y] = E[X] + E[Y]. Indicator variables turn counting questions into sums of probabilities (expected number of fixed points in a random permutation = 1).", "Condition on the first step for recursive questions: expected flips to get HH satisfies a small system of equations (answer 6). Gambler's ruin and random walks follow the same idea."], "points": ["Zetamac mental arithmetic: 40+ then 50+", "Fair price of a game = its expected value", "Write every solved puzzle's key idea in one line"], "code": "", "pit": ["Assuming independence without checking"], "ask": ["Expected number of rolls to see a 6?", "You flip until HH; expected flips?", "Bayes: a test is 99% accurate for a 1% disease; P(sick | positive)?"], "prac": [["Brainstellar", "https://www.brainstellar.com"], ["Zetamac", "https://arithmetic.zetamac.com"]], "learn": [["Harvard Stat 110", "https://projects.iq.harvard.edu/stat110"], ["Blitzstein & Hwang (free book)", "https://projects.iq.harvard.edu/stat110/home"]], "rel": ["cp"], "qa": []}, {"id": "umpire", "title": "The interview loop (UMPIRE)", "cat": "Career", "lvl": 1, "why": "A fixed routine for every DSA interview so nerves don't decide your structure.", "core": ["Understand: restate the problem, ask about input size, ranges, duplicates, empty input; agree on 2 examples. Match: name the pattern. Plan: describe the approach in words and give its complexity; get a nod. Implement: clean code, good names. Review: dry-run an example and an edge case. Evaluate: complexity, trade-offs, what you'd improve.", "Always say the brute force first. It shows you can solve it, gives you a fallback and often reveals the optimisation."], "points": ["Spend ~5 min understanding, ~5 planning, ~20 coding, ~5 testing in a 45-min round", "If stuck, think aloud about what you know; interviewers give hints to people who talk"], "code": "", "pit": ["Coding before th   for (const [k, v] of Object.entries(attrs)) { if (k === "style") e.style.cssText = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));

let store = {};

  const same = TOPICS.filter(x => x.cat === t.cat), i = same.indexOf(t);

function route() {

const q = $("#q"), res = $("#res"); let hits = [], sel = 0;
function draw() { res.replaceChildren(...hits.map((t, i) => el("a", {href: "#" + t.id, class: i === sel ? "on" : "", style: kvar(t.lvl)}, chip(t.lvl), t.title))); res.hidden = !hits.length; }
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase(); sel = 0;
  if (!s) { hits = []; return draw(); }
  const score = t => { const T = t.title.toLowerCase(); if (T.startsWith(s)) return 3; if (T.includes(s)) return 2; return (t.core.join(" ") + t.points.join(" ") + t.why + (t.qa || []).flat().join(" ")).toLowerCase().includes(s) ? 1 : 0; };
  hits = TOPICS.map(t => [score(t), t]).filter(x => x[0]).sort((a, b) => b[0] - a[0]).slice(0, 10).map(x => x[1]); draw();
});
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, hits.length - 1); draw(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
  else if (e.key === "Enter" && hits[sel]) { location.hash = hits[sel].id; q.value = ""; hits = []; draw(); q.blur(); }
  else if (e.key === "Escape") { q.value = ""; hits = []; draw(); }
});
res.addEventListener("click", () => { q.value = ""; hits = []; draw(); });
document.addEventListener("click", e => { if (!e.target.closest(".search")) { hits = []; draw(); } });
$("#menu").addEventListener("click", () => { const o = $("#rail").classList.toggle("open"); $("#menu").setAttribute("aria-expanded", String(o)); });
window.addEventListener("hashchange", route);
route();
</script>
